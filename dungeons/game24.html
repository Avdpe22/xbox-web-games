<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CORSAIR'S QUEST: THE TEN SEAS (HD OVERHAUL)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #050508;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            background-color: #0f4075;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1);
            /* Removed pixelated rendering for smoother HD vector graphics */
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1920" height="1080"></canvas>

<script>
/**
 * CORSAIR'S QUEST: THE TEN SEAS - HD OVERHAUL
 * Massive Open-World Puzzle Adventure optimized for Xbox Series S Controller
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- XBOX EDGE BROWSER FOCUS FIX ---
function ensureGameFocus() { window.focus(); canvas.focus({ preventScroll: true }); }
ensureGameFocus();
window.addEventListener('load', ensureGameFocus);
document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureGameFocus(); });
window.addEventListener('gamepadconnected', ensureGameFocus);
window.addEventListener('click', ensureGameFocus);

// --- PROCEDURAL AUDIO ENGINE ---
let audioCtx = null;
function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'swing') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'interact') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'push') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'secret') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(400, now + 0.15);
        osc.frequency.setValueAtTime(500, now + 0.3);
        osc.frequency.setValueAtTime(800, now + 0.45);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
        osc.start(now); osc.stop(now + 0.7);
    }
}

// --- INPUT MANAGEMENT ---
const Input = {
    pads: {},
    keys: { up: false, down: false, left: false, right: false, action: false, interact: false },
    poll() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i]) this.pads[i] = gamepads[i];
        }
    },
    getState() {
        const pad = this.pads[0];
        let vx = 0, vy = 0;
        let action = false, interact = false;

        if (pad) {
            if (Math.abs(pad.axes[0]) > 0.2) vx = pad.axes[0];
            if (Math.abs(pad.axes[1]) > 0.2) vy = pad.axes[1];
            if (pad.buttons[14]?.pressed) vx = -1;
            if (pad.buttons[15]?.pressed) vx = 1;
            if (pad.buttons[12]?.pressed) vy = -1;
            if (pad.buttons[13]?.pressed) vy = 1;

            action = pad.buttons[2]?.pressed || pad.buttons[7]?.pressed; // X or RT
            interact = pad.buttons[0]?.pressed; // A
        }

        if (this.keys.left) vx = -1;
        if (this.keys.right) vx = 1;
        if (this.keys.up) vy = -1;
        if (this.keys.down) vy = 1;
        if (this.keys.action) action = true;
        if (this.keys.interact) interact = true;

        if (vx !== 0 && vy !== 0) {
            const length = Math.hypot(vx, vy);
            vx /= length; vy /= length;
        }

        return { vx, vy, action, interact };
    }
};

// --- WORLD GENERATION & CONSTANTS ---
const TILE_SIZE = 40; 
const MAP_TILES = 120; // 4800x4800 pixel ocean

const TILES = {
    WATER: 0, SAND: 1, GRASS: 2, MOUNTAIN: 3, DOCK: 4, CAVE: 5
};

// Dungeon layout files, one per island puzzle. Add more .json files here
// (same shape as abyssaltrench.json) to give more islands their own unique maze -
// they'll be assigned to islands in order and cycle if there are more islands than files.
const DUNGEON_FILES = ['abyssaltrench.json', 'ironkeep.json', 'skullcave.json'];

let mapData = [];
let npcs = [];
let caveEntrances = []; // {x, y, islandIndex} in overworld tile coords
let islandGates = []; // {x, y, islandIndex} - mountain tile that opens once the island is unlocked
let islandDungeons = {}; // islandIndex -> { file, solved, unlocked }
let screenShake = 0;
let timeOffset = 0;

function generateWorld() {
    mapData = Array(MAP_TILES).fill().map(() => Array(MAP_TILES).fill(TILES.WATER));

    const islands = [
        {x: 15, y: 15}, {x: 45, y: 15}, {x: 80, y: 25}, {x: 105, y: 20},
        {x: 25, y: 50}, {x: 60, y: 60}, {x: 95, y: 65},
        {x: 20, y: 90}, {x: 60, y: 95}, {x: 100, y: 90}
    ];

    islands.forEach((center, idx) => {
        for(let dy=-8; dy<=8; dy++) {
            for(let dx=-8; dx<=8; dx++) {
                if (center.y+dy < 0 || center.y+dy >= MAP_TILES || center.x+dx < 0 || center.x+dx >= MAP_TILES) continue;
                let dist = Math.hypot(dx, dy);
                if(dist < 5.5) mapData[center.y+dy][center.x+dx] = TILES.GRASS;
                else if(dist < 7.5) mapData[center.y+dy][center.x+dx] = TILES.SAND;
            }
        }
        
        mapData[center.y+7][center.x] = TILES.DOCK;
        mapData[center.y+8][center.x] = TILES.WATER; // Water clearance for boat

        if (idx === 0) {
            npcs.push({x: center.x, y: center.y, text: "Ahoy! Sail to the first island and clear its dungeon. Every treasure you find breaks the barrier sealing the next island's shores!"});
        } else {
            for(let dy=-4; dy<=4; dy++) {
                for(let dx=-4; dx<=4; dx++) {
                    if (Math.abs(dx) === 4 || Math.abs(dy) === 4) {
                        mapData[center.y+dy][center.x+dx] = TILES.MOUNTAIN;
                    } else {
                        mapData[center.y+dy][center.x+dx] = TILES.GRASS;
                    }
                }
            }

            // Gate: a breach in the mountain ring facing the dock. Only the first
            // island starts open - the rest stay sealed until the previous island's
            // dungeon treasure is found (see the TREASURE branch in updateDungeon).
            const gateX = center.x;
            const gateY = center.y + 4;
            const unlocked = idx === 1;
            mapData[gateY][gateX] = unlocked ? TILES.GRASS : TILES.MOUNTAIN;
            islandGates.push({ x: gateX, y: gateY, islandIndex: idx });

            mapData[center.y][center.x] = TILES.CAVE;
            caveEntrances.push({ x: center.x, y: center.y, islandIndex: idx });
            islandDungeons[idx] = { file: DUNGEON_FILES[(idx - 1) % DUNGEON_FILES.length], solved: false, unlocked };
        }
    });
}

// --- ENTITIES & LOGIC ---

class Camera {
    constructor() { this.x = 0; this.y = 0; }
    update(target) {
        const targetX = target.x - 1920 / 2 + target.w / 2;
        const targetY = target.y - 1080 / 2 + target.h / 2;
        this.x += (targetX - this.x) * 0.1;
        this.y += (targetY - this.y) * 0.1;
        
        const maxW = MAP_TILES * TILE_SIZE - 1920;
        const maxH = MAP_TILES * TILE_SIZE - 1080;
        this.x = Math.max(0, Math.min(maxW, this.x));
        this.y = Math.max(0, Math.min(maxH, this.y));
    }
}

class Player {
    constructor() {
        this.x = 15 * TILE_SIZE;
        this.y = 22 * TILE_SIZE;
        this.w = 20; 
        this.h = 24;
        this.speed = 6;
        this.dir = 'down'; 
        
        this.state = 'walking'; 
        this.actionCooldown = 0;
        this.interactCooldown = 0;
        this.walkCycle = 0;
        
        // Ship coordinates
        this.shipX = 15 * TILE_SIZE;
        this.shipY = 23 * TILE_SIZE + 10;
        this.treasures = 0;
    }

    update(input) {
        if (this.actionCooldown > 0) this.actionCooldown--;
        if (this.interactCooldown > 0) this.interactCooldown--;

        let curSpeed = this.state === 'sailing' ? this.speed * 1.5 : this.speed;

        let dx = input.vx * curSpeed;
        let dy = input.vy * curSpeed;

        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0) this.dir = 'right';
            if (dx < 0) this.dir = 'left';
        } else if (Math.abs(dy) > 0) {
            if (dy > 0) this.dir = 'down';
            if (dy < 0) this.dir = 'up';
        }

        if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
            this.walkCycle += 0.2;
        }

        this.x += dx;
        if (this.checkCollision()) this.x -= dx;
        this.y += dy;
        if (this.checkCollision()) this.y -= dy;

        this.x = Math.max(0, Math.min(MAP_TILES * TILE_SIZE - this.w, this.x));
        this.y = Math.max(0, Math.min(MAP_TILES * TILE_SIZE - this.h, this.y));

        if (this.state === 'sailing') {
            this.shipX = this.x - 10;
            this.shipY = this.y - 10;
        }

        if (input.action && this.actionCooldown <= 0) {
            this.actionCooldown = 20;
            playSound('swing');
        }

        if (input.interact && this.interactCooldown <= 0) {
            this.interactCooldown = 30;
            this.handleInteraction();
        }
    }

    checkCollision() {
        const checkTiles = (px, py) => {
            const tX = Math.floor(px / TILE_SIZE);
            const tY = Math.floor(py / TILE_SIZE);
            if (tY < 0 || tY >= MAP_TILES || tX < 0 || tX >= MAP_TILES) return true;
            const tile = mapData[tY][tX];
            
            if (this.state === 'walking') {
                return tile === TILES.WATER || tile === TILES.MOUNTAIN;
            } else if (this.state === 'sailing') {
                return tile !== TILES.WATER && tile !== TILES.DOCK;
            }
        };

        // Smaller tolerance hitbox to prevent corner snagging
        return checkTiles(this.x + 4, this.y + 4) || checkTiles(this.x + this.w - 4, this.y + 4) || 
               checkTiles(this.x + 4, this.y + this.h - 4) || checkTiles(this.x + this.w - 4, this.y + this.h - 4);
    }

    handleInteraction() {
        const cx = Math.floor((this.x + this.w/2) / TILE_SIZE);
        const cy = Math.floor((this.y + this.h/2) / TILE_SIZE);
        const tile = mapData[cy][cx];

        // Docking Ship logic fixed
        if (this.state === 'walking' && tile === TILES.DOCK) {
            const dist = Math.hypot((this.x - this.shipX), (this.y - this.shipY));
            if (dist < 80) {
                this.state = 'sailing';
                playSound('interact');
                this.w = 20; this.h = 20; // Reduced ship collision box
                
                // Gently push player into the water clear of the dock edge to prevent insta-collision
                this.x = cx * TILE_SIZE + 10;
                this.y = (cy + 1) * TILE_SIZE + 10;
                
                displayMessage("Anchors aweigh!");
                return;
            }
        } else if (this.state === 'sailing' && tile === TILES.DOCK) {
            this.state = 'walking';
            playSound('interact');
            this.w = 20; this.h = 24; 
            
            // Anchor ship right below dock
            this.shipX = cx * TILE_SIZE + 10; 
            this.shipY = (cy + 1) * TILE_SIZE + 10;
            
            // Step onto dock
            this.x = cx * TILE_SIZE + 10;
            this.y = cy * TILE_SIZE + 10;
            
            displayMessage("Dropped anchor.");
            return;
        }

        if (this.state === 'walking' && tile === TILES.CAVE) {
            const cave = caveEntrances.find(c => c.x === cx && c.y === cy);
            if (cave) {
                enterDungeon(cave.islandIndex);
                return;
            }
        }

        let fx = cx; let fy = cy;
        if (this.dir === 'up') fy--; if (this.dir === 'down') fy++;
        if (this.dir === 'left') fx--; if (this.dir === 'right') fx++;

        if (this.state === 'walking') {
            const gate = islandGates.find(g => g.x === fx && g.y === fy);
            if (gate && !islandDungeons[gate.islandIndex].unlocked) {
                playSound('push');
                displayMessage("A magical barrier seals this island. Clear the previous island's dungeon to break it.");
                return;
            }

            for (let npc of npcs) {
                if (npc.x === fx && npc.y === fy) {
                    playSound('interact');
                    displayMessage(npc.text);
                }
            }
        }
    }

    draw(ctx) {
        if (this.state === 'walking') {
            ctx.save();
            ctx.translate(this.x + this.w/2, this.y + this.h/2);
            
            // Wobble walk animation
            if (this.actionCooldown === 0) {
                ctx.rotate(Math.sin(this.walkCycle) * 0.15);
            }

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(0, 10, 10, 4, 0, 0, Math.PI*2); ctx.fill();

            // Legs
            ctx.fillStyle = '#4a3b2c';
            const legWalk = Math.sin(this.walkCycle) * 4;
            ctx.fillRect(-6, 4 + legWalk, 4, 8);
            ctx.fillRect(2, 4 - legWalk, 4, 8);

            // Body
            ctx.fillStyle = '#e8dfd5';
            ctx.fillRect(-8, -4, 16, 12);
            
            // Sash
            ctx.fillStyle = '#cc2222';
            ctx.fillRect(-8, 4, 16, 4);

            // Head
            ctx.fillStyle = '#ffccaa'; 
            ctx.beginPath(); ctx.arc(0, -10, 8, 0, Math.PI*2); ctx.fill();
            
            // Bandana
            ctx.fillStyle = '#cc2222'; 
            ctx.beginPath(); ctx.arc(0, -12, 8, Math.PI, 0); ctx.fill();
            ctx.fillRect(-10, -12, 6, 4); // Bandana knot

            // Sword Swing
            if (this.actionCooldown > 10) {
                ctx.strokeStyle = '#eeeeee'; ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                if (this.dir === 'right') { ctx.moveTo(0,0); ctx.lineTo(25, -5); ctx.stroke(); }
                if (this.dir === 'left') { ctx.moveTo(0,0); ctx.lineTo(-25, -5); ctx.stroke(); }
                if (this.dir === 'up') { ctx.moveTo(0,0); ctx.lineTo(0, -30); ctx.stroke(); }
                if (this.dir === 'down') { ctx.moveTo(0,0); ctx.lineTo(0, 20); ctx.stroke(); }
            }
            ctx.restore();
        } else {
            this.drawShip(ctx, this.shipX, this.shipY);
        }
    }

    drawShip(ctx, x, y) {
        ctx.save();
        ctx.translate(x + 10, y + 10); // Center translation for rendering

        // Smooth rotation
        let targetAngle = 0;
        if (this.dir === 'right') targetAngle = Math.PI/2;
        if (this.dir === 'down') targetAngle = Math.PI;
        if (this.dir === 'left') targetAngle = -Math.PI/2;
        ctx.rotate(targetAngle);

        // Water ripple under ship
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath(); ctx.ellipse(0, 20, 18, 8, 0, 0, Math.PI*2); ctx.fill();

        // HD Hull
        ctx.fillStyle = '#5c4033';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(0, -25); 
        ctx.bezierCurveTo(15, -15, 18, 10, 12, 22);
        ctx.lineTo(-12, 22);
        ctx.bezierCurveTo(-18, 10, -15, -15, 0, -25);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;

        // Deck details
        ctx.fillStyle = '#8b6b4a';
        ctx.beginPath();
        ctx.moveTo(0, -18); 
        ctx.lineTo(8, 0); ctx.lineTo(8, 18);
        ctx.lineTo(-8, 18); ctx.lineTo(-8, 0);
        ctx.closePath(); ctx.fill();

        // Billowing Sails
        ctx.fillStyle = '#f4f4f4';
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 5;
        const wind = Math.sin(timeOffset * 2) * 3;
        
        // Fore sail
        ctx.beginPath(); 
        ctx.moveTo(0, -15); 
        ctx.quadraticCurveTo(18 + wind, -5, 18, 5); 
        ctx.quadraticCurveTo(0, 2, -18, 5); 
        ctx.quadraticCurveTo(-18 + wind, -5, 0, -15); 
        ctx.fill();

        // Main sail
        ctx.beginPath(); 
        ctx.moveTo(0, 0); 
        ctx.quadraticCurveTo(22 + wind, 12, 20, 22); 
        ctx.quadraticCurveTo(0, 18, -20, 22); 
        ctx.quadraticCurveTo(-22 + wind, 12, 0, 0); 
        ctx.fill();

        ctx.restore();
    }
}

// --- DUNGEON SYSTEM ---
// Each island's cave entrance loads a JSON layout (see abyssaltrench.json etc.)
// and flips the whole screen into that maze until the player finds the treasure
// tile ('X') or walks back out through the entrance tile.

const DUNGEON_TILES = { WALL: 0, FLOOR: 1, HAZARD: 2, TREASURE: 3, CLUE: 4 };
let dungeonDataCache = {};
let dungeon = null; // set while a dungeon screen is active

function charToDungeonTile(ch) {
    if (ch === 'M' || ch === 'W') return DUNGEON_TILES.WALL;
    if (ch === 'E') return DUNGEON_TILES.HAZARD;
    if (ch === 'X') return DUNGEON_TILES.TREASURE;
    if (ch === 'C') return DUNGEON_TILES.CLUE; // rubble/bones marking a dead end - flavor, not a wall
    return DUNGEON_TILES.FLOOR;
}

async function preloadDungeons() {
    await Promise.all(DUNGEON_FILES.map(async file => {
        try {
            const res = await fetch(file);
            dungeonDataCache[file] = await res.json();
        } catch (e) {
            console.warn(`Could not load dungeon file "${file}":`, e);
        }
    }));
}

// If a JSON's declared spawn point lands on a wall (bad data), find the nearest floor tile instead.
function findNearestFloor(tiles, x, y) {
    const h = tiles.length, w = tiles[0].length;
    const isFloor = (tx, ty) => tx >= 0 && ty >= 0 && tx < w && ty < h && tiles[ty][tx] !== DUNGEON_TILES.WALL;
    if (isFloor(x, y)) return { x, y };
    for (let radius = 1; radius < Math.max(w, h); radius++) {
        for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
                if (Math.max(Math.abs(dx), Math.abs(dy)) !== radius) continue;
                if (isFloor(x + dx, y + dy)) return { x: x + dx, y: y + dy };
            }
        }
    }
    return { x, y };
}

function enterDungeon(islandIndex) {
    const info = islandDungeons[islandIndex];
    if (!info) return;
    const data = dungeonDataCache[info.file];
    if (!data) { displayMessage("The cave is still being carved... try again in a moment."); return; }

    const tiles = data.layout.map(row => row.split('').map(charToDungeonTile));
    const h = tiles.length, w = tiles[0].length;
    const spawn = findNearestFloor(tiles, data.spawnX ?? 1, data.spawnY ?? 1);
    const tileSize = 56;
    const enemySize = 28;

    // Enemies patrol back and forth along one axis between spawn +/- range tiles.
    // Defeated by a sword swing (action button); reset fresh each time the dungeon is entered.
    const enemies = (data.enemies || []).map(e => {
        const speed = e.speed ?? 2;
        return {
            x: e.x * tileSize + (tileSize - enemySize) / 2,
            y: e.y * tileSize + (tileSize - enemySize) / 2,
            w: enemySize, h: enemySize,
            axis: e.axis || 'x',
            vx: e.axis === 'y' ? 0 : speed,
            vy: e.axis === 'y' ? speed : 0,
            traveled: 0,
            range: (e.range ?? 3) * tileSize,
            alive: true
        };
    });

    dungeon = {
        name: data.name || 'Dungeon',
        tiles, w, h, tileSize,
        islandIndex,
        spawnTile: spawn,
        enemies,
        player: {
            x: spawn.x * tileSize + (tileSize - 26) / 2,
            y: spawn.y * tileSize + (tileSize - 26) / 2,
            w: 26, h: 26, dir: 'down', actionCooldown: 0
        },
        camX: 0, camY: 0,
        enterCooldown: 30, // ignore the exit-via-interact check for a moment so the same key press that opened the door can't also close it
        prevCX: spawn.x, prevCY: spawn.y,
        returnX: player.x, returnY: player.y
    };

    playSound('interact');
    displayMessage(`You enter ${dungeon.name}...`);
}

function exitDungeon(silent) {
    if (!dungeon) return;
    player.x = dungeon.returnX;
    player.y = dungeon.returnY;
    playSound('interact');
    if (!silent) displayMessage("You emerge back onto the island.");
    dungeon = null;
}

function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function getSwingHitbox(p) {
    const reach = 34;
    if (p.dir === 'right') return { x: p.x + p.w, y: p.y - 4, w: reach, h: p.h + 8 };
    if (p.dir === 'left') return { x: p.x - reach, y: p.y - 4, w: reach, h: p.h + 8 };
    if (p.dir === 'up') return { x: p.x - 4, y: p.y - reach, w: p.w + 8, h: reach };
    return { x: p.x - 4, y: p.y + p.h, w: p.w + 8, h: reach };
}

function updateDungeon(input) {
    const d = dungeon;
    const p = d.player;
    if (d.enterCooldown > 0) d.enterCooldown--;
    const speed = 5;
    const dx = input.vx * speed;
    const dy = input.vy * speed;

    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) p.dir = 'right'; if (dx < 0) p.dir = 'left';
    } else if (Math.abs(dy) > 0) {
        if (dy > 0) p.dir = 'down'; if (dy < 0) p.dir = 'up';
    }

    const collides = (px, py) => {
        const tx = Math.floor(px / d.tileSize);
        const ty = Math.floor(py / d.tileSize);
        if (tx < 0 || ty < 0 || tx >= d.w || ty >= d.h) return true;
        return d.tiles[ty][tx] === DUNGEON_TILES.WALL;
    };
    const hitsWall = () => collides(p.x + 4, p.y + 4) || collides(p.x + p.w - 4, p.y + 4) ||
                            collides(p.x + 4, p.y + p.h - 4) || collides(p.x + p.w - 4, p.y + p.h - 4);

    p.x += dx;
    if (hitsWall()) p.x -= dx;
    p.y += dy;
    if (hitsWall()) p.y -= dy;

    // Sword swing: on press, defeat any living enemy caught in the reach hitbox
    if (p.actionCooldown > 0) p.actionCooldown--;
    if (input.action && p.actionCooldown <= 0) {
        p.actionCooldown = 20;
        playSound('swing');
        const hitbox = getSwingHitbox(p);
        d.enemies.forEach(e => {
            if (e.alive && rectsOverlap(hitbox, e)) {
                e.alive = false;
                playSound('secret');
                screenShake = 6;
                displayMessage("Enemy defeated!");
            }
        });
    }

    // Enemy patrols: bounce back and forth along their axis; knock the player back to the entrance on touch
    d.enemies.forEach(e => {
        if (!e.alive) return;
        e.x += e.vx; e.y += e.vy;
        e.traveled += e.axis === 'y' ? Math.abs(e.vy) : Math.abs(e.vx);
        if (e.traveled >= e.range) {
            e.vx *= -1; e.vy *= -1;
            e.traveled = 0;
        }
        if (rectsOverlap(p, e)) {
            p.x = d.spawnTile.x * d.tileSize + (d.tileSize - p.w) / 2;
            p.y = d.spawnTile.y * d.tileSize + (d.tileSize - p.h) / 2;
            playSound('push');
            screenShake = 10;
            displayMessage("An enemy strikes you down! Back to the entrance.");
        }
    });

    const cx = Math.floor((p.x + p.w / 2) / d.tileSize);
    const cy = Math.floor((p.y + p.h / 2) / d.tileSize);
    const tile = d.tiles[cy] && d.tiles[cy][cx];

    if (tile === DUNGEON_TILES.HAZARD) {
        p.x = d.spawnTile.x * d.tileSize + (d.tileSize - p.w) / 2;
        p.y = d.spawnTile.y * d.tileSize + (d.tileSize - p.h) / 2;
        playSound('push');
        screenShake = 10;
        displayMessage("A trap sends you reeling back to the entrance!");
    } else if (tile === DUNGEON_TILES.CLUE) {
        if (cx !== d.prevCX || cy !== d.prevCY) {
            playSound('interact');
            displayMessage("Dead end — a cave-in blocks the way. There must be another route through...");
        }
    } else if (tile === DUNGEON_TILES.TREASURE) {
        const info = islandDungeons[d.islandIndex];
        if (!info.solved) {
            info.solved = true;
            player.treasures++;
            playSound('secret');
            screenShake = 15;

            const nextInfo = islandDungeons[d.islandIndex + 1];
            if (nextInfo && !nextInfo.unlocked) {
                nextInfo.unlocked = true;
                const gate = islandGates.find(g => g.islandIndex === d.islandIndex + 1);
                if (gate) mapData[gate.y][gate.x] = TILES.GRASS;
                displayMessage(`You found Ancient Treasure! (${player.treasures}/9) The barrier to the next island crumbles away...`);
            } else {
                displayMessage(`You found Ancient Treasure! (${player.treasures}/9)`);
            }
        } else {
            playSound('interact');
            displayMessage("This chest is already empty.");
        }
        exitDungeon(true);
        return;
    } else if (input.interact && d.enterCooldown <= 0 && cx === d.spawnTile.x && cy === d.spawnTile.y) {
        exitDungeon();
        return;
    }

    d.prevCX = cx; d.prevCY = cy;

    const viewW = 1920, viewH = 1080;
    const mapPxW = d.w * d.tileSize, mapPxH = d.h * d.tileSize;
    d.camX = mapPxW <= viewW ? -(viewW - mapPxW) / 2 : Math.max(0, Math.min(mapPxW - viewW, p.x - viewW / 2 + p.w / 2));
    d.camY = mapPxH <= viewH ? -(viewH - mapPxH) / 2 : Math.max(0, Math.min(mapPxH - viewH, p.y - viewH / 2 + p.h / 2));
}

function drawDungeon(ctx) {
    const d = dungeon;
    ctx.fillStyle = '#120a08';
    ctx.fillRect(0, 0, 1920, 1080);

    ctx.save();
    ctx.translate(-d.camX, -d.camY);

    const startCol = Math.max(0, Math.floor(d.camX / d.tileSize));
    const endCol = Math.min(d.w, startCol + Math.ceil(1920 / d.tileSize) + 1);
    const startRow = Math.max(0, Math.floor(d.camY / d.tileSize));
    const endRow = Math.min(d.h, startRow + Math.ceil(1080 / d.tileSize) + 1);

    for (let y = startRow; y < endRow; y++) {
        for (let x = startCol; x < endCol; x++) {
            const tile = d.tiles[y][x];
            const px = x * d.tileSize, py = y * d.tileSize;

            if (tile === DUNGEON_TILES.WALL) {
                ctx.fillStyle = '#2b2320';
                ctx.fillRect(px, py, d.tileSize, d.tileSize);
                ctx.strokeStyle = '#181211'; ctx.lineWidth = 2;
                ctx.strokeRect(px + 2, py + 2, d.tileSize - 4, d.tileSize - 4);
                continue;
            }

            ctx.fillStyle = (x + y) % 2 === 0 ? '#4a3b30' : '#443528';
            ctx.fillRect(px, py, d.tileSize, d.tileSize);

            if (tile === DUNGEON_TILES.HAZARD) {
                ctx.fillStyle = '#c0392b';
                ctx.beginPath();
                for (let i = 0; i < 3; i++) {
                    ctx.moveTo(px + 8 + i * 14, py + d.tileSize - 8);
                    ctx.lineTo(px + 15 + i * 14, py + 8);
                    ctx.lineTo(px + 22 + i * 14, py + d.tileSize - 8);
                }
                ctx.fill();
            } else if (tile === DUNGEON_TILES.TREASURE) {
                ctx.shadowColor = 'rgba(255,202,40,0.8)'; ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffca28';
                ctx.fillRect(px + d.tileSize / 2 - 14, py + d.tileSize / 2 - 10, 28, 20);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#8d6e63';
                ctx.fillRect(px + d.tileSize / 2 - 14, py + d.tileSize / 2 - 10, 28, 5);
            } else if (tile === DUNGEON_TILES.CLUE) {
                // Rubble and crossed bones - reads as a deliberate blockage, not a bug
                ctx.fillStyle = '#3a3128';
                ctx.beginPath();
                ctx.arc(px + 14, py + d.tileSize - 14, 10, 0, Math.PI * 2);
                ctx.arc(px + d.tileSize - 16, py + d.tileSize - 12, 8, 0, Math.PI * 2);
                ctx.arc(px + d.tileSize / 2, py + 16, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#e8dfd5'; ctx.lineWidth = 3; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(px + d.tileSize / 2 - 10, py + d.tileSize / 2 - 10);
                ctx.lineTo(px + d.tileSize / 2 + 10, py + d.tileSize / 2 + 10);
                ctx.moveTo(px + d.tileSize / 2 + 10, py + d.tileSize / 2 - 10);
                ctx.lineTo(px + d.tileSize / 2 - 10, py + d.tileSize / 2 + 10);
                ctx.stroke();
            } else if (x === d.spawnTile.x && y === d.spawnTile.y) {
                ctx.strokeStyle = '#81d4fa'; ctx.lineWidth = 3;
                ctx.strokeRect(px + 6, py + 6, d.tileSize - 12, d.tileSize - 12);
            }
        }
    }

    d.enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath(); ctx.ellipse(e.x + e.w / 2, e.y + e.h + 2, 10, 4, 0, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#5d4a66';
        ctx.beginPath(); ctx.ellipse(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, e.h / 2 - 2, 0, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = '#3d2f45'; ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i += 2) {
            ctx.beginPath();
            ctx.moveTo(e.x + e.w / 2 + i * 8, e.y + e.h - 2);
            ctx.lineTo(e.x + e.w / 2 + i * 12, e.y + e.h + 6);
            ctx.stroke();
        }

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.arc(e.x + e.w / 2 - 6, e.y + e.h / 2 - 2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(e.x + e.w / 2 + 6, e.y + e.h / 2 - 2, 3, 0, Math.PI * 2); ctx.fill();
    });

    const p = d.player;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(p.x + p.w / 2, p.y + p.h + 2, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8dfd5';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#cc2222';
    ctx.fillRect(p.x, p.y + p.h - 8, p.w, 6);
    ctx.fillStyle = '#ffccaa';
    ctx.beginPath(); ctx.arc(p.x + p.w / 2, p.y + 4, 8, 0, Math.PI * 2); ctx.fill();

    if (p.actionCooldown > 10) {
        ctx.strokeStyle = '#eeeeee'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        const scx = p.x + p.w / 2, scy = p.y + p.h / 2;
        ctx.beginPath();
        if (p.dir === 'right') { ctx.moveTo(scx, scy); ctx.lineTo(scx + 30, scy - 6); }
        if (p.dir === 'left') { ctx.moveTo(scx, scy); ctx.lineTo(scx - 30, scy - 6); }
        if (p.dir === 'up') { ctx.moveTo(scx, scy); ctx.lineTo(scx, scy - 34); }
        if (p.dir === 'down') { ctx.moveTo(scx, scy); ctx.lineTo(scx, scy + 26); }
        ctx.stroke();
    }

    ctx.restore();
}

// --- RENDERING PIPELINE ---

let player = new Player();
let camera = new Camera();
let uiMessage = "";
let uiMessageTimer = 0;

function displayMessage(msg) {
    uiMessage = msg;
    uiMessageTimer = 240; 
}

function drawWorld(ctx) {
    const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
    const endCol = Math.min(MAP_TILES, startCol + (1920 / TILE_SIZE) + 1);
    const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
    const endRow = Math.min(MAP_TILES, startRow + (1080 / TILE_SIZE) + 1);

    for (let y = startRow; y < endRow; y++) {
        for (let x = startCol; x < endCol; x++) {
            const tile = mapData[y][x];
            const px = x * TILE_SIZE;
            const py = y * TILE_SIZE;

            if (tile === TILES.WATER) {
                ctx.fillStyle = '#0f528a'; // Deep ocean blue
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                
                // Procedural HD Waves
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                const waveY = Math.sin((x + y) + timeOffset) * 4;
                ctx.beginPath();
                ctx.moveTo(px + 8, py + 20 + waveY);
                ctx.quadraticCurveTo(px + 20, py + 15 + waveY, px + 32, py + 20 + waveY);
                ctx.stroke();

            } else if (tile === TILES.SAND) {
                ctx.fillStyle = '#e8d2a6'; 
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                // Sand Texture
                ctx.fillStyle = '#c7af81';
                ctx.fillRect(px + 8, py + 10, 3, 3);
                ctx.fillRect(px + 28, py + 25, 2, 2);
                ctx.fillRect(px + 15, py + 30, 3, 3);

            } else if (tile === TILES.GRASS) {
                ctx.fillStyle = '#55a644'; 
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                // HD Grass Tufts
                ctx.strokeStyle = '#3e7a32';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(px+10, py+15); ctx.lineTo(px+12, py+8); ctx.lineTo(px+14, py+15); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(px+30, py+28); ctx.lineTo(px+32, py+21); ctx.lineTo(px+34, py+28); ctx.stroke();

            } else if (tile === TILES.MOUNTAIN) {
                ctx.fillStyle = '#4a5054'; 
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                // 3D Peak Rendering
                ctx.fillStyle = '#727a80';
                ctx.beginPath(); ctx.moveTo(px, py+TILE_SIZE); ctx.lineTo(px+TILE_SIZE/2, py); ctx.lineTo(px+TILE_SIZE, py+TILE_SIZE); ctx.fill();
                ctx.fillStyle = '#d0d4d6'; // Snow cap
                ctx.beginPath(); ctx.moveTo(px+TILE_SIZE/2, py); ctx.lineTo(px+14, py+14); ctx.lineTo(px+26, py+14); ctx.fill();

            } else if (tile === TILES.DOCK) {
                ctx.fillStyle = '#0f528a'; ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                ctx.fillStyle = '#7a5431'; 
                ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 6;
                ctx.fillRect(px + 8, py, TILE_SIZE - 16, TILE_SIZE);
                ctx.shadowBlur = 0;
                // Planks
                ctx.strokeStyle = '#4a321d'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(px+8, py+10); ctx.lineTo(px+TILE_SIZE-8, py+10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(px+8, py+25); ctx.lineTo(px+TILE_SIZE-8, py+25); ctx.stroke();

            } else if (tile === TILES.CAVE) {
                ctx.fillStyle = '#55a644'; ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                // Rocky arch around a dark entrance
                ctx.fillStyle = '#5c5148';
                ctx.beginPath();
                ctx.moveTo(px + 4, py + TILE_SIZE);
                ctx.lineTo(px + 4, py + 12);
                ctx.quadraticCurveTo(px + TILE_SIZE / 2, py - 4, px + TILE_SIZE - 4, py + 12);
                ctx.lineTo(px + TILE_SIZE - 4, py + TILE_SIZE);
                ctx.fill();
                ctx.fillStyle = '#0a0806';
                ctx.beginPath();
                ctx.moveTo(px + 10, py + TILE_SIZE);
                ctx.lineTo(px + 10, py + 16);
                ctx.quadraticCurveTo(px + TILE_SIZE / 2, py + 4, px + TILE_SIZE - 10, py + 16);
                ctx.lineTo(px + TILE_SIZE - 10, py + TILE_SIZE);
                ctx.fill();
            }
        }
    }

    // Entities
    npcs.forEach(n => {
        let px = n.x * TILE_SIZE; let py = n.y * TILE_SIZE;
        if (px >= camera.x - TILE_SIZE && px <= camera.x + 1920 && py >= camera.y - TILE_SIZE && py <= camera.y + 1080) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(px+20, py+28, 10, 4, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#1e88e5'; ctx.fillRect(px + 12, py + 14, 16, 12);
            ctx.fillStyle = '#ffccaa'; ctx.beginPath(); ctx.arc(px+20, py+10, 8, 0, Math.PI*2); ctx.fill();
        }
    });
}

function drawHUD(ctx) {
    ctx.fillStyle = 'rgba(10, 15, 25, 0.85)';
    ctx.fillRect(20, 20, 360, 90);
    ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 3;
    ctx.strokeRect(20, 20, 360, 90);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px "Segoe UI", sans-serif';
    ctx.fillText("CORSAIR'S LOG", 40, 55);
    
    ctx.font = '22px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ffca28';
    ctx.fillText(`◆ Treasures Secured: ${player.treasures} / 9`, 40, 85);

    if (dungeon) {
        ctx.fillStyle = 'rgba(10, 15, 25, 0.85)';
        ctx.fillRect(1920 - 460, 20, 440, 90);
        ctx.strokeStyle = '#81d4fa'; ctx.lineWidth = 3;
        ctx.strokeRect(1920 - 460, 20, 440, 90);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px "Segoe UI", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(dungeon.name, 1920 - 40, 55);

        ctx.font = '18px "Segoe UI", sans-serif';
        ctx.fillStyle = '#81d4fa';
        ctx.fillText("Stand on the entrance and press interact to leave", 1920 - 40, 85);
        ctx.textAlign = 'left';
    }

    if (uiMessageTimer > 0) {
        ctx.fillStyle = 'rgba(10, 15, 25, 0.9)';
        ctx.fillRect(1920/2 - 500, 900, 1000, 120);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(1920/2 - 500, 900, 1000, 120);

        ctx.fillStyle = '#fff';
        ctx.font = '28px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(uiMessage, 1920/2, 970);
        ctx.textAlign = 'left';

        uiMessageTimer--;
    }
}

// --- MAIN GAME LOOP ---
function update() {
    Input.poll();
    const input = Input.getState();

    if (!audioCtx && (input.action || input.interact || input.vx !== 0)) {
        initAudio();
    }

    if (audioCtx) {
        timeOffset += 0.05;
        if (dungeon) {
            updateDungeon(input);
        } else {
            player.update(input);
            camera.update(player);
        }
    }
}

function loop() {
    update();

    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!audioCtx) {
        ctx.fillStyle = '#0a1a2a'; ctx.fillRect(0, 0, 1920, 1080);
        ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
        ctx.font = 'bold 80px "Segoe UI", sans-serif';
        ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
        ctx.fillText("CORSAIR'S QUEST", 1920 / 2, 400);
        ctx.fillStyle = '#ffca28'; ctx.font = '40px "Segoe UI", sans-serif';
        ctx.fillText("THE TEN SEAS - HD EDITION", 1920 / 2, 480);
        ctx.fillStyle = '#81d4fa'; ctx.font = '30px "Segoe UI", sans-serif';
        ctx.fillText("Press (A) or Move to Embark", 1920 / 2, 700);
        ctx.textAlign = 'left';
        ctx.shadowBlur = 0;
    } else if (dungeon) {
        drawDungeon(ctx);
        drawHUD(ctx);
    } else {
        ctx.save();
        ctx.translate(-camera.x, -camera.y);
        drawWorld(ctx);
        if (player.state === 'walking') player.drawShip(ctx, player.shipX, player.shipY);
        player.draw(ctx);
        ctx.restore();
        drawHUD(ctx);
    }

    ctx.restore();
    requestAnimationFrame(loop);
}

// PC Fallback Controls
window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'w' || e.key === 'ArrowUp') Input.keys.up = true;
    if (k === 's' || e.key === 'ArrowDown') Input.keys.down = true;
    if (k === 'a' || e.key === 'ArrowLeft') Input.keys.left = true;
    if (k === 'd' || e.key === 'ArrowRight') Input.keys.right = true;
    if (k === 'j' || e.code === 'Space') Input.keys.action = true;
    if (k === 'e' || e.code === 'Enter') Input.keys.interact = true;
});

window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'w' || e.key === 'ArrowUp') Input.keys.up = false;
    if (k === 's' || e.key === 'ArrowDown') Input.keys.down = false;
    if (k === 'a' || e.key === 'ArrowLeft') Input.keys.left = false;
    if (k === 'd' || e.key === 'ArrowRight') Input.keys.right = false;
    if (k === 'j' || e.code === 'Space') Input.keys.action = false;
    if (k === 'e' || e.code === 'Enter') Input.keys.interact = false;
});

generateWorld();
preloadDungeons();
requestAnimationFrame(loop);

</script>
