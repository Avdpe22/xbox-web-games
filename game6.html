<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tadpole Swarm: Evolution</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #0a0a0f; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        canvas.tabIndex = 0;
        // Xbox Edge (console browser) only exposes the Gamepad API to the currently
        // focused document, and gains focus can be lost when loaded inside the hub's
        // iframe -- pull focus onto this game whenever we get a chance to.
        function ensureGameFocus() { window.focus(); canvas.focus({ preventScroll: true }); }
        ensureGameFocus();
        window.addEventListener('load', ensureGameFocus);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureGameFocus(); });
        window.addEventListener('gamepadconnected', ensureGameFocus);
        const ctx = canvas.getContext('2d');

        // Logical (CSS pixel) dimensions used by all game/draw logic.
        // canvas.width/height stay in physical device pixels for crisper
        // rendering on high-DPI screens; ctx is scaled so all coordinates
        // below are expressed in logical pixels.
        let dpr = window.devicePixelRatio || 1;
        let logicalWidth = window.innerWidth;
        let logicalHeight = window.innerHeight;

        function applyCanvasSize() {
            dpr = window.devicePixelRatio || 1;
            logicalWidth = window.innerWidth;
            logicalHeight = window.innerHeight;
            canvas.width = Math.round(logicalWidth * dpr);
            canvas.height = Math.round(logicalHeight * dpr);
            canvas.style.width = logicalWidth + 'px';
            canvas.style.height = logicalHeight + 'px';
            // Resizing the canvas resets any existing transform, so
            // setTransform (not scale) keeps this idempotent.
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        applyCanvasSize();

        let gameState = 'START';
        let level = 1;

        // Game Variables
        let nestMaxHealth = 10000;
        let nestHealth = nestMaxHealth;
        let playerHealth = 100;
        let commandEnergy = 100;
        let score = 0;
        let shakeTime = 0;

        // --- Tuning / balance constants (values unchanged from original) ---
        const PARATROOPER_COST = 15;
        const TANK_COST = 45;
        const BUNKER_COST = 70;
        const ENERGY_REGEN_RATE = 0.22;
        const DEPLOY_ZONE_MARGIN = 300; // deploy area right edge, measured from canvas right
        const PROJECTILE_SPEED = 20;
        const PARTICLE_LIFETIME = 12;
        const EXPLOSION_PARTICLE_COUNT = 6;
        const SHAKE_DURATION = 10;
        const SHAKE_MAGNITUDE = 8;

        // Map Structures
        const crosshair = { x: logicalWidth / 4, y: logicalHeight / 2, radius: 10, speed: 10 };
        const tadpoleNest = { x: logicalWidth - 200, y: 0, width: 200, height: logicalHeight };
        const playerBase = { x: 0, y: 0, width: 60, height: logicalHeight };

        const enemies = [];
        const units = [];
        const projectiles = [];
        const particles = [];

        let buttonState = { A: false, X: false, Y: false, A_Attack: false };

        // --- WEB AUDIO API (SYNTHESIZER) ---
        let audioCtx;
        let lastHitSoundTime = 0;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            startSynthwaveTrack();
        }

        function playDeploySound() {
            if (!audioCtx) return;
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.15);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        function playHitSound() {
            if (!audioCtx) return;
            let now = audioCtx.currentTime;
            // Throttle hit sounds so it doesn't clip when 50 bullets hit at once
            if (now - lastHitSoundTime < 0.08) return; 
            lastHitSoundTime = now;

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            
            gain.gain.setValueAtTime(0.03, now); // Low volume
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        }

        function startSynthwaveTrack() {
            // Retro synthwave bassline sequence (C minor pentatonic vibe)
            const bassNotes = [65.41, 65.41, 130.81, 98.00, 65.41, 155.56, 130.81, 98.00];
            let step = 0;

            setInterval(() => {
                if (gameState !== 'PLAYING') return; // Only play during action

                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                let filter = audioCtx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.value = bassNotes[step % bassNotes.length];
                
                // Plucky retro synth filter sweep
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, now);
                filter.frequency.exponentialRampToValueAtTime(80, now + 0.15);

                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
                step++;
            }, 180); // BPM pacing
        }

        function getGamepad() {
            const gamepads = navigator.getGamepads();
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i] && gamepads[i].mapping === 'standard') return gamepads[i];
            }
            return null;
        }

        function resetGame(fullReset = true) {
            if (fullReset) {
                level = 1;
                score = 0;
                nestMaxHealth = 10000;
            } else {
                level++;
                nestMaxHealth += 3000; 
            }
            
            nestHealth = nestMaxHealth;
            playerHealth = 100;
            commandEnergy = 100;
            shakeTime = 0;
            enemies.length = 0;
            units.length = 0;
            projectiles.length = 0;
            particles.length = 0;
            crosshair.x = logicalWidth / 4;
            crosshair.y = logicalHeight / 2;
            gameState = 'PLAYING';
        }

        // --- UNIT FACTORIES ---
        function spawnSoldier(x, y) {
            units.push({ 
                type: 'soldier', x: x, y: y, hp: 12, maxHp: 12, speed: 0.8, 
                range: 250, prefDist: 200 + Math.random() * 80,
                damage: 6, fireRate: 20, fireCooldown: 0, color: '#4CAF50', size: 5,
                animTimer: 0 
            });
        }

        function spawnTank(x, y) {
            units.push({ 
                type: 'tank', x: x, y: y, hp: 80, maxHp: 80, speed: 0.4, 
                range: 350, prefDist: 300 + Math.random() * 50,
                damage: 30, fireRate: 50, fireCooldown: 0, color: '#2E7D32', size: 12,
                animTimer: 0
            });
        }

        function spawnBunker(x, y) {
            units.push({ 
                type: 'bunker', x: x, y: y, hp: 250, maxHp: 250, speed: 0, 
                range: 300, prefDist: 0, 
                damage: 10, fireRate: 8, fireCooldown: 0, color: '#757575', size: 16 
            });
        }

        // --- ENEMY MUTATION SPAWNER ---
        function spawnEnemy() {
            let healthPercent = nestHealth / nestMaxHealth;
            let spawnChance = (0.04 + (level * 0.015)) + ((1 - healthPercent) * 0.12); 
            
            if (Math.random() < spawnChance) {
                let typeRand = Math.random();
                let enemy = {
                    x: tadpoleNest.x, y: 20 + Math.random() * (logicalHeight - 40),
                    wobble: Math.random() * Math.PI * 2, attackCooldown: 0, jumpTimer: 0 
                };

                if (level >= 4 && typeRand < 0.10) {
                    enemy.type = 'frog'; enemy.hp = 250; enemy.radius = 18; enemy.speed = 0; enemy.maxSpeed = 6;
                } else if (level >= 3 && typeRand < 0.35) {
                    enemy.type = 'froglet'; enemy.hp = 25; enemy.radius = 7; enemy.speed = 2.8; 
                } else if (level >= 2 && typeRand < 0.60) {
                    enemy.type = 'shielded'; enemy.hp = 45; enemy.radius = 6; enemy.speed = 1.2;
                } else {
                    enemy.type = 'basic'; enemy.hp = 15; enemy.radius = 6; enemy.speed = 1.0 + Math.random();
                }

                enemies.push(enemy);
            }
        }

        function createExplosion(x, y, color, sizeMultiplier = 1) {
            for(let i=0; i<EXPLOSION_PARTICLE_COUNT; i++){
                particles.push({
                    x: x, y: y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                    life: PARTICLE_LIFETIME, color: color, size: (Math.random() * 3 + 1) * sizeMultiplier
                });
            }
        }

        function drawTextCentered(text, yOffset, size, color) {
            ctx.fillStyle = color; ctx.font = `bold ${size}px Arial`;
            ctx.textAlign = 'center'; ctx.fillText(text, logicalWidth / 2, logicalHeight / 2 + yOffset);
            ctx.textAlign = 'left';
        }

        // Shared helper for the A/X/Y deploy buttons: checks cost, spends
        // energy, spawns the squad, and plays the deploy sound. Behavior is
        // identical to the previous per-button inline duplication.
        function tryDeploySquad(cost, deployFn) {
            if (commandEnergy < cost) return false;
            commandEnergy -= cost;
            deployFn();
            playDeploySound();
            return true;
        }

        // Shared muzzle-flash blip drawn near a unit's barrel while it is
        // mid fire-cooldown window.
        function drawMuzzleFlash(u, cooldownWindow, offsetX, offsetY, radius, color) {
            if (u.fireCooldown > u.fireRate - cooldownWindow) {
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(u.x + offsetX, u.y + offsetY, radius, 0, Math.PI * 2); ctx.fill();
            }
        }

        function gameLoop() {
            const pad = getGamepad();
            
            if (pad) {
                if (pad.buttons[0].pressed && !buttonState.A) {
                    // Initialize audio engine on first start
                    initAudio(); 

                    if (gameState === 'START' || gameState === 'GAME_OVER') resetGame(true);
                    else if (gameState === 'LEVEL_CLEAR') resetGame(false);
                    buttonState.A = true;
                } else if (!pad.buttons[0].pressed) buttonState.A = false;

                if (gameState === 'PLAYING') {
                    const lx = pad.axes[0]; const ly = pad.axes[1]; const deadzone = 0.2;

                    if (Math.abs(lx) > deadzone) crosshair.x += lx * crosshair.speed;
                    if (Math.abs(ly) > deadzone) crosshair.y += ly * crosshair.speed;

                    const maxDeployX = logicalWidth - DEPLOY_ZONE_MARGIN;
                    crosshair.x = Math.max(playerBase.width + 10, Math.min(maxDeployX, crosshair.x));
                    crosshair.y = Math.max(10, Math.min(logicalHeight - 10, crosshair.y));

                    // [A] 3x Paratroopers
                    if (pad.buttons[0].pressed && buttonState.A === true && !buttonState.A_Attack) {
                        tryDeploySquad(PARATROOPER_COST, () => {
                            spawnSoldier(crosshair.x, crosshair.y - 15);
                            spawnSoldier(crosshair.x - 12, crosshair.y + 12);
                            spawnSoldier(crosshair.x + 12, crosshair.y + 12);
                        });
                        buttonState.A_Attack = true;
                    } else if (!pad.buttons[0].pressed) buttonState.A_Attack = false;

                    // [X] Tank Platoon
                    if (pad.buttons[2].pressed && !buttonState.X) {
                        tryDeploySquad(TANK_COST, () => {
                            spawnTank(crosshair.x, crosshair.y);
                            for(let i=0; i<4; i++) spawnSoldier(crosshair.x - 25 - (Math.random()*15), crosshair.y - 25 + (i*18));
                        });
                        buttonState.X = true;
                    } else if (!pad.buttons[2].pressed) buttonState.X = false;

                    // [Y] Heavy Bunker
                    if (pad.buttons[3].pressed && !buttonState.Y) {
                        tryDeploySquad(BUNKER_COST, () => spawnBunker(crosshair.x, crosshair.y));
                        buttonState.Y = true;
                    } else if (!pad.buttons[3].pressed) buttonState.Y = false;
                }
            }

            // --- UPDATE LOGIC ---
            if (gameState === 'PLAYING') {
                commandEnergy = Math.min(100, commandEnergy + ENERGY_REGEN_RATE);
                spawnEnemy();

                // 1. Update Units
                for (let i = units.length - 1; i >= 0; i--) {
                    let u = units[i];
                    if (u.fireCooldown > 0) u.fireCooldown--;

                    let target = null;
                    let closestDist = u.range;

                    for (let e of enemies) {
                        let dist = Math.hypot(u.x - e.x, u.y - e.y);
                        if (dist < closestDist) { closestDist = dist; target = e; }
                    }

                    if (!target && (tadpoleNest.x - u.x) < u.range) target = tadpoleNest;

                    let isMoving = false;

                    if (target) {
                        if (u.fireCooldown <= 0) {
                            let targetY = target === tadpoleNest ? u.y + (Math.random()*20-10) : target.y;
                            let angle = Math.atan2(targetY - u.y, (target === tadpoleNest ? tadpoleNest.x : target.x) - u.x);
                            
                            projectiles.push({
                                x: u.x + (u.type === 'tank' ? u.size : 5), y: u.y,
                                vx: Math.cos(angle) * PROJECTILE_SPEED, vy: Math.sin(angle) * PROJECTILE_SPEED,
                                damage: u.damage, isExplosive: u.type === 'tank'
                            });
                            u.fireCooldown = u.fireRate;
                        }
                    } else if (u.speed > 0 && (tadpoleNest.x - u.x) > u.prefDist) {
                        u.x += u.speed; 
                        isMoving = true;
                    }

                    if (isMoving) {
                        u.animTimer += (u.type === 'soldier' ? 0.4 : 0.2);
                    } else {
                        u.animTimer = 0; 
                    }

                    if (u.hp <= 0) {
                        createExplosion(u.x, u.y, '#ff8800', 1.5);
                        units.splice(i, 1);
                    }
                }

                // 2. Update Projectiles
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    let p = projectiles[i];
                    p.x += p.vx; p.y += p.vy;

                    let hit = false;
                    if (p.x > tadpoleNest.x) {
                        nestHealth -= p.damage;
                        createExplosion(p.x, p.y, '#88ffaa', 1.0);
                        playHitSound();
                        hit = true;
                    } else {
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            let e = enemies[j];
                            if (Math.hypot(p.x - e.x, p.y - e.y) < e.radius + 3) {
                                e.hp -= p.damage;
                                hit = true;
                                if (p.isExplosive) createExplosion(p.x, p.y, '#ff4400', 1.5);
                                else createExplosion(p.x, p.y, e.type === 'shielded' && e.hp > 0 ? '#00ffff' : '#88ff88', 0.5);
                                
                                playHitSound();

                                if (e.hp <= 0) {
                                    score += (e.type === 'frog' ? 5000 : (e.type === 'shielded' ? 2000 : 1000));
                                    enemies.splice(j, 1);
                                }
                                break;
                            }
                        }
                    }

                    if (hit || p.x > logicalWidth || p.x < 0 || p.y < 0 || p.y > logicalHeight) projectiles.splice(i, 1);
                }
                
                // 3. Update Enemies
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    let aggroUnit = null;
                    let closestDist = e.type === 'froglet' ? 350 : 250; 
                    let eatingUnit = null;

                    for (let u of units) {
                        let dist = Math.hypot(u.x - e.x, u.y - e.y);
                        if (dist < e.radius + u.size + 2) { eatingUnit = u; break; }
                        if (dist < closestDist) { closestDist = dist; aggroUnit = u; }
                    }

                    if (e.type === 'frog') {
                        e.jumpTimer++;
                        if (e.jumpTimer > 90) {
                            e.speed = e.maxSpeed; 
                            if (e.jumpTimer > 110) e.jumpTimer = 0; 
                        } else {
                            e.speed *= 0.85; 
                        }
                    }

                    if (eatingUnit) {
                        if (e.attackCooldown <= 0) {
                            eatingUnit.hp -= (e.type === 'frog' ? 25 : (e.type === 'froglet' ? 4 : 2));
                            e.attackCooldown = e.type === 'frog' ? 30 : 8;
                            createExplosion(e.x - 5, e.y, '#ff0000', 0.5);
                        } else {
                            e.attackCooldown--;
                        }
                    } else if (aggroUnit) {
                        let angle = Math.atan2(aggroUnit.y - e.y, aggroUnit.x - e.x);
                        e.x += Math.cos(angle) * e.speed;
                        e.y += Math.sin(angle) * e.speed;
                        
                        if (e.type !== 'frog') {
                            e.x += Math.cos(e.wobble) * 0.5;
                            e.y += Math.sin(e.wobble) * 0.5;
                            e.wobble += 0.3;
                        }
                    } else {
                        e.x -= e.speed;
                        if (e.type !== 'frog') {
                            e.y += Math.sin(e.wobble) * 1.5;
                            e.wobble += 0.2;
                        }
                    }
                    
                    if (e.x < playerBase.width) {
                        enemies.splice(i, 1);
                        playerHealth -= (e.type === 'frog' ? 25 : 5);
                        shakeTime = e.type === 'frog' ? SHAKE_DURATION * 1.5 : SHAKE_DURATION;
                        if (playerHealth <= 0) {
                            playerHealth = 0;
                            gameState = 'GAME_OVER';
                        }
                    }
                }

                // 4. Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].x += particles[i].vx; particles[i].y += particles[i].vy;
                    particles[i].life--;
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }

                if (nestHealth <= 0) gameState = 'LEVEL_CLEAR';
            }

            // --- DRAWING ---
            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            if (gameState === 'START') {
                drawTextCentered("TADPOLE SWARM: EVOLUTION", -60, 50, "#00ff88");
                drawTextCentered("Deploy troops to destroy the mutating nests.", 0, 24, "white");
                drawTextCentered(pad ? "Press [A] to Start" : "Connect Xbox Controller & Press [A]", 60, 20, pad ? "#00aaff" : "yellow");
            } 
            else if (gameState === 'GAME_OVER') {
                drawTextCentered("COMMAND CENTER BREACHED", -40, 70, "#ff4444");
                drawTextCentered(`Reached Level ${level} - Final Score: ${score.toLocaleString()}`, 20, 24, "white");
                drawTextCentered("Press [A] to Restart Campaign", 100, 20, "#00aaff");
            }
            else if (gameState === 'LEVEL_CLEAR') {
                drawTextCentered(`LEVEL ${level} CLEARED!`, -40, 70, "#44ff44");
                drawTextCentered("The swarm is mutating. They will return stronger.", 20, 24, "#aaaaaa");
                drawTextCentered("Press [A] to Proceed to Next Level", 100, 20, "#00aaff");
            }
            else if (gameState === 'PLAYING') {
                ctx.save();
                if (shakeTime > 0) {
                    const shakeMag = SHAKE_MAGNITUDE * (shakeTime / SHAKE_DURATION);
                    ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);
                    shakeTime--;
                }

                // Draw Player Base
                ctx.fillStyle = '#223'; ctx.fillRect(playerBase.x, playerBase.y, playerBase.width, playerBase.height);
                ctx.fillStyle = '#445'; for(let i=0; i<logicalHeight; i+=40) ctx.fillRect(playerBase.width - 10, i, 10, 20);
                ctx.fillStyle = `rgba(255, 0, 0, ${1 - (playerHealth/100)})`; ctx.fillRect(playerBase.width, 0, 20, logicalHeight);

                // Deploy Line
                const deployLineX = logicalWidth - DEPLOY_ZONE_MARGIN;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.beginPath(); ctx.moveTo(deployLineX, 0); ctx.lineTo(deployLineX, logicalHeight); ctx.stroke();

                // Draw Mutant Nest
                ctx.fillStyle = '#0a2e15'; ctx.fillRect(tadpoleNest.x, tadpoleNest.y, tadpoleNest.width, tadpoleNest.height);
                for(let i=0; i<15; i++) {
                    ctx.fillStyle = `rgba(10, 60, 20, ${0.3 + Math.sin(Date.now()*0.001 + i)*0.2})`;
                    ctx.beginPath(); ctx.arc(tadpoleNest.x + (i%3)*50, i*80, 60, 0, Math.PI*2); ctx.fill();
                }
                
                ctx.fillStyle = '#00ff88';
                let healthPercent = nestHealth / nestMaxHealth;
                ctx.fillRect(tadpoleNest.x + 20, 80, 160 * healthPercent, 15);
                ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(tadpoleNest.x + 20, 80, 160, 15);
                ctx.fillStyle = 'white'; ctx.font = 'bold 12px Arial';
                ctx.fillText(`Nest Integrity: ${Math.floor((nestHealth/nestMaxHealth)*100)}%`, tadpoleNest.x + 30, 70);

                // Draw Units 
                for (let u of units) {
                    if(u.type === 'soldier') {
                        let legOffset = Math.sin(u.animTimer) * 4;
                        ctx.fillStyle = '#1b5e20';
                        ctx.beginPath(); ctx.ellipse(u.x - 1 + legOffset, u.y - 4, 3, 2, 0, 0, Math.PI*2); ctx.fill(); 
                        ctx.beginPath(); ctx.ellipse(u.x - 1 - legOffset, u.y + 4, 3, 2, 0, 0, Math.PI*2); ctx.fill(); 
                        ctx.fillStyle = u.color;
                        ctx.beginPath(); ctx.ellipse(u.x, u.y, 4, 6, 0, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#111'; ctx.fillRect(u.x, u.y - 1, 12, 2); 
                        ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(u.x, u.y, 4, 0, Math.PI*2); ctx.fill();
                        drawMuzzleFlash(u, 3, 13, 0, 3, '#ffcc00');
                    } else if (u.type === 'tank') {
                        let treadOffset = (u.animTimer * 5) % 8; 
                        ctx.fillStyle = '#111'; ctx.fillRect(u.x - u.size - 2, u.y - u.size, u.size*2 + 4, u.size*2);
                        ctx.fillStyle = '#333';
                        for(let t = 0; t < u.size*2; t+=4) ctx.fillRect(u.x - u.size + t - treadOffset, u.y - u.size, 2, u.size*2);
                        ctx.fillStyle = u.color; ctx.fillRect(u.x - u.size, u.y - u.size + 2, u.size*2, u.size*2 - 4);
                        ctx.fillStyle = '#1b5e20'; ctx.beginPath(); ctx.arc(u.x, u.y, u.size-3, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#111'; ctx.fillRect(u.x, u.y - 1.5, u.size + 12, 4);
                        drawMuzzleFlash(u, 4, u.size + 14, 0, 6, '#ff6600');
                    } else if (u.type === 'bunker') {
                        ctx.fillStyle = '#757575';
                        ctx.beginPath(); ctx.arc(u.x, u.y, u.size, Math.PI/2, Math.PI*1.5, true); ctx.fill();
                        ctx.fillRect(u.x, u.y - u.size, u.size+5, u.size*2);
                        ctx.fillStyle = '#111'; ctx.fillRect(u.x+5, u.y-2, 10, 4);
                        drawMuzzleFlash(u, 2, 16, 0, 4, '#ffcc00');
                    }
                    if(u.hp < u.maxHp) {
                        ctx.fillStyle = 'red'; ctx.fillRect(u.x - u.size, u.y - u.size - 6, u.size*2, 2);
                        ctx.fillStyle = 'green'; ctx.fillRect(u.x - u.size, u.y - u.size - 6, (u.size*2) * (u.hp/u.maxHp), 2);
                    }
                }

                // Draw Projectiles
                for (let p of projectiles) {
                    ctx.strokeStyle = p.isExplosive ? '#ffaa00' : '#ffff55'; ctx.lineWidth = p.isExplosive ? 3 : 1.5;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.7, p.y - p.vy * 0.7); ctx.stroke();
                }

                // Draw Enemies
                for (let e of enemies) {
                    if (e.type === 'shielded') {
                        ctx.fillStyle = `rgba(0, 255, 255, ${0.1 + (e.hp/45)*0.2})`;
                        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI*2); ctx.fill();
                        ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 1; ctx.stroke();
                    }
                    if (e.type === 'froglet' || e.type === 'frog') {
                        ctx.strokeStyle = '#007733'; ctx.lineWidth = e.type === 'frog' ? 4 : 2;
                        let legExt = e.type === 'frog' && e.jumpTimer > 90 ? 15 : 5; 
                        ctx.beginPath(); 
                        ctx.moveTo(e.x, e.y - e.radius); ctx.lineTo(e.x + legExt, e.y - e.radius - 5);
                        ctx.moveTo(e.x, e.y + e.radius); ctx.lineTo(e.x + legExt, e.y + e.radius + 5);
                        ctx.stroke();
                    } else {
                        ctx.strokeStyle = '#00aa55'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(e.x, e.y);
                        ctx.lineTo(e.x + e.radius + 4, e.y + Math.sin(e.wobble) * 4);
                        ctx.lineTo(e.x + e.radius + 8, e.y + Math.sin(e.wobble - 1) * 6); ctx.stroke();
                    }
                    ctx.fillStyle = e.type === 'frog' ? '#006622' : '#00ff88';
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
                    let eyeOffset = e.type === 'frog' ? 4 : 2;
                    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(e.x - eyeOffset, e.y - eyeOffset, eyeOffset, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(e.x - (eyeOffset+0.5), e.y - eyeOffset, eyeOffset/2, 0, Math.PI * 2); ctx.fill();
                }

                // Particles
                for (let p of particles) {
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.life / PARTICLE_LIFETIME;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1.0;

                // Crosshair
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, crosshair.radius, 0, Math.PI * 2);
                ctx.moveTo(crosshair.x - crosshair.radius - 4, crosshair.y); ctx.lineTo(crosshair.x + crosshair.radius + 4, crosshair.y);
                ctx.moveTo(crosshair.x, crosshair.y - crosshair.radius - 4); ctx.lineTo(crosshair.x, crosshair.y + crosshair.radius + 4);
                ctx.stroke();

                // UI
                ctx.fillStyle = 'white'; ctx.font = 'bold 20px Arial';
                ctx.fillText(`Level ${level} | Score: ${score.toLocaleString()}`, 80, 30);
                ctx.fillStyle = playerHealth > 30 ? '#44ff44' : '#ff4444'; ctx.fillText(`Base HP: ${playerHealth}%`, 80, 55);

                // Command Energy
                ctx.fillStyle = 'white'; ctx.font = '14px Arial'; ctx.fillText("Energy:", 80, 85);
                ctx.strokeStyle = 'white'; ctx.strokeRect(140, 72, 150, 15);
                ctx.fillStyle = commandEnergy >= BUNKER_COST ? '#00aaff' : (commandEnergy >= PARATROOPER_COST ? '#44ff44' : '#ff4444');
                ctx.fillRect(142, 74, 146 * (commandEnergy/100), 11);

                // Controls HUD
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(80, 100, 240, 85);
                ctx.fillStyle = '#aaaaaa'; ctx.font = '12px Arial';
                ctx.fillText("Deploy Units (Costs Energy):", 90, 115);
                ctx.fillStyle = commandEnergy >= PARATROOPER_COST ? '#00aaff' : '#555'; ctx.fillText(`[A] 3x Paratroopers (-${PARATROOPER_COST})`, 90, 135);
                ctx.fillStyle = commandEnergy >= TANK_COST ? '#44ff44' : '#555'; ctx.fillText(`[X] Tank Platoon (-${TANK_COST})`, 90, 155);
                ctx.fillStyle = commandEnergy >= BUNKER_COST ? '#ff4444' : '#555'; ctx.fillText(`[Y] Heavy Bunker (-${BUNKER_COST})`, 90, 175);

                ctx.restore();
            }

            if (!pad && gameState !== 'START') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 0, logicalWidth, logicalHeight);
                drawTextCentered("Controller Disconnected", 0, 40, "yellow");
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        window.addEventListener('resize', () => {
            applyCanvasSize();
            tadpoleNest.x = logicalWidth - 200;
            tadpoleNest.height = logicalHeight;
            playerBase.height = logicalHeight;
        });
    </script>
</body>
</html>
