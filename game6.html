<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tadpole Base Assault: Swarm Wars</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #111411; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game States: START, PLAYING, GAME_OVER, VICTORY
        let gameState = 'START'; 

        // Game Variables
        const hiveMaxHealth = 20000;
        let hiveHealth = hiveMaxHealth;
        let baseHealth = 100;
        let commandEnergy = 100;
        let score = 0;
        let tadpolesDestroyedCounter = 0;
        
        // Entities & Structures
        const crosshair = { x: canvas.width / 4, y: canvas.height / 2, radius: 12, speed: 10 };
        const tadpoleHive = { x: canvas.width - 200, y: 0, width: 200, height: canvas.height };
        const playerBase = { x: 0, y: 0, width: 30, height: canvas.height };
        
        const tadpoles = [];
        const units = [];
        const projectiles = [];
        const particles = [];

        // Controller tracking
        let buttonState = { A: false, X: false, Y: false };

        function getGamepad() {
            const gamepads = navigator.getGamepads();
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i] && gamepads[i].mapping === 'standard') return gamepads[i];
            }
            return null;
        }

        function resetGame() {
            hiveHealth = hiveMaxHealth;
            baseHealth = 100;
            commandEnergy = 100;
            score = 0;
            tadpolesDestroyedCounter = 0;
            tadpoles.length = 0;
            units.length = 0;
            projectiles.length = 0;
            particles.length = 0;
            crosshair.x = canvas.width / 4;
            crosshair.y = canvas.height / 2;
            gameState = 'PLAYING';
        }

        // --- UNIT FACTORIES (Balanced & Scaled Down) ---
        function spawnSoldier(x, y) {
            units.push({ 
                type: 'soldier', x: x, y: y, 
                hp: 25, maxHp: 25, speed: 0.9, 
                range: 260, damage: 6, fireRate: 35, fireCooldown: 0, 
                color: '#4CAF50', size: 5,
                preferredStandOff: Math.random() * 40 // Stops them from stacking on one pixel line
            });
        }

        function spawnTank(x, y) {
            units.push({ 
                type: 'tank', x: x, y: y, 
                hp: 150, maxHp: 150, speed: 0.45, 
                range: 380, damage: 35, fireRate: 65, fireCooldown: 0, 
                color: '#2E7D32', size: 12,
                preferredStandOff: Math.random() * 60
            });
        }

        function spawnBunker(x, y) {
            units.push({ 
                type: 'bunker', x: x, y: y, 
                hp: 300, maxHp: 300, speed: 0, 
                range: 320, damage: 8, fireRate: 15, fireCooldown: 0, 
                color: '#757575', size: 16,
                preferredStandOff: 0
            });
        }

        function spawnTadpole() {
            let healthPercent = hiveHealth / hiveMaxHealth;
            let spawnChance = 0.035 + ((1 - healthPercent) * 0.10); // Hive gets furious as it dies
            
            if (Math.random() < spawnChance) {
                tadpoles.push({
                    x: tadpoleHive.x - 10,
                    y: 60 + Math.random() * (canvas.height - 120),
                    hp: 20,
                    maxHp: 20,
                    radius: 7,
                    speed: 1.2 + Math.random() * 1.5,
                    wobble: Math.random() * Math.PI * 2,
                    aggroRange: 180,
                    attackCooldown: 0
                });
            }
        }

        function createExplosion(x, y, color) {
            for(let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                    life: 15, color: color, size: Math.random() * 3 + 1
                });
            }
        }

        function drawTextCentered(text, yOffset, size, color) {
            ctx.fillStyle = color;
            ctx.font = `bold ${size}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2 + yOffset);
            ctx.textAlign = 'left';
        }

        // --- HIGHER RESOLUTION DRAWING HELPERS ---
        function drawSoldier(u) {
            ctx.save();
            ctx.translate(u.x, u.y);
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath(); ctx.arc(0, 3, u.size, 0, Math.PI*2); ctx.fill();
            // Legs
            ctx.fillStyle = '#1b381e';
            ctx.fillRect(-3, 2, 2, 4);
            ctx.fillRect(1, 2, 2, 4);
            // Torso
            ctx.fillStyle = u.color;
            ctx.fillRect(-4, -3, 8, 6);
            // Helmet / Head
            ctx.fillStyle = '#265c28';
            ctx.beginPath(); ctx.arc(0, -3, 3.5, 0, Math.PI*2); ctx.fill();
            // Rifle pointing right
            ctx.fillStyle = '#111';
            ctx.fillRect(1, -1, 8, 2);
            ctx.restore();
        }

        function drawTank(u) {
            ctx.save();
            ctx.translate(u.x, u.y);
            // Treads
            ctx.fillStyle = '#111';
            ctx.fillRect(-12, -10, 24, 4);
            ctx.fillRect(-12, 6, 24, 4);
            // Hull
            ctx.fillStyle = u.color;
            ctx.fillRect(-10, -7, 20, 14);
            // Turret
            ctx.fillStyle = '#388e3c';
            ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
            // Cannon
            ctx.fillStyle = '#1b381e';
            ctx.fillRect(0, -1.5, 16, 3);
            ctx.restore();
        }

        function drawBunker(u) {
            ctx.save();
            ctx.translate(u.x, u.y);
            // Concrete structure
            ctx.fillStyle = u.color;
            ctx.beginPath();
            ctx.arc(0, 0, u.size, 0, Math.PI*2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#444';
            ctx.stroke();
            // Sandbag rim
            ctx.fillStyle = '#6d583b';
            ctx.beginPath();
            ctx.arc(0, 0, u.size - 4, 0, Math.PI*2);
            ctx.fill();
            // Turret center
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(4, 0, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillRect(4, -1.5, 12, 3);
            ctx.restore();
        }

        function drawTadpole(t) {
            ctx.save();
            ctx.translate(t.x, t.y);
            let angle = Math.atan2(Math.sin(t.wobble) * 2, -1);
            ctx.rotate(angle);
            
            // Tail
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(t.radius, 0);
            ctx.quadraticCurveTo(t.radius + 8, Math.sin(t.wobble) * 4, t.radius + 14, Math.sin(t.wobble - 1) * 6);
            ctx.stroke();

            // Body (Slightly teardrop organic shape)
            ctx.fillStyle = '#00ff88';
            ctx.beginPath();
            ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
            ctx.fill();

            // Glowing Eyes (Facing Left / toward movement)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-3, -2.5, 1.5, 0, Math.PI*2);
            ctx.arc(-3, 2.5, 1.5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(-3.5, -2.5, 0.7, 0, Math.PI*2);
            ctx.arc(-3.5, 2.5, 0.7, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }

        function gameLoop() {
            const pad = getGamepad();
            
            // --- INPUT HANDLING ---
            if (pad) {
                if (pad.buttons[0].pressed && !buttonState.A) {
                    if (gameState !== 'PLAYING') resetGame();
                    buttonState.A = true;
                } else if (!pad.buttons[0].pressed) buttonState.A = false;

                if (gameState === 'PLAYING') {
                    const lx = pad.axes[0];
                    const ly = pad.axes[1];
                    const deadzone = 0.2;

                    // Move Crosshair
                    if (Math.abs(lx) > deadzone) crosshair.x += lx * crosshair.speed;
                    if (Math.abs(ly) > deadzone) crosshair.y += ly * crosshair.speed;

                    // Clamp Crosshair (Keep off enemy hive)
                    const maxDeployX = canvas.width - 280;
                    crosshair.x = Math.max(40, Math.min(maxDeployX, crosshair.x));
                    crosshair.y = Math.max(40, Math.min(canvas.height - 40, crosshair.y));

                    // [A] Helicopter Paratroopers (3 Soldiers) - Cost: 15
                    if (pad.buttons[0].pressed && buttonState.A === true && !buttonState.A_Attack) {
                        if (commandEnergy >= 15) {
                            commandEnergy -= 15;
                            spawnSoldier(crosshair.x, crosshair.y - 15);
                            spawnSoldier(crosshair.x - 15, crosshair.y + 10);
                            spawnSoldier(crosshair.x + 15, crosshair.y + 10);
                        }
                        buttonState.A_Attack = true;
                    } else if (!pad.buttons[0].pressed) buttonState.A_Attack = false;

                    // [X] Tank Assault (1 Tank + 4 Soldiers) - Cost: 40
                    if (pad.buttons[2].pressed && !buttonState.X) {
                        if (commandEnergy >= 40) {
                            commandEnergy -= 40;
                            spawnTank(crosshair.x, crosshair.y);
                            for(let i = 0; i < 4; i++) spawnSoldier(crosshair.x - 20 - (Math.random()*15), crosshair.y - 20 + (i*14));
                        }
                        buttonState.X = true;
                    } else if (!pad.buttons[2].pressed) buttonState.X = false;

                    // [Y] Heavy Bunker - Cost: 60
                    if (pad.buttons[3].pressed && !buttonState.Y) {
                        if (commandEnergy >= 60) {
                            commandEnergy -= 60;
                            spawnBunker(crosshair.x, crosshair.y);
                        }
                        buttonState.Y = true;
                    } else if (!pad.buttons[3].pressed) buttonState.Y = false;
                }
            }

            // --- UPDATE LOGIC ---
            if (gameState === 'PLAYING') {
                commandEnergy = Math.min(100, commandEnergy + 0.18);
                spawnTadpole();

                // 1. Update Units
                for (let i = units.length - 1; i >= 0; i--) {
                    let u = units[i];
                    if (u.fireCooldown > 0) u.fireCooldown--;

                    let target = null;
                    let closestDist = u.range;

                    // Search for Tadpoles in range
                    for (let t of tadpoles) {
                        let dist = Math.hypot(u.x - t.x, u.y - t.y);
                        if (dist < closestDist) { closestDist = dist; target = t; }
                    }

                    // Check if Hive is in range
                    if (!target && (tadpoleHive.x - u.x) < (u.range - u.preferredStandOff)) {
                        target = tadpoleHive;
                    }

                    if (target) {
                        // Shoot at Target
                        if (u.fireCooldown <= 0) {
                            let targetY = target === tadpoleHive ? u.y + (Math.random()*20-10) : target.y;
                            let angle = Math.atan2(targetY - u.y, (target === tadpoleHive ? tadpoleHive.x : target.x) - u.x);
                            projectiles.push({
                                x: u.x + u.size, y: u.y,
                                vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8,
                                damage: u.damage, isExplosive: u.type === 'tank'
                            });
                            u.fireCooldown = u.fireRate;
                        }
                    } else {
                        // Advance right if path is clear
                        if (u.speed > 0 && u.x < (tadpoleHive.x - u.preferredStandOff - 20)) {
                            u.x += u.speed;
                        }
                    }

                    // Remove Dead Units
                    if (u.hp <= 0) {
                        createExplosion(u.x, u.y, '#ff8800');
                        units.splice(i, 1);
                    }
                }

                // 2. Update Projectiles
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    let p = projectiles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    let hit = false;
                    // Check Hive hit
                    if (p.x > tadpoleHive.x) {
                        hiveHealth -= p.damage;
                        createExplosion(p.x, p.y, '#55ff55');
                        hit = true;
                    } else {
                        // Check Tadpole hit
                        for (let j = tadpoles.length - 1; j >= 0; j--) {
                            let t = tadpoles[j];
                            if (Math.hypot(p.x - t.x, p.y - t.y) < t.radius + 6) {
                                t.hp -= p.damage;
                                hit = true;
                                if (p.isExplosive) createExplosion(p.x, p.y, '#ff4400');
                                else createExplosion(p.x, p.y, '#88ff88');
                                
                                if (t.hp <= 0) {
                                    tadpoles.splice(j, 1);
                                    score += 1000;
                                    tadpolesDestroyedCounter++;
                                    if (tadpolesDestroyedCounter >= 5) {
                                        score += 10000000000000;
                                        tadpolesDestroyedCounter = 0;
                                    }
                                }
                                break;
                            }
                        }
                    }

                    if (hit || p.x > canvas.width || p.x < 0 || p.y < 0 || p.y > canvas.height) {
                        projectiles.splice(i, 1);
                    }
                }
                
                // 3. Update Tadpoles (With Aggro AI towards Army Men)
                for (let i = tadpoles.length - 1; i >= 0; i--) {
                    let t = tadpoles[i];
                    
                    // Look for closest soldier/tank/bunker within aggro range
                    let targetUnit = null;
                    let closestDist = t.aggroRange;
                    for (let u of units) {
                        let dist = Math.hypot(u.x - t.x, u.y - t.y);
                        if (dist < closestDist) {
                            closestDist = dist;
                            targetUnit = u;
                        }
                    }

                    if (targetUnit) {
                        // Move aggressively toward the soldier
                        let angle = Math.atan2(targetUnit.y - t.y, targetUnit.x - t.x);
                        t.x += Math.cos(angle) * (t.speed * 1.1);
                        t.y += Math.sin(angle) * (t.speed * 1.1);

                        // Bite attack if in contact
                        if (closestDist < t.radius + targetUnit.size + 4) {
                            if (t.attackCooldown <= 0) {
                                targetUnit.hp -= 4;
                                t.attackCooldown = 18;
                                createExplosion(t.x, t.y, '#ff0000');
                            } else {
                                t.attackCooldown--;
                            }
                        }
                    } else {
                        // Default behavior: March left toward Player Base
                        t.x -= t.speed;
                        t.y += Math.sin(t.wobble) * 1.5;
                        t.wobble += 0.2;
                    }
                    
                    // Breach Player Base (Left Screen Edge)
                    if (t.x < playerBase.width) {
                        tadpoles.splice(i, 1);
                        baseHealth -= 8;
                        if (baseHealth <= 0) {
                            baseHealth = 0;
                            gameState = 'GAME_OVER';
                        }
                    }
                }

                // 4. Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].x += particles[i].vx;
                    particles[i].y += particles[i].vy;
                    particles[i].life--;
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }

                if (hiveHealth <= 0) gameState = 'VICTORY';
            }

            // --- DRAWING ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'START') {
                drawTextCentered("TADPOLE BASE ASSAULT", -60, 50, "#00ff88");
                drawTextCentered("Defend the Command Center. Eradicate the Swarm Hive.", 0, 20, "white");
                drawTextCentered(pad ? "Press [A] to Start" : "Connect Xbox Controller & Press [A]", 60, 18, pad ? "#00aaff" : "yellow");
            } 
            else if (gameState === 'GAME_OVER') {
                drawTextCentered("BASE COMMAND DESTROYED", -40, 55, "#ff4444");
                drawTextCentered(`Final Score: ${score.toLocaleString()}`, 15, 22, "white");
                drawTextCentered("Press [A] to Try Again", 80, 18, "#00aaff");
            }
            else if (gameState === 'VICTORY') {
                drawTextCentered("SWARM HIVE ERADICATED!", -40, 55, "#44ff44");
                drawTextCentered(`Final Score: ${score.toLocaleString()}`, 15, 22, "white");
                drawTextCentered("Press [A] to Play Again", 80, 18, "#00aaff");
            }
            else if (gameState === 'PLAYING') {
                // Draw Player Base Command Center (Left)
                ctx.fillStyle = '#223322';
                ctx.fillRect(playerBase.x, playerBase.y, playerBase.width, playerBase.height);
                ctx.strokeStyle = '#44aa44';
                ctx.lineWidth = 2;
                ctx.strokeRect(playerBase.x, playerBase.y, playerBase.width, playerBase.height);

                // Draw Enemy Swarm Hive (Right)
                ctx.fillStyle = '#112211';
                ctx.fillRect(tadpoleHive.x, tadpoleHive.y, tadpoleHive.width, tadpoleHive.height);
                // Slime/organic texture lines on the hive
                ctx.strokeStyle = '#00441b';
                ctx.lineWidth = 4;
                for(let y = 20; y < canvas.height; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(tadpoleHive.x, y);
                    ctx.quadraticCurveTo(tadpoleHive.x + 40, y + 20, tadpoleHive.x, y + 40);
                    ctx.stroke();
                }

                // Hive Health Bar
                ctx.fillStyle = '#00ff88';
                let healthPercent = Math.max(0, hiveHealth / hiveMaxHealth);
                ctx.fillRect(tadpoleHive.x + 20, 80, 160 * healthPercent, 20);
                ctx.strokeStyle = 'white'; ctx.lineWidth = 1.5;
                ctx.strokeRect(tadpoleHive.x + 20, 80, 160, 20);
                ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial';
                ctx.fillText(`Hive: ${Math.floor(healthPercent*100)}%`, tadpoleHive.x + 30, 72);

                // Draw Units
                for (let u of units) {
                    if (u.type === 'soldier') drawSoldier(u);
                    else if (u.type === 'tank') drawTank(u);
                    else if (u.type === 'bunker') drawBunker(u);
                    
                    // Tiny Health Bars above damaged units
                    if (u.hp < u.maxHp) {
                        ctx.fillStyle = 'red'; ctx.fillRect(u.x - 8, u.y - u.size - 6, 16, 2.5);
                        ctx.fillStyle = '#00ff00'; ctx.fillRect(u.x - 8, u.y - u.size - 6, 16 * (u.hp/u.maxHp), 2.5);
                    }
                }

                // Draw Projectiles
                for (let p of projectiles) {
                    ctx.fillStyle = p.isExplosive ? '#ffaa00' : '#ffff55';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.isExplosive ? 3 : 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw Tadpoles
                for (let t of tadpoles) {
                    drawTadpole(t);
                }

                // Draw Particles
                for (let p of particles) {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / 15;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1.0;

                // Draw Crosshair
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, crosshair.radius, 0, Math.PI * 2);
                ctx.moveTo(crosshair.x - crosshair.radius - 5, crosshair.y); ctx.lineTo(crosshair.x + crosshair.radius + 5, crosshair.y);
                ctx.moveTo(crosshair.x, crosshair.y - crosshair.radius - 5); ctx.lineTo(crosshair.x, crosshair.y + crosshair.radius + 5);
                ctx.stroke();

                // --- UI / HUD ---
                ctx.fillStyle = 'white';
                ctx.font = 'bold 22px Arial';
                ctx.fillText(`Score: ${score.toLocaleString()}`, 45, 35);
                
                // Base Command HP
                ctx.fillStyle = baseHealth > 30 ? '#44ff44' : '#ff4444';
                ctx.fillText(`Base HP: ${baseHealth}%`, 45, 62);

                // Command Energy Bar
                ctx.fillStyle = 'white'; ctx.font = '14px Arial';
                ctx.fillText("Command Energy:", 240, 48);
                ctx.strokeStyle = 'white'; ctx.strokeRect(240, 54, 180, 16);
                ctx.fillStyle = commandEnergy >= 60 ? '#00aaff' : (commandEnergy >= 15 ? '#44ff44' : '#ff4444');
                ctx.fillRect(241, 55, 178 * (commandEnergy/100), 14);

                // Compact Controls HUD (Bottom Left)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(45, canvas.height - 100, 310, 85);
                ctx.fillStyle = '#aaaaaa'; ctx.font = '13px Arial';
                ctx.fillText("Deploy Forces (Energy Cost):", 55, canvas.height - 80);
                ctx.fillStyle = commandEnergy >= 15 ? '#00aaff' : '#555'; ctx.fillText(`[A] 3x Paratroopers (-15)`, 55, canvas.height - 60);
                ctx.fillStyle = commandEnergy >= 40 ? '#44ff44' : '#555'; ctx.fillText(`[X] Tank Platoon (-40)`, 55, canvas.height - 42);
                ctx.fillStyle = commandEnergy >= 60 ? '#ff4444' : '#555'; ctx.fillText(`[Y] Defense Bunker (-60)`, 55, canvas.height - 24);
            }

            if (!pad && gameState !== 'START') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawTextCentered("Controller Disconnected", 0, 36, "yellow");
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            tadpoleHive.x = canvas.width - 200;
            tadpoleHive.height = canvas.height;
            playerBase.height = canvas.height;
        });
    </script>
</body>
</html>
