<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mecha Brawler</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Forces 16:9 1080p scaling */
        canvas {
            background-color: #1a1a2e;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1920" height="1080"></canvas>

<script>
/**
 * MECHA BRAWLER - ENHANCED EDITION
 */

const canvas = document.getElementById('gameCanvas');
canvas.tabIndex = 0;
// Xbox Edge (console browser) only exposes the Gamepad API to the currently
// focused document, and gains focus can be lost when loaded inside the hub's
// iframe -- pull focus onto this game whenever we get a chance to.
function ensureGameFocus() { window.focus(); canvas.focus({ preventScroll: true }); }
ensureGameFocus();
window.addEventListener('load', ensureGameFocus);
document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureGameFocus(); });
window.addEventListener('gamepadconnected', ensureGameFocus);
const ctx = canvas.getContext('2d');

// --- GAME STATE MANAGEMENT ---
const STATES = { MENU: 0, BUILD: 1, VS_SELECT: 2, BATTLE: 3 };
let currentState = STATES.MENU;
let gameMode = 'SINGLE'; 

// --- INPUT MANAGER ---
const Input = {
    pads: {},
    keys: { 
        p1: { left: false, right: false, up: false, down: false, lightPunch: false, heavyPunch: false, kick: false, block: false, start: false },
        p2: { left: false, right: false, up: false, down: false, lightPunch: false, heavyPunch: false, kick: false, block: false, start: false }
    },
    update() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i]) {
                this.pads[i] = gamepads[i];
            }
        }
    },
    getButton(padIndex, buttonIndex) {
        if (this.pads[padIndex] && this.pads[padIndex].buttons[buttonIndex]) {
            return this.pads[padIndex].buttons[buttonIndex].pressed;
        }
        return false;
    },
    getAxis(padIndex, axisIndex) {
        if (this.pads[padIndex] && this.pads[padIndex].axes[axisIndex]) {
            return this.pads[padIndex].axes[axisIndex];
        }
        return 0;
    }
};

// --- FIGHTER ENTITY ---
class Fighter {
    constructor(x, y, color, isPlayer2 = false) {
        this.x = x;
        this.y = y;
        this.width = 100;
        this.height = 250;
        this.color = color;
        this.isPlayer2 = isPlayer2;
        
        // Physics
        this.vx = 0;
        this.vy = 0;
        this.speed = 12;
        this.jumpPower = -32;
        this.gravity = 1.8;
        this.grounded = false;
        
        // Stats
        this.maxHealth = 1000;
        this.health = 1000;
        
        // Combat State
        this.isAttacking = false;
        this.isBlocking = false;
        this.attackCooldown = 0;
        this.hitStun = 0;
        this.hitbox = { x: 0, y: 0, w: 0, h: 0, active: false, damage: 0 };
    }

    updateAI(opponent) {
        let keys = Input.keys.p2;
        // Reset AI keys
        keys.left = keys.right = keys.up = keys.down = keys.lightPunch = keys.heavyPunch = keys.kick = keys.block = false;

        if (this.hitStun > 0) return; // Can't think while getting punched

        let dist = opponent.x - this.x;
        let absDist = Math.abs(dist);

        // Move towards opponent
        if (absDist > 160) {
            if (dist < 0) keys.left = true;
            else keys.right = true;
        } 
        // Attack range
        else {
            if (this.attackCooldown <= 0) {
                let roll = Math.random();
                if (roll < 0.05) keys.lightPunch = true;
                else if (roll < 0.08) keys.heavyPunch = true;
                else if (roll < 0.12) keys.kick = true;
            }
        }
    }

    update(padIndex, opponent) {
        // Cooldowns & Hit Stun
        if (this.hitStun > 0) {
            this.hitStun--;
            this.isAttacking = false;
            this.hitbox.active = false;
        }
        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.attackCooldown < 15) this.hitbox.active = false; 

        let keys = padIndex === 0 ? Input.keys.p1 : Input.keys.p2;

        // Inputs
        let moveLeft = Input.getButton(padIndex, 14) || Input.getAxis(padIndex, 0) < -0.5 || keys.left;
        let moveRight = Input.getButton(padIndex, 15) || Input.getAxis(padIndex, 0) > 0.5 || keys.right;
        let jump = Input.getButton(padIndex, 12) || Input.getButton(padIndex, 0) || keys.up; 
        let crouch = Input.getButton(padIndex, 13) || Input.getAxis(padIndex, 1) > 0.5 || keys.down;
        
        let lightPunch = Input.getButton(padIndex, 2) || keys.lightPunch;
        let heavyPunch = Input.getButton(padIndex, 3) || keys.heavyPunch;
        let kick = Input.getButton(padIndex, 1) || keys.kick;
        this.isBlocking = (Input.getButton(padIndex, 5) || crouch || keys.block) && this.hitStun === 0 && !this.isAttacking;

        // Movement (Only if not in hitstun, attacking, or blocking)
        if (this.hitStun === 0 && !this.isAttacking && !this.isBlocking) {
            if (moveLeft) this.vx = -this.speed;
            else if (moveRight) this.vx = this.speed;
            else this.vx = 0;

            if (jump && this.grounded) {
                this.vy = this.jumpPower;
                this.grounded = false;
            }
        } else if (this.hitStun === 0) {
            this.vx = 0; 
        }

        // Apply Attacks
        if (this.hitStun === 0 && !this.isAttacking && this.attackCooldown === 0 && !this.isBlocking) {
            if (lightPunch) this.attack('light');
            else if (heavyPunch) this.attack('heavy');
            else if (kick) this.attack('kick');
        }

        // Physics
        this.vy += this.gravity;
        
        // Friction for knockback
        if (this.hitStun > 0 || this.isBlocking) {
            this.vx *= 0.85; 
        }

        this.x += this.vx;
        this.y += this.vy;

        // Physical Collision Pushback (Prevent phasing through bodies)
        let dist = (this.x + this.width/2) - (opponent.x + opponent.width/2);
        if (Math.abs(dist) < this.width && this.y + this.height > opponent.y && this.y < opponent.y + opponent.height) {
            let push = (this.width - Math.abs(dist)) / 2;
            if (dist > 0) this.x += push;
            else this.x -= push;
        }

        // Floor collision
        const floorY = 900;
        if (this.y + this.height >= floorY) {
            this.y = floorY - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        // Screen bounds
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > 1920) this.x = 1920 - this.width;

        // Check hits against opponent
        if (this.hitbox.active) {
            this.checkHit(opponent);
        }
    }

    attack(type) {
        this.isAttacking = true;
        let reach = 140;
        let yOffset = 50;

        let dir = this.isPlayer2 ? -1 : 1; 

        if (type === 'light') {
            this.attackCooldown = 20;
            this.hitbox = { x: this.x + (this.width/2) + (dir * reach/2) - (dir===-1?reach:0), y: this.y + yOffset, w: reach, h: 40, active: true, damage: 30 };
        } else if (type === 'heavy') {
            this.attackCooldown = 45;
            this.hitbox = { x: this.x + (this.width/2) + (dir * reach/2) - (dir===-1?reach+40:0), y: this.y + yOffset + 20, w: reach + 40, h: 80, active: true, damage: 80 };
        } else if (type === 'kick') {
            this.attackCooldown = 35;
            this.hitbox = { x: this.x + (this.width/2) + (dir * reach/2) - (dir===-1?reach+20:0), y: this.y + yOffset + 120, w: reach + 20, h: 60, active: true, damage: 60 };
        }
        
        setTimeout(() => this.isAttacking = false, 250);
    }

    checkHit(opponent) {
        if (this.hitbox.x < opponent.x + opponent.width &&
            this.hitbox.x + this.hitbox.w > opponent.x &&
            this.hitbox.y < opponent.y + opponent.height &&
            this.hitbox.y + this.hitbox.h > opponent.y) {
            
            this.hitbox.active = false; 
            
            if (opponent.isBlocking) {
                opponent.health -= this.hitbox.damage * 0.1; 
                opponent.vx = this.isPlayer2 ? -8 : 8; 
            } else {
                opponent.health -= this.hitbox.damage;
                opponent.vx = this.isPlayer2 ? -25 : 25; 
                opponent.hitStun = 20; // Stunning the opponent!
                opponent.vy = -5; // Slight juggle effect
            }
        }
    }

    draw(ctx) {
        // Draw Robot Body
        ctx.fillStyle = this.hitStun > 0 ? '#ffffff' : this.color; // Flash white when hit
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        // Draw visor/eye 
        ctx.fillStyle = 'cyan';
        let faceX = this.isPlayer2 ? this.x + 10 : this.x + this.width - 30;
        ctx.fillRect(faceX, this.y + 20, 20, 10);

        // Block indicator
        if (this.isBlocking) {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
            ctx.lineWidth = 10;
            ctx.strokeRect(this.x - 10, this.y - 10, this.width + 20, this.height + 20);
        }

        // Draw Hitbox (Visuals)
        if (this.hitbox.active) {
            ctx.fillStyle = 'rgba(255, 50, 50, 0.8)';
            ctx.fillRect(this.hitbox.x, this.hitbox.y, this.hitbox.w, this.hitbox.h);
        }
    }
}

// --- GAME INSTANCES ---
let p1, p2;

function initBattle() {
    p1 = new Fighter(300, 600, '#4a90e2', false);
    p2 = new Fighter(1520, 600, '#e24a4a', true);
    currentState = STATES.BATTLE;
}

// --- RENDER & GAME LOOP ---
function drawUI() {
    ctx.fillStyle = 'white';
    ctx.font = '40px Arial';
    
    if (currentState === STATES.MENU) {
        ctx.textAlign = 'center';
        ctx.font = '80px Arial';
        ctx.fillText("MECHA BRAWLER", 1920/2, 400);
        
        ctx.font = '40px Arial';
        ctx.fillText("Press (J) or (A) for Single Player", 1920/2, 600);
        ctx.fillText("Press (K) or (X) for VS Mode", 1920/2, 700);
        
        ctx.font = '24px Arial';
        ctx.fillStyle = '#aaa';
        ctx.fillText("PC Controls: WASD to Move, S to Block | J = Light, K = Heavy, L = Kick", 1920/2, 950);
        
        if (Input.getButton(0, 0) || Input.keys.p1.lightPunch) { 
            gameMode = 'SINGLE';
            currentState = STATES.BUILD;
            Input.keys.p1.lightPunch = false; // consume input
            setTimeout(() => {}, 200); 
        }
        if (Input.getButton(0, 2) || Input.keys.p1.heavyPunch) { 
            gameMode = 'VS';
            initBattle();
        }
    } 
    else if (currentState === STATES.BUILD) {
        ctx.textAlign = 'center';
        ctx.fillText("GARAGE: BUILD YOUR ROBOT", 1920/2, 200);
        ctx.font = '24px Arial';
        ctx.fillText("Use D-Pad to swap parts. (Prototype UI)", 1920/2, 300);
        
        ctx.fillStyle = '#4a90e2';
        ctx.fillRect(1920/2 - 100, 400, 200, 400);
        
        ctx.fillStyle = 'white';
        ctx.fillText("Press (Enter) or (Y) to BATTLE", 1920/2, 900);
        
        if (Input.getButton(0, 3) || Input.getButton(0, 9) || Input.keys.p1.start) {
            Input.keys.p1.start = false; // consume input
            initBattle();
        }
    }
    else if (currentState === STATES.BATTLE) {
        // Health Bars
        ctx.fillStyle = 'red';
        ctx.fillRect(100, 50, 700, 50);
        ctx.fillRect(1120, 50, 700, 50);
        
        ctx.fillStyle = 'lime';
        ctx.fillRect(100, 50, Math.max(0, p1.health / p1.maxHealth) * 700, 50);
        let p2HpWidth = Math.max(0, p2.health / p2.maxHealth) * 700;
        ctx.fillRect(1120 + (700 - p2HpWidth), 50, p2HpWidth, 50);
        
        ctx.textAlign = 'center';
        ctx.fillText("VS", 1920/2, 90);

        if (p1.health <= 0 || p2.health <= 0) {
            ctx.font = '80px Arial';
            ctx.fillText(p1.health <= 0 ? "PLAYER 2 WINS!" : "PLAYER 1 WINS!", 1920/2, 1080/2);
            ctx.font = '40px Arial';
            ctx.fillText("Press (B) or (L) to Return to Menu", 1920/2, 1080/2 + 100);
            
            if (Input.getButton(0, 1) || Input.keys.p1.kick) {
                Input.keys.p1.kick = false;
                currentState = STATES.MENU; 
            }
        }
    }
}

function update() {
    Input.update();
    
    if (currentState === STATES.BATTLE && p1.health > 0 && p2.health > 0) {
        // Face each other dynamically
        p1.isPlayer2 = p1.x > p2.x;
        p2.isPlayer2 = p2.x > p1.x;
        
        p1.update(0, p2);
        
        if (gameMode === 'VS') {
            p2.update(1, p1); 
        } else {
            // Run Single Player AI
            p2.updateAI(p1);
            p2.update(1, p1); 
        }
    }
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    update();
    
    // Draw Environment
    if (currentState === STATES.BATTLE) {
        // Grid background
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
        ctx.lineWidth = 2;
        for(let i=0; i<1920; i+=100) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 900); ctx.stroke(); }
        
        // Floor
        ctx.fillStyle = '#223';
        ctx.fillRect(0, 900, 1920, 180); 
        ctx.fillStyle = '#0ff';
        ctx.fillRect(0, 900, 1920, 5);
        
        p1.draw(ctx);
        p2.draw(ctx);
    }
    
    drawUI();
    requestAnimationFrame(loop);
}

// Full PC Keyboard Fallback mapping
window.addEventListener('keydown', (e) => {
    let k = e.key.toLowerCase();
    if (k === 'a') Input.keys.p1.left = true;
    if (k === 'd') Input.keys.p1.right = true;
    if (k === 'w') Input.keys.p1.up = true;
    if (k === 's') Input.keys.p1.down = true;
    if (k === 'j') Input.keys.p1.lightPunch = true;
    if (k === 'k') Input.keys.p1.heavyPunch = true;
    if (k === 'l') Input.keys.p1.kick = true;
    if (e.key === 'Enter') Input.keys.p1.start = true;
});

window.addEventListener('keyup', (e) => {
    let k = e.key.toLowerCase();
    if (k === 'a') Input.keys.p1.left = false;
    if (k === 'd') Input.keys.p1.right = false;
    if (k === 'w') Input.keys.p1.up = false;
    if (k === 's') Input.keys.p1.down = false;
    if (k === 'j') Input.keys.p1.lightPunch = false;
    if (k === 'k') Input.keys.p1.heavyPunch = false;
    if (k === 'l') Input.keys.p1.kick = false;
    if (e.key === 'Enter') Input.keys.p1.start = false;
});

// Start game
requestAnimationFrame(loop);
</script>
</body>
</html>
