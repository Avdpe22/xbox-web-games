<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mecha Brawler</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Forces 16:9 1080p scaling for Xbox Edge */
        canvas {
            background-color: #1a1a2e;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1920" height="1080"></canvas>

<script>
/**
 * MECHA BRAWLER - XBOX EDGE OPTIMIZED
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE MANAGEMENT ---
const STATES = { MENU: 0, BUILD: 1, VS_SELECT: 2, BATTLE: 3 };
let currentState = STATES.MENU;
let gameMode = 'SINGLE'; // 'SINGLE' or 'VS'

// --- GAMEPAD API MANAGER ---
const Input = {
    pads: {},
    keys: { // Fallback keyboard for testing on PC
        p1: { left: false, right: false, up: false, down: false, lightPunch: false, heavyPunch: false, kick: false, block: false },
        p2: { left: false, right: false, up: false, down: false, lightPunch: false, heavyPunch: false, kick: false, block: false }
    },
    update() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i]) {
                this.pads[i] = gamepads[i];
            }
        }
    },
    // Xbox Standard Mapping: 0:A, 1:B, 2:X, 3:Y, 4:LB, 5:RB, 6:LT, 7:RT, 12:Up, 13:Down, 14:Left, 15:Right
    getButton(padIndex, buttonIndex) {
        if (this.pads[padIndex] && this.pads[padIndex].buttons[buttonIndex]) {
            return this.pads[padIndex].buttons[buttonIndex].pressed;
        }
        return false;
    },
    getAxis(padIndex, axisIndex) {
        if (this.pads[padIndex] && this.pads[padIndex].axes[axisIndex]) {
            return this.pads[padIndex].axes[axisIndex];
        }
        return 0;
    }
};

// --- FIGHTER ENTITY ---
class Fighter {
    constructor(x, y, color, isPlayer2 = false) {
        this.x = x;
        this.y = y;
        this.width = 100;
        this.height = 250;
        this.color = color;
        this.isPlayer2 = isPlayer2;
        
        // Physics
        this.vx = 0;
        this.vy = 0;
        this.speed = 10;
        this.jumpPower = -30;
        this.gravity = 1.5;
        this.grounded = false;
        
        // Stats (Affected by parts)
        this.maxHealth = 1000;
        this.health = 1000;
        this.parts = { head: 'basic', torso: 'basic', arms: 'basic', legs: 'basic' };
        
        // Combat State
        this.isAttacking = false;
        this.isBlocking = false;
        this.attackCooldown = 0;
        this.hitbox = { x: 0, y: 0, w: 0, h: 0, active: false, damage: 0 };
    }

    update(padIndex, opponent) {
        // Cooldowns
        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.attackCooldown < 15) this.hitbox.active = false; // Attack frames end

        // Inputs
        let moveLeft = Input.getButton(padIndex, 14) || Input.getAxis(padIndex, 0) < -0.5 || (padIndex === 0 && Input.keys.p1.left);
        let moveRight = Input.getButton(padIndex, 15) || Input.getAxis(padIndex, 0) > 0.5 || (padIndex === 0 && Input.keys.p1.right);
        let jump = Input.getButton(padIndex, 12) || Input.getButton(padIndex, 0); // D-pad Up or A
        let crouch = Input.getButton(padIndex, 13) || Input.getAxis(padIndex, 1) > 0.5;
        
        // Attacks mapping (X = Light Punch, Y = Heavy Punch, B = Kick, RB = Block)
        let lightPunch = Input.getButton(padIndex, 2);
        let heavyPunch = Input.getButton(padIndex, 3);
        let kick = Input.getButton(padIndex, 1);
        this.isBlocking = Input.getButton(padIndex, 5) || crouch; // RB or Crouch to block

        // Movement
        if (!this.isAttacking && !this.isBlocking) {
            if (moveLeft) this.vx = -this.speed;
            else if (moveRight) this.vx = this.speed;
            else this.vx = 0;

            if (jump && this.grounded) {
                this.vy = this.jumpPower;
                this.grounded = false;
            }
        } else {
            this.vx = 0; // Stop moving while attacking/blocking
        }

        // Apply Attacks
        if (!this.isAttacking && this.attackCooldown === 0 && !this.isBlocking) {
            if (lightPunch) this.attack('light');
            else if (heavyPunch) this.attack('heavy');
            else if (kick) this.attack('kick');
        }

        // Physics
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;

        // Floor collision
        const floorY = 900;
        if (this.y + this.height >= floorY) {
            this.y = floorY - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        // Screen bounds
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > 1920) this.x = 1920 - this.width;

        // Check hits against opponent
        if (this.hitbox.active) {
            this.checkHit(opponent);
        }
    }

    attack(type) {
        this.isAttacking = true;
        this.hitbox.active = true;
        let reach = 120;
        let yOffset = 50;

        // Direction modifier based on player position vs opponent
        let dir = this.isPlayer2 ? -1 : 1; 

        if (type === 'light') {
            this.attackCooldown = 20;
            this.hitbox = { x: this.x + (this.width/2) + (dir * reach/2), y: this.y + yOffset, w: reach, h: 40, active: true, damage: 30 };
        } else if (type === 'heavy') {
            this.attackCooldown = 40;
            this.hitbox = { x: this.x + (this.width/2) + (dir * reach), y: this.y + yOffset + 20, w: reach + 40, h: 60, active: true, damage: 80 };
        } else if (type === 'kick') {
            this.attackCooldown = 35;
            this.hitbox = { x: this.x + (this.width/2) + (dir * reach), y: this.y + yOffset + 100, w: reach + 20, h: 50, active: true, damage: 60 };
        }
        
        setTimeout(() => this.isAttacking = false, 200);
    }

    checkHit(opponent) {
        if (this.hitbox.x < opponent.x + opponent.width &&
            this.hitbox.x + this.hitbox.w > opponent.x &&
            this.hitbox.y < opponent.y + opponent.height &&
            this.hitbox.y + this.hitbox.h > opponent.y) {
            
            this.hitbox.active = false; // Prevent multi-hit on single frame
            if (opponent.isBlocking) {
                opponent.health -= this.hitbox.damage * 0.1; // Chip damage
                opponent.vx = this.isPlayer2 ? -5 : 5; // Knockback
            } else {
                opponent.health -= this.hitbox.damage;
                opponent.vx = this.isPlayer2 ? -15 : 15; // Heavy Knockback
            }
        }
    }

    draw(ctx) {
        // Draw Robot Body
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        // Draw visor/eye to indicate facing direction
        ctx.fillStyle = 'cyan';
        let faceX = this.isPlayer2 ? this.x + 10 : this.x + this.width - 30;
        ctx.fillRect(faceX, this.y + 20, 20, 10);

        // Block indicator
        if (this.isBlocking) {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
            ctx.lineWidth = 10;
            ctx.strokeRect(this.x - 10, this.y - 10, this.width + 20, this.height + 20);
        }

        // Draw Hitbox (Debug/Visuals)
        if (this.hitbox.active) {
            ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
            ctx.fillRect(this.hitbox.x, this.hitbox.y, this.hitbox.w, this.hitbox.h);
        }
    }
}

// --- GAME INSTANCES ---
let p1, p2;

function initBattle() {
    p1 = new Fighter(300, 600, '#4a90e2', false);
    p2 = new Fighter(1520, 600, '#e24a4a', true);
    currentState = STATES.BATTLE;
}

// --- RENDER & GAME LOOP ---
function drawUI() {
    ctx.fillStyle = 'white';
    ctx.font = '40px Arial';
    
    if (currentState === STATES.MENU) {
        ctx.textAlign = 'center';
        ctx.fillText("MECHA BRAWLER", 1920/2, 400);
        ctx.fillText("Press (A) for Single Player Build-a-Bot", 1920/2, 600);
        ctx.fillText("Press (X) for VS Mode (Pre-built)", 1920/2, 700);
        
        if (Input.getButton(0, 0)) { // A button
            gameMode = 'SINGLE';
            currentState = STATES.BUILD;
            setTimeout(() => {}, 200); // debounce
        }
        if (Input.getButton(0, 2)) { // X button
            gameMode = 'VS';
            initBattle();
        }
    } 
    
    else if (currentState === STATES.BUILD) {
        ctx.textAlign = 'center';
        ctx.fillText("GARAGE: BUILD YOUR ROBOT", 1920/2, 200);
        ctx.font = '24px Arial';
        ctx.fillText("Use D-Pad to swap parts. (Prototype UI)", 1920/2, 300);
        
        // Mock UI for building
        ctx.fillStyle = '#4a90e2';
        ctx.fillRect(1920/2 - 100, 400, 200, 400);
        
        ctx.fillStyle = 'white';
        ctx.fillText("Press (START) or (Y) to BATTLE", 1920/2, 900);
        
        if (Input.getButton(0, 3) || Input.getButton(0, 9)) { // Y or Start
            initBattle();
        }
    }
    
    else if (currentState === STATES.BATTLE) {
        // Health Bars
        ctx.fillStyle = 'red';
        ctx.fillRect(100, 50, 700, 50);
        ctx.fillRect(1120, 50, 700, 50);
        
        ctx.fillStyle = 'lime';
        ctx.fillRect(100, 50, Math.max(0, p1.health / p1.maxHealth) * 700, 50);
        // Player 2 health bar fills from the right
        let p2HpWidth = Math.max(0, p2.health / p2.maxHealth) * 700;
        ctx.fillRect(1120 + (700 - p2HpWidth), 50, p2HpWidth, 50);
        
        // Timer
        ctx.textAlign = 'center';
        ctx.fillText("99", 1920/2, 90);

        if (p1.health <= 0 || p2.health <= 0) {
            ctx.font = '80px Arial';
            ctx.fillText(p1.health <= 0 ? "PLAYER 2 WINS!" : "PLAYER 1 WINS!", 1920/2, 1080/2);
            ctx.font = '40px Arial';
            ctx.fillText("Press (B) to Return to Menu", 1920/2, 1080/2 + 100);
            
            if (Input.getButton(0, 1)) currentState = STATES.MENU; // B to return
        }
    }
}

function update() {
    Input.update();
    
    if (currentState === STATES.BATTLE && p1.health > 0 && p2.health > 0) {
        // Face each other
        p1.isPlayer2 = p1.x > p2.x;
        p2.isPlayer2 = p2.x > p1.x;
        
        // Controller 1 always controls P1. If VS mode, Controller 2 controls P2.
        // If Single player mode and no 2nd controller, P2 is an idle punching bag for now.
        p1.update(0, p2);
        if (gameMode === 'VS') {
            p2.update(1, p1); // Requires 2nd controller active
        } else {
            p2.update(1, p1); // Mock AI/Idle update
        }
    }
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    update();
    
    // Draw Environment
    if (currentState === STATES.BATTLE) {
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 900, 1920, 180); // Floor
        
        p1.draw(ctx);
        p2.draw(ctx);
    }
    
    drawUI();
    
    requestAnimationFrame(loop);
}

// Keyboard fallback for testing on a PC browser before pushing to Xbox
window.addEventListener('keydown', (e) => {
    if (e.key === 'a') Input.keys.p1.left = true;
    if (e.key === 'd') Input.keys.p1.right = true;
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'a') Input.keys.p1.left = false;
    if (e.key === 'd') Input.keys.p1.right = false;
});

// Start game
requestAnimationFrame(loop);

</script>
</body>
</html>
