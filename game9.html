<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocky Builder: Skeleton Invasion</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background-color: #1e1e2f; 
            box-shadow: 0 0 20px rgba(0,0,0,1);
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            text-shadow: 2px 2px 2px black;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="hud" style="display: none;">
            <div>Health: <span id="hp">100</span>% | Scrap: <span id="scrap">0</span>/10</div>
            <div>Equipped Power: <span id="power" style="font-weight: bold; color: #aaa;">None</span></div>
            <div style="font-size: 14px; margin-top: 5px; color: #ccc;">Left Stick: Move | A: Jump | X: Build (10 Scrap) | Y: Interact/Next Dialog | LB/RB: Switch Power</div>
        </div>
    </div>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE ---
let gameState = 'start'; // start, playing, won, lost
let camera = { x: 0, y: 0, zoom: 0.75 };
let frames = 0;

// Inputs
const keys = {};
let prevKeys = {};
let buttonState = { y: false, lb: false, rb: false, start: false };
const GAMEPAD_DEADZONE = 0.4;

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function isPressed(code) {
    return keys[code] && !prevKeys[code];
}

// --- GLOBAL VARIABLES ---
let player, worldWidth, worldHeight, groundY, platforms, supplies, skeletons, robots, projectiles, particles, npcs, unlockedPowers, currentPowerIndex, boss, dialog;

const POWER_COLORS = ['#aaaaaa', '#ff4400', '#00eeff', '#ffee00', '#885522'];
const POWER_NAMES = ['Basic', 'Fire', 'Ice', 'Lightning', 'Earth'];

// --- INITIALIZATION ---
function initGame() {
    player = { x: 200, y: 500, w: 30, h: 60, vx: 0, vy: 0, speed: 6, jumpPower: -14, grounded: false, hp: 100, maxHp: 100, scrap: 0, buildCooldown: 0 };
    unlockedPowers = [0]; // Always start with basic (0)
    currentPowerIndex = 0;
    
    groundY = 800;
    worldWidth = 6000;
    worldHeight = 1000;
    
    // Metroidvania Map - Platforms and Gates
    platforms = [
        {x: 0, y: groundY, w: worldWidth, h: 200, type: 'ground'},
        {x: 500, y: 650, w: 200, h: 20, type: 'platform'},
        {x: 800, y: 500, w: 200, h: 20, type: 'platform'},
        {x: 1200, y: 650, w: 150, h: 20, type: 'platform'},
        
        // Ice Zone
        {x: 1800, y: 400, w: 300, h: 20, type: 'platform'},
        {x: 2200, y: 250, w: 200, h: 20, type: 'platform'},
        
        // Earth Zone
        {x: 3000, y: 600, w: 400, h: 20, type: 'platform'},
        {x: 3500, y: 450, w: 200, h: 20, type: 'platform'},
        {x: 3800, y: 300, w: 150, h: 20, type: 'platform'},
        
        // Gates (Require powers to pass)
        {x: 1600, y: groundY - 200, w: 40, h: 200, type: 'gate', weakness: 1, hp: 100, color: '#0055ff'}, // Ice gate needs Fire
        {x: 2800, y: groundY - 300, w: 40, h: 300, type: 'gate', weakness: 4, hp: 100, color: '#aaa'}, // Stone gate needs Earth
    ];

    supplies = [];
    for(let i=0; i<60; i++) {
        supplies.push({ x: 400 + Math.random() * (worldWidth - 1000), y: groundY - 50 - Math.random() * 400, w: 16, h: 16, active: true });
    }

    skeletons = [];
    robots = [];
    projectiles = [];
    particles = [];

    npcs = [
        { 
            x: 900, y: 440, w: 30, h: 60, name: "Scrap Mechanic", color: '#ff4400',
            messages: [
                "Hey you! This place is crawling with skeletons.",
                "Your basic robots are weak against those icy barriers ahead.",
                "Take this FIRE CORE. Use LB/RB to switch elements.",
                "Fire melts ice! Good luck!"
            ],
            unlock: 1, talked: false
        },
        { 
            x: 2300, y: 190, w: 30, h: 60, name: "Deep Miner", color: '#885522',
            messages: [
                "Brrr... thanks for clearing out those ice monsters.",
                "I dug up something interesting in the caves.",
                "This EARTH CORE lets your robots hurl heavy boulders.",
                "Use it to smash through the stone walls blocking the east!"
            ],
            unlock: 4, talked: false
        }
    ];

    boss = { x: 5500, y: 300, radius: 120, hp: 2000, maxHp: 2000, active: false, attackTimer: 0 };

    dialog = { active: false, textIndex: 0, npcIndex: -1 };
    gameState = 'playing';
    document.getElementById('hud').style.display = 'block';
}

// --- INPUT & UPDATE ---
function getGamepad() {
    const gamepads = navigator.getGamepads();
    for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i] && gamepads[i].mapping === 'standard') return gamepads[i];
    }
    return null;
}

// Returns true on the frame a button transitions from released to pressed.
function wasJustPressed(pad, buttonIndex, stateKey) {
    const isPressed = pad.buttons[buttonIndex].pressed;
    const justPressed = isPressed && !buttonState[stateKey];
    buttonState[stateKey] = isPressed;
    return justPressed;
}

function updateInput() {
    const gp = getGamepad();

    let moveLeft = keys['ArrowLeft'] || keys['KeyA'];
    let moveRight = keys['ArrowRight'] || keys['KeyD'];
    let jump = keys['ArrowUp'] || keys['KeyW'] || keys['Space'];
    let build = keys['KeyB'] || keys['KeyX'];
    let interact = isPressed('KeyE') || isPressed('KeyY');
    let prevPower = isPressed('KeyQ');
    let nextPower = isPressed('KeyE');

    if (gp) {
        if (gp.axes[0] < -GAMEPAD_DEADZONE || gp.buttons[14].pressed) moveLeft = true;
        if (gp.axes[0] > GAMEPAD_DEADZONE || gp.buttons[15].pressed) moveRight = true;
        if (gp.buttons[0].pressed) jump = true;
        if (gp.buttons[2].pressed) build = true;
        if (wasJustPressed(gp, 3, 'y')) interact = true;
        if (wasJustPressed(gp, 4, 'lb')) prevPower = true;
        if (wasJustPressed(gp, 5, 'rb')) nextPower = true;
    }

    if (dialog.active) {
        if (interact) advanceDialog();
        return; // Don't move while talking
    }

    // Movement
    if (moveLeft) player.vx = -player.speed;
    else if (moveRight) player.vx = player.speed;
    else player.vx = 0;

    if (jump && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    // Switch Powers
    if (prevPower) {
        currentPowerIndex = (currentPowerIndex - 1 + unlockedPowers.length) % unlockedPowers.length;
    }
    if (nextPower && !interact) { // E is shared with interact, prefer interact if near NPC
        let nearNPC = npcs.some(n => Math.abs(player.x - n.x) < 80);
        if(!nearNPC) currentPowerIndex = (currentPowerIndex + 1) % unlockedPowers.length;
    }

    // Build
    if (build && player.buildCooldown <= 0 && player.scrap >= 10) {
        player.scrap -= 10;
        player.buildCooldown = 30; // Half second
        robots.push({
            x: player.x, y: player.y + player.h - 40, w: 40, h: 40, 
            type: unlockedPowers[currentPowerIndex], fireTimer: 0, hp: 100
        });
    }

    // Interact
    if (interact) {
        for (let i = 0; i < npcs.length; i++) {
            if (Math.abs(player.x - npcs[i].x) < 80 && Math.abs(player.y - npcs[i].y) < 100) {
                dialog.active = true;
                dialog.npcIndex = i;
                dialog.textIndex = 0;
                break;
            }
        }
    }
}

function advanceDialog() {
    let npc = npcs[dialog.npcIndex];
    dialog.textIndex++;
    if (dialog.textIndex >= npc.messages.length) {
        dialog.active = false;
        if (!npc.talked) {
            npc.talked = true;
            if (!unlockedPowers.includes(npc.unlock)) {
                unlockedPowers.push(npc.unlock);
                currentPowerIndex = unlockedPowers.length - 1; // Auto equip new power
            }
        }
    }
}

function spawnSkeletons() {
    if (frames % 120 === 0 && skeletons.length < 15 && !boss.active) {
        let spawnX = player.x + (Math.random() > 0.5 ? 1200 : -1200);
        if (spawnX > 100 && spawnX < worldWidth - 1000) {
            skeletons.push({ x: spawnX, y: groundY - 60, w: 25, h: 60, hp: 60, maxHp: 60, speed: 2 + Math.random(), frozen: 0 });
        }
    }
}

function updatePhysics() {
    if (dialog.active) return;

    player.vy += 0.6; // Gravity
    player.x += player.vx;
    player.y += player.vy;
    player.grounded = false;

    // Platform & Gate collision
    platforms.forEach(p => {
        if (p.hp <= 0) return;
        
        // Floor collision (falling onto)
        if (player.vy > 0 && player.x + player.w > p.x && player.x < p.x + p.w && 
            player.y + player.h >= p.y && player.y + player.h <= p.y + 30) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
        }
        
        // Wall collision (Gates)
        if (p.type === 'gate') {
            if (player.x + player.w > p.x && player.x < p.x + p.w && player.y + player.h > p.y && player.y < p.y + p.h) {
                if (player.vx > 0) player.x = p.x - player.w; // Hit from left
                else if (player.vx < 0) player.x = p.x + p.w; // Hit from right
            }
        }
    });

    // Boundaries
    if(player.x < 0) player.x = 0;
    if(player.x > worldWidth - player.w) player.x = worldWidth - player.w;

    // Camera follow (centered with zoom)
    camera.x = player.x - (canvas.width / camera.zoom) / 2 + player.w / 2;
    camera.y = player.y - (canvas.height / camera.zoom) / 1.5;
    
    // Clamp camera
    if (camera.x < 0) camera.x = 0;
    if (camera.x > worldWidth - (canvas.width / camera.zoom)) camera.x = worldWidth - (canvas.width / camera.zoom);
    if (camera.y > groundY - (canvas.height / camera.zoom)) camera.y = groundY - (canvas.height / camera.zoom);
}

function updateEntities() {
    if (dialog.active) return;

    if (player.buildCooldown > 0) player.buildCooldown--;

    // Supplies
    supplies.forEach(s => {
        if (s.active && player.x < s.x + s.w && player.x + player.w > s.x && player.y < s.y + s.h && player.y + player.h > s.y) {
            s.active = false;
            player.scrap += 2;
        }
    });

    // Robots shooting
    robots.forEach(r => {
        if(r.hp <= 0) return;
        r.fireTimer--;
        if (r.fireTimer <= 0) {
            let target = null;
            let minDist = 800;
            let possibleTargets = boss.active ? skeletons.concat([boss]) : skeletons.concat(platforms.filter(p => p.type==='gate' && p.hp > 0));
            
            possibleTargets.forEach(enemy => {
                let dist = Math.hypot((enemy.x + (enemy.w||enemy.radius)/2) - (r.x + r.w/2), (enemy.y + (enemy.h||enemy.radius)/2) - (r.y + r.h/2));
                if (dist < minDist && (enemy.hp > 0 || enemy.active)) {
                    minDist = dist;
                    target = enemy;
                }
            });

            if (target) {
                r.fireTimer = r.type === 4 ? 90 : 45; // Earth is slower
                let tx = target.x + (target.w||target.radius)/2;
                let ty = target.y + (target.h||target.radius)/2;
                let angle = Math.atan2(ty - (r.y + 10), tx - (r.x + r.w/2));
                
                projectiles.push({
                    x: r.x + r.w/2, y: r.y + 10,
                    vx: Math.cos(angle) * 12, vy: Math.sin(angle) * 12,
                    type: r.type, active: true, radius: r.type === 4 ? 15 : 8, isEnemy: false
                });
            }
        }
    });

    // Projectiles
    projectiles.forEach(p => {
        if (!p.active) return;
        p.x += p.vx;
        p.y += p.vy;
        if(p.type === 4) p.vy += 0.2; // Earth is affected by gravity
        
        // Particles
        if(Math.random() < 0.5) {
            particles.push({x: p.x, y: p.y, vx: -p.vx*0.2 + (Math.random()-0.5), vy: -p.vy*0.2 + (Math.random()-0.5), life: 10, color: POWER_COLORS[p.type]});
        }

        if (p.isEnemy) {
            if (Math.hypot(p.x - (player.x+player.w/2), p.y - (player.y+player.h/2)) < 30) {
                p.active = false;
                player.hp -= 15;
            }
            return; // Skip enemy damage checks below
        }

        // Hit Gates
        platforms.forEach(plat => {
            if (plat.type === 'gate' && plat.hp > 0 && p.x > plat.x && p.x < plat.x + plat.w && p.y > plat.y && p.y < plat.y + plat.h) {
                p.active = false;
                if (p.type === plat.weakness) plat.hp -= 34; // 3 hits to break
            }
        });

        // Hit Boss
        if (boss.active && Math.hypot(p.x - boss.x, p.y - boss.y) < boss.radius + p.radius) {
            p.active = false;
            boss.hp -= 25;
            if(p.type === 2) boss.attackTimer += 20; // Ice slows boss
            if(p.type === 4) boss.hp -= 25; // Earth double damage
            if(boss.hp <= 0) gameState = 'won';
        }

        // Hit skeletons
        skeletons.forEach(skel => {
            if (skel.hp > 0 && p.x > skel.x && p.x < skel.x + skel.w && p.y > skel.y && p.y < skel.y + skel.h) {
                p.active = false;
                skel.hp -= (p.type === 1) ? 40 : 20;
                if (p.type === 2) skel.frozen = 120; // Freeze
                if (p.type === 3) { // Lightning arc to nearest
                    skel.hp -= 15;
                    skeletons.forEach(s2 => {
                        if (s2 !== skel && Math.hypot(s2.x - skel.x, s2.y - skel.y) < 150) {
                            s2.hp -= 20;
                            particles.push({x: skel.x, y: skel.y, vx: (s2.x-skel.x)*0.1, vy: (s2.y-skel.y)*0.1, life: 10, color: '#ffee00', arc: true});
                        }
                    });
                }
                if (p.type === 4) { skel.vy = -8; skel.y -= 5; } // Knockback
            }
        });
    });

    // Skeletons
    skeletons.forEach(skel => {
        if (skel.hp <= 0) return;
        skel.vy = skel.vy || 0;
        skel.vy += 0.5; // Gravity
        skel.y += skel.vy;
        if(skel.y + skel.h > groundY) { skel.y = groundY - skel.h; skel.vy = 0; }

        if (skel.frozen > 0) {
            skel.frozen--;
        } else {
            if (skel.x < player.x) skel.x += skel.speed;
            else skel.x -= skel.speed;
        }
        
        // Melee Player
        if (Math.abs(skel.x - player.x) < 30 && Math.abs(skel.y - player.y) < 60) {
            player.hp -= 0.3;
        }
        
        // Attack Robots
        robots.forEach(r => {
            if (r.hp > 0 && Math.abs(skel.x - r.x) < 30 && Math.abs(skel.y - r.y) < 60) {
                r.hp -= 0.5;
            }
        });
    });

    // Boss Phase
    if (player.x > worldWidth - 1200) boss.active = true;
    if (boss.active) {
        boss.y = 200 + Math.sin(frames / 30) * 50; 
        boss.x += (player.x + 400 - boss.x) * 0.015; // Hover right of player

        boss.attackTimer--;
        if (boss.attackTimer <= 0) {
            boss.attackTimer = 80;
            projectiles.push({
                x: boss.x - boss.radius, y: boss.y + 40,
                vx: -10, vy: ((player.y + player.h/2) - (boss.y + 40)) / 40,
                type: 0, active: true, radius: 15, isEnemy: true
            });
        }
    }

    // Cleanup
    skeletons = skeletons.filter(s => s.hp > 0);
    robots = robots.filter(r => r.hp > 0);
    projectiles = projectiles.filter(p => p.active && p.x > camera.x - 200 && p.x < camera.x + (canvas.width/camera.zoom) + 200 && p.y < worldHeight);
    particles.forEach(p => p.life--);
    particles = particles.filter(p => p.life > 0);

    if (player.hp <= 0) gameState = 'lost';
}


// --- RENDERING PROCEDURAL TEXTURES ---

function drawPlasticRobot(x, y, w, h) {
    ctx.save();
    ctx.translate(x, y);
    
    // Glossy Body
    let grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#0055aa');
    grad.addColorStop(0.5, '#0088ff');
    grad.addColorStop(1, '#003377');
    ctx.fillStyle = grad;
    
    // Torso (Trapezoid-ish)
    ctx.beginPath();
    ctx.moveTo(5, 20); ctx.lineTo(w-5, 20);
    ctx.lineTo(w, h-15); ctx.lineTo(0, h-15);
    ctx.fill();

    // Legs
    ctx.fillStyle = '#444'; // Joints
    ctx.fillRect(5, h-15, 8, 15);
    ctx.fillRect(w-13, h-15, 8, 15);
    
    // Head (Cylinder)
    ctx.fillStyle = '#ffcc00'; // Yellow plastic head
    ctx.fillRect(5, 0, 20, 20);
    ctx.fillStyle = 'black'; // Visor/Eyes
    ctx.fillRect(8, 5, 14, 6);
    
    // Arms (Claws)
    ctx.fillStyle = '#0088ff';
    ctx.fillRect(-5, 25, 8, 20); // Left arm
    ctx.fillRect(w-3, 25, 8, 20); // Right arm
    ctx.fillStyle = '#555';
    ctx.beginPath(); ctx.arc(-1, 45, 5, 0, Math.PI, true); ctx.stroke(); // Left Claw
    ctx.beginPath(); ctx.arc(w+1, 45, 5, 0, Math.PI, true); ctx.stroke(); // Right Claw

    ctx.restore();
}

function drawSkeleton(x, y, w, h) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    // Spine
    ctx.beginPath(); ctx.moveTo(w/2, 20); ctx.lineTo(w/2, h-25); ctx.stroke();
    // Ribs
    for(let i=0; i<3; i++) {
        ctx.beginPath(); ctx.moveTo(w/2-8, 25+i*8); ctx.lineTo(w/2+8, 25+i*8); ctx.stroke();
    }
    // Arms
    ctx.beginPath(); ctx.moveTo(w/2-5, 25); ctx.lineTo(-5, 40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w/2+5, 25); ctx.lineTo(w+5, 40); ctx.stroke();
    // Legs
    ctx.beginPath(); ctx.moveTo(w/2-3, h-25); ctx.lineTo(w/2-8, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w/2+3, h-25); ctx.lineTo(w/2+8, h); ctx.stroke();
    
    // Skull
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(w/2, 10, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillRect(w/2-5, 6, 4, 4); // Eye L
    ctx.fillRect(w/2+1, 6, 4, 4); // Eye R
    ctx.fillRect(w/2-3, 14, 6, 2); // Mouth

    ctx.restore();
}

function drawTurret(x, y, w, h, type) {
    ctx.save();
    ctx.translate(x, y);
    
    // Base/Treads
    ctx.fillStyle = '#333';
    ctx.fillRect(0, h-10, w, 10);
    ctx.fillStyle = '#555';
    ctx.beginPath(); ctx.arc(5, h-5, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w-5, h-5, 5, 0, Math.PI*2); ctx.fill();
    
    // Body
    ctx.fillStyle = '#777';
    ctx.fillRect(5, h-30, w-10, 20);
    
    // Cannon/Core
    ctx.fillStyle = '#444';
    ctx.fillRect(w/2, h-25, 15, 8); // Barrel
    
    // Power Core Glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = POWER_COLORS[type];
    ctx.fillStyle = POWER_COLORS[type];
    ctx.beginPath(); ctx.arc(w/2, h-20, 6, 0, Math.PI*2); ctx.fill();
    
    ctx.restore();
}

function drawBossSkull(x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    
    // Bone color with shadow
    let grad = ctx.createRadialGradient(-20, -20, 10, 0, 0, r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.8, '#ddddcc');
    grad.addColorStop(1, '#999988');
    
    // Main Cranium
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, -20, r, 0, Math.PI*2);
    ctx.fill();
    
    // Cheekbones / Maxilla
    ctx.fillRect(-r*0.6, r*0.4, r*1.2, r*0.4);

    // Deep Eye Sockets
    ctx.fillStyle = '#000';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#f00'; // Evil red glow
    ctx.beginPath(); ctx.arc(-40, -10, 30, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(40, -10, 30, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; // Reset
    
    // Nasal Cavity
    ctx.beginPath();
    ctx.moveTo(0, 20); ctx.lineTo(-15, 50); ctx.lineTo(15, 50); ctx.fill();
    
    // Jagged Teeth
    ctx.fillStyle = '#e8e8d8';
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    for(let i=0; i<6; i++) {
        let tx = -50 + (i*20);
        ctx.beginPath();
        ctx.moveTo(tx, r*0.8);
        ctx.lineTo(tx+10, r*1.1);
        ctx.lineTo(tx+20, r*0.8);
        ctx.fill();
        ctx.stroke();
    }
    
    ctx.restore();
}


function render() {
    ctx.fillStyle = '#1e1e2f'; // Background sky
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'start') {
        document.getElementById('hud').style.display = 'none';
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.font = 'bold 60px "Segoe UI"';
        ctx.fillText("BLOCKY BUILDER", canvas.width/2, canvas.height/2 - 50);
        ctx.font = '30px "Segoe UI"';
        ctx.fillStyle = '#ffcc00';
        ctx.fillText("Press START or ENTER to Begin", canvas.width/2, canvas.height/2 + 20);
        return;
    }

    ctx.save();
    // Apply Camera Zoom and Translation
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    // Grid / Background Texture
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for(let i=0; i<worldWidth; i+=100) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, worldHeight); ctx.stroke(); }
    for(let j=0; j<worldHeight; j+=100) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(worldWidth, j); ctx.stroke(); }

    // Platforms
    platforms.forEach(p => {
        if(p.hp <= 0) return;
        if(p.x > camera.x + (canvas.width/camera.zoom) || p.x + p.w < camera.x) return; // Culling
        
        if (p.type === 'ground' || p.type === 'platform') {
            // Textured blocky ground
            ctx.fillStyle = '#4CAF50'; 
            ctx.fillRect(p.x, p.y, p.w, 10);
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(p.x, p.y+10, p.w, p.h-10);
            // Brick pattern
            ctx.strokeStyle = '#4e342e';
            for(let i=0; i<p.w; i+=40) {
                ctx.strokeRect(p.x+i, p.y+10, 40, 20);
                ctx.strokeRect(p.x+i-20, p.y+30, 40, 20);
            }
        } else if (p.type === 'gate') {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.fillText("HP", p.x+5, p.y+30);
            // Crack texture based on HP
            if(p.hp < 100) {
                ctx.strokeStyle = 'black'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(p.x+10, p.y+50); ctx.lineTo(p.x+30, p.y+80); ctx.lineTo(p.x+15, p.y+120); ctx.stroke();
            }
        }
    });

    // Supplies (Gears)
    ctx.fillStyle = '#99aa99';
    supplies.forEach(s => {
        if (s.active && s.x > camera.x - 50 && s.x < camera.x + (canvas.width/camera.zoom)) {
            ctx.beginPath();
            ctx.arc(s.x+s.w/2, s.y+s.h/2, s.w/2, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeRect(s.x+4, s.y+4, s.w-8, s.h-8);
        }
    });

    // NPCs
    npcs.forEach(n => {
        if (n.x > camera.x - 100 && n.x < camera.x + (canvas.width/camera.zoom)) {
            // Draw NPC (similar to player but different color)
            ctx.fillStyle = n.color;
            ctx.fillRect(n.x, n.y+20, 30, 40);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(n.x+5, n.y, 20, 20);
            if (!n.talked) {
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText("!", n.x+10, n.y-20);
            }
        }
    });

    // Robots
    robots.forEach(r => drawTurret(r.x, r.y, r.w, r.h, r.type));

    // Skeletons
    skeletons.forEach(skel => {
        drawSkeleton(skel.x, skel.y, skel.w, skel.h);
        if(skel.frozen > 0) {
            ctx.fillStyle = 'rgba(100, 200, 255, 0.6)';
            ctx.fillRect(skel.x-5, skel.y-5, skel.w+10, skel.h+10);
        }
    });

    // Projectiles
    projectiles.forEach(p => {
        ctx.fillStyle = p.isEnemy ? '#ff0000' : POWER_COLORS[p.type];
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath();
        if(p.type === 4) { // Earth boulder
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#553311'; ctx.stroke();
        } else {
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    });

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        if(p.arc) {
            ctx.strokeStyle = p.color; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+p.vx*10, p.y+p.vy*10); ctx.stroke();
        } else {
            ctx.fillRect(p.x, p.y, 4, 4);
        }
    });

    // Boss
    if (boss.active) {
        drawBossSkull(boss.x, boss.y, boss.radius);
        // Boss Health Bar
        ctx.fillStyle = '#330000'; ctx.fillRect(boss.x - 150, boss.y - 180, 300, 20);
        ctx.fillStyle = '#ff0000'; ctx.fillRect(boss.x - 150, boss.y - 180, 300 * (boss.hp / boss.maxHp), 20);
        ctx.strokeStyle = 'white'; ctx.strokeRect(boss.x - 150, boss.y - 180, 300, 20);
    }

    // Player
    drawPlasticRobot(player.x, player.y, player.w, player.h);
    
    // Muzzle flash for active power
    if(unlockedPowers.length > 0) {
        ctx.fillStyle = POWER_COLORS[unlockedPowers[currentPowerIndex]];
        ctx.beginPath(); ctx.arc(player.x+player.w/2, player.y-10, 5, 0, Math.PI*2); ctx.fill();
    }

    ctx.restore(); // END CAMERA SPACE

    // --- UI OVERLAYS ---
    if (gameState === 'playing') {
        document.getElementById('hp').innerText = Math.floor(player.hp);
        document.getElementById('scrap').innerText = player.scrap;
        let cPower = unlockedPowers[currentPowerIndex];
        let pText = document.getElementById('power');
        pText.innerText = POWER_NAMES[cPower];
        pText.style.color = POWER_COLORS[cPower];

        // Dialog Box Overlay
        if (dialog.active) {
            let npc = npcs[dialog.npcIndex];
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.strokeStyle = npc.color;
            ctx.lineWidth = 4;
            ctx.fillRect(100, canvas.height - 180, canvas.width - 200, 140);
            ctx.strokeRect(100, canvas.height - 180, canvas.width - 200, 140);
            
            ctx.fillStyle = npc.color;
            ctx.font = 'bold 28px "Segoe UI"';
            ctx.textAlign = 'left';
            ctx.fillText(npc.name, 120, canvas.height - 140);
            
            ctx.fillStyle = 'white';
            ctx.font = '24px "Segoe UI"';
            ctx.fillText(npc.messages[dialog.textIndex], 120, canvas.height - 90);
            
            ctx.fillStyle = '#aaa';
            ctx.font = '16px "Segoe UI"';
            ctx.fillText("Press Y or E to continue...", canvas.width - 320, canvas.height - 55);
        }
    }

    if (gameState === 'won' || gameState === 'lost') {
        document.getElementById('hud').style.display = 'none';
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0,0,canvas.width, canvas.height);
        
        ctx.textAlign = 'center';
        ctx.font = 'bold 70px "Segoe UI"';
        ctx.fillStyle = gameState === 'won' ? '#ffcc00' : '#ff3333';
        ctx.fillText(gameState === 'won' ? "VICTORY!" : "GAME OVER", canvas.width/2, canvas.height/2 - 20);
        
        ctx.font = '30px "Segoe UI"';
        ctx.fillStyle = '#fff';
        ctx.fillText("Press START or ENTER to Restart", canvas.width/2, canvas.height/2 + 50);
    }
}

function gameLoop() {
    frames++;
    
    // Save previous inputs for edge detection
    Object.assign(prevKeys, keys);

    let startPressed = isPressed('Enter');
    const startGp = getGamepad();
    if (startGp && wasJustPressed(startGp, 9, 'start')) startPressed = true;

    if (gameState === 'start' || gameState === 'won' || gameState === 'lost') {
        if (startPressed) {
            initGame();
        }
    } else if (gameState === 'playing') {
        updateInput();
        updatePhysics();
        spawnSkeletons();
        updateEntities();
    }
    
    render();
    requestAnimationFrame(gameLoop);
}

// Kickoff
initGame();
gameState = 'start'; // Override initial to show start screen
gameLoop();

</script>
</body>
