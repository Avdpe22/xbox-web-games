<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xbox Space Shooter</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050510; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game Objects
        const player = { x: canvas.width / 2, y: canvas.height - 100, width: 40, height: 40, speed: 10, color: '#00BFFF' };
        const bullets = [];
        const enemies = [];
        let score = 0;
        let lastShotTime = 0;

        function getGamepad() {
            const gamepads = navigator.getGamepads();
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i] && gamepads[i].mapping === 'standard') {
                    return gamepads[i];
                }
            }
            return null;
        }

        function spawnEnemy() {
            // 5% chance to spawn an enemy every frame
            if (Math.random() < 0.05) {
                enemies.push({ 
                    x: Math.random() * (canvas.width - 40), 
                    y: -40, 
                    width: 40, 
                    height: 40, 
                    speed: 3 + Math.random() * 4, 
                    color: '#FF3333' 
                });
            }
        }

        function gameLoop(timestamp) {
            const pad = getGamepad();
            
            if (pad) {
                const lx = pad.axes[0];
                const ly = pad.axes[1];
                const deadzone = 0.2;

                // Movement
                if (Math.abs(lx) > deadzone) player.x += lx * player.speed;
                if (Math.abs(ly) > deadzone) player.y += ly * player.speed;

                // Firing: Button 0 is 'A', Button 7 is 'Right Trigger'
                // We check the timestamp to create a fire-rate limit (200ms between shots)
                if ((pad.buttons[0].pressed || pad.buttons[7].pressed) && timestamp - lastShotTime > 200) {
                    bullets.push({ 
                        x: player.x + (player.width / 2) - 5, 
                        y: player.y, 
                        width: 10, 
                        height: 20, 
                        speed: 15, 
                        color: '#FFFF00' 
                    });
                    lastShotTime = timestamp;
                }
            }

            // Keep player on screen
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // Draw Background
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Starfield effect (simple dots)
            ctx.fillStyle = 'white';
            for(let i=0; i<10; i++) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);

            // Update & Draw Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= b.speed;
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                
                // Remove bullets off screen
                if (b.y < 0) bullets.splice(i, 1);
            }

            // Update & Draw Enemies & Check Collisions
            spawnEnemy();
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);

                // Check collision with bullets
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (b.x < e.x + e.width && b.x + b.width > e.x && 
                        b.y < e.y + e.height && b.y + b.height > e.y) {
                        // Hit!
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        break;
                    }
                }
                
                // Remove enemies off screen
                if (e && e.y > canvas.height) enemies.splice(i, 1);
            }

            // Draw Player Ship
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Draw UI
            ctx.fillStyle = 'white';
            ctx.font = '28px Arial';
            ctx.fillText(`Score: ${score}`, 20, 40);
            
            if (!pad) {
                ctx.fillText("Press 'A' on your Xbox Controller to connect...", 20, 80);
            }

            // Loop
            requestAnimationFrame(gameLoop);
        }

        // Start
        requestAnimationFrame(gameLoop);

        // Handle resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
