<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron & Flesh: Annihilation</title>
    <style>
        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background: #050505; color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 10; opacity: 0.4;
        }
        
        /* Terminal UI for Gemini API */
        #terminal-container {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 900px;
            background: rgba(10, 20, 10, 0.85);
            border: 2px solid #0f0;
            border-radius: 8px;
            padding: 20px;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #0f0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.2);
            z-index: 20;
            display: none;
            pointer-events: none;
        }
        #terminal-container::before {
            content: "SECURE COMM LINK // INTEL";
            position: absolute;
            top: -12px;
            left: 20px;
            background: #050505;
            padding: 0 10px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .blinking-cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #0f0;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="crt-overlay"></div>
    <div id="terminal-container">
        <span id="terminal-text"></span><span class="blinking-cursor"></span>
    </div>

    <script>
        const apiKey = ""; // Gemini API Key injected by environment
        const canvas = document.getElementById('gameCanvas');
        const terminalEl = document.getElementById('terminal-container');
        const terminalTextEl = document.getElementById('terminal-text');
        canvas.tabIndex = 0;
        
        // CRITICAL XBOX EDGE FIX: Force focus to canvas to enable Gamepad API
        function ensureGameFocus() { window.focus(); canvas.focus({ preventScroll: true }); }
        ensureGameFocus();
        window.addEventListener('load', ensureGameFocus);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureGameFocus(); });
        window.addEventListener('gamepadconnected', ensureGameFocus);
        
        const ctx = canvas.getContext('2d');
        let width, height;
        let scale = 1;
        let opticsMode = 0; // 0 = Off, 1 = Army Tank (P1), 2 = Robot Tank (P2)
        
        // --- AUDIO ENGINE ---
        let audioCtx;
        function initAudio() {
            if (audioCtx) return;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return; // Prevent crash on unsupported/blocked browsers
            audioCtx = new AudioCtx();
            startSynthwaveTrack();
        }

        function playSound(type) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'tank') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'heli') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'shoot') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'toggle') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }
        
        function startSynthwaveTrack() {
            const bassNotes = [65.41, 65.41, 130.81, 98.00, 65.41, 155.56, 130.81, 98.00];
            let step = 0;

            setInterval(() => {
                if (gameState === 'MENU' || gameState === 'GAMEOVER') return;
                if (!audioCtx || audioCtx.state !== 'running') return; 

                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                let filter = audioCtx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.value = bassNotes[step % bassNotes.length];

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, now);
                filter.frequency.exponentialRampToValueAtTime(80, now + 0.15);

                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
                step++;
            }, 180);
        }

        function resize() {
            width = window.innerWidth || 1920;
            height = window.innerHeight || 1080;
            let dpr = window.devicePixelRatio || 1; 
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            scale = Math.min(width / 1920, height / 1080); 
        }
        window.addEventListener('resize', resize);
        resize();

        // --- GEMINI API INTEGRATION ---
        let terminalState = { visible: false, text: "", isLoading: false };

        async function fetchGeminiWithBackoff(prompt, retries = 5) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "You are a military AI generating immersive, gritty in-universe communications for a war between Humans and Chrome Robots." }] }
            };
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let i = 0; i <= retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Transmission garbled. Cannot decrypt.";
                } catch (e) {
                    if (i === retries) return "Error: Command uplink severed. Could not establish connection.";
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        async function triggerGeminiIntel(type) {
            if (terminalState.isLoading) return;
            
            terminalState.visible = true;
            terminalState.isLoading = true;
            terminalState.text = "ESTABLISHING SECURE CONNECTION... DECRYPTING SIGNAL...";
            updateTerminalDOM();

            let prompt = "";
            if (type === 'PROPAGANDA') {
                const faction = Math.random() > 0.5 ? "Human Army" : "Chrome Robot Faction";
                prompt = `Write a short, gritty, 2-sentence military propaganda speech for the ${faction} in a futuristic war. Make it sound like an intercepted radio broadcast.`;
            } else if (type === 'AAR') {
                const victor = winner === 1 ? "Human Army" : "Chrome Robot Faction";
                const loser = winner === 1 ? "Chrome Robot Faction" : "Human Army";
                const hp = winner === 1 ? Math.floor(p1Base.hp) : Math.floor(p2Base.hp);
                prompt = `Write a gritty, 3-sentence military After-Action Report (AAR). The ${victor} just annihilated the ${loser}'s base. The victor's base had ${hp} health remaining out of 1000. Use heavy military jargon.`;
            }

            const responseText = await fetchGeminiWithBackoff(prompt);
            terminalState.text = responseText;
            terminalState.isLoading = false;
            updateTerminalDOM();
        }

        function updateTerminalDOM() {
            if (terminalState.visible) {
                terminalEl.style.display = 'block';
                terminalTextEl.innerText = terminalState.text;
            } else {
                terminalEl.style.display = 'none';
            }
        }

        // --- GAMEPAD & INPUT ---
        const Input = {
            p1: { x: 400, y: 540, fire: false, heli: false, intel: false, view: false, fireJustPressed: false, heliJustPressed: false, intelJustPressed: false, viewJustPressed: false },
            p2: { x: 1520, y: 540, fire: false, heli: false, fireJustPressed: false, heliJustPressed: false },
            keys: {
                w: false, a: false, s: false, d: false, space: false, shift: false, c: false, v: false,
                up: false, left: false, down: false, right: false, enter: false, rshift: false
            }
        };

        window.addEventListener('keydown', e => {
            if (!e.key) return; // Crash prevention on missing key prop
            const k = e.key.toLowerCase();
            if (k === 'w') Input.keys.w = true; if (k === 'a') Input.keys.a = true;
            if (k === 's') Input.keys.s = true; if (k === 'd') Input.keys.d = true;
            if (e.code === 'Space' || k === ' ') Input.keys.space = true; if (e.code === 'ShiftLeft' || k === 'shift') Input.keys.shift = true;
            if (k === 'c') Input.keys.c = true; if (k === 'v') Input.keys.v = true;
            if (e.key === 'ArrowUp') Input.keys.up = true; if (e.key === 'ArrowLeft') Input.keys.left = true;
            if (e.key === 'ArrowDown') Input.keys.down = true; if (e.key === 'ArrowRight') Input.keys.right = true;
            if (e.code === 'Enter' || k === 'enter') Input.keys.enter = true; if (e.code === 'ShiftRight') Input.keys.rshift = true;
        });
        window.addEventListener('keyup', e => {
            if (!e.key) return;
            const k = e.key.toLowerCase();
            if (k === 'w') Input.keys.w = false; if (k === 'a') Input.keys.a = false;
            if (k === 's') Input.keys.s = false; if (k === 'd') Input.keys.d = false;
            if (e.code === 'Space' || k === ' ') Input.keys.space = false; if (e.code === 'ShiftLeft' || k === 'shift') Input.keys.shift = false;
            if (k === 'c') Input.keys.c = false; if (k === 'v') Input.keys.v = false;
            if (e.key === 'ArrowUp') Input.keys.up = false; if (e.key === 'ArrowLeft') Input.keys.left = false;
            if (e.key === 'ArrowDown') Input.keys.down = false; if (e.key === 'ArrowRight') Input.keys.right = false;
            if (e.code === 'Enter' || k === 'enter') Input.keys.enter = false; if (e.code === 'ShiftRight') Input.keys.rshift = false;
        });

        function pollInput() {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            // Highly robust wrapper to prevent crashes on non-standard controllers
            const btn = (pad, idx) => pad && pad.buttons && pad.buttons[idx] && pad.buttons[idx].pressed;
            const ax = (pad, idx) => pad && pad.axes && pad.axes[idx] ? pad.axes[idx] : 0;
            
            // P1 Update
            let p1Fire = Input.keys.space;
            let p1Heli = Input.keys.shift;
            let p1Intel = Input.keys.c;
            let p1View = Input.keys.v;
            let p1dx = (Input.keys.d ? 1 : 0) - (Input.keys.a ? 1 : 0);
            let p1dy = (Input.keys.s ? 1 : 0) - (Input.keys.w ? 1 : 0);

            if (pads[0]) {
                if (Math.abs(ax(pads[0], 0)) > 0.15) p1dx = ax(pads[0], 0);
                if (Math.abs(ax(pads[0], 1)) > 0.15) p1dy = ax(pads[0], 1);
                if (btn(pads[0], 0) || btn(pads[0], 7)) p1Fire = true;
                if (btn(pads[0], 2) || btn(pads[0], 6)) p1Heli = true;
                // Button 3 (Y) serves dual purpose: Intel on menus, Optics in game
                if (btn(pads[0], 3)) {
                    p1Intel = true; 
                    p1View = true;
                }
            }
            
            // Allow tighter panning when zoomed in
            let speed = opticsMode > 0 ? 6 : 12;
            Input.p1.x = Math.max(100, Math.min(1920 - 100, Input.p1.x + p1dx * speed));
            Input.p1.y = Math.max(50, Math.min(1080 - 50, Input.p1.y + p1dy * speed));
            
            Input.p1.fireJustPressed = p1Fire && !Input.p1.fire;
            Input.p1.heliJustPressed = p1Heli && !Input.p1.heli;
            Input.p1.intelJustPressed = p1Intel && !Input.p1.intel;
            Input.p1.viewJustPressed = p1View && !Input.p1.view;
            
            Input.p1.fire = p1Fire;
            Input.p1.heli = p1Heli;
            Input.p1.intel = p1Intel;
            Input.p1.view = p1View;

            // P2 Update
            let p2Fire = Input.keys.enter;
            let p2Heli = Input.keys.rshift;
            let p2dx = (Input.keys.right ? 1 : 0) - (Input.keys.left ? 1 : 0);
            let p2dy = (Input.keys.down ? 1 : 0) - (Input.keys.up ? 1 : 0);

            if (pads[1]) {
                if (Math.abs(ax(pads[1], 0)) > 0.15) p2dx = ax(pads[1], 0);
                if (Math.abs(ax(pads[1], 1)) > 0.15) p2dy = ax(pads[1], 1);
                if (btn(pads[1], 0) || btn(pads[1], 7)) p2Fire = true;
                if (btn(pads[1], 2) || btn(pads[1], 6)) p2Heli = true;
            }
            
            if (gameState !== 'PVE') {
                Input.p2.x = Math.max(100, Math.min(1920 - 100, Input.p2.x + p2dx * 12));
                Input.p2.y = Math.max(50, Math.min(1080 - 50, Input.p2.y + p2dy * 12));
            }
            
            Input.p2.fireJustPressed = p2Fire && !Input.p2.fire;
            Input.p2.heliJustPressed = p2Heli && !Input.p2.heli;
            Input.p2.fire = p2Fire;
            Input.p2.heli = p2Heli;
        }

        // --- MATH & FX ---
        let particles = [];
        let screenShake = 0;
        
        function addExplosion(x, y, radius, isSmall=false) {
            screenShake = isSmall ? 5 : 15;
            for(let i=0; i<(isSmall?15:40); i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * (isSmall?10:20),
                    vy: (Math.random() - 0.5) * (isSmall?10:20),
                    life: 1.0, decay: Math.random() * 0.02 + 0.01,
                    color: Math.random() > 0.5 ? '#ff4400' : (Math.random() > 0.5 ? '#ffff00' : '#444'),
                    size: Math.random() * (isSmall?5:12) + 3
                });
            }
            if(!isSmall) craters.push({x, y: 950, size: radius * 0.8, life: 1});
        }

        let craters = [];

        // --- GAME ENTITIES ---
        class Troop {
            constructor(x, y, isRobot, isAirdrop = false) {
                this.x = x; this.y = y;
                this.isRobot = isRobot;
                this.hp = 100;
                this.state = isAirdrop ? 'RAPPELLING' : 'WALKING';
                this.facing = isRobot ? -1 : 1;
                this.walkCycle = Math.random() * Math.PI * 2;
                this.shootCooldown = 0;
            }
            update(dt) {
                if (this.state === 'RAPPELLING') {
                    this.y += 300 * dt;
                    if (this.y >= 950) {
                        this.y = 950;
                        this.state = 'WALKING';
                    }
                    return;
                }
                
                this.walkCycle += 10 * dt;
                
                // Find target
                let target = null;
                let minDist = 300;
                
                for (let t of troops) {
                    if (t.isRobot !== this.isRobot && t.state !== 'RAPPELLING') {
                        let d = Math.abs(t.x - this.x);
                        if (d < minDist && ((this.facing > 0 && t.x > this.x) || (this.facing < 0 && t.x < this.x))) {
                            minDist = d;
                            target = t;
                        }
                    }
                }
                
                if (target) {
                    this.state = 'SHOOTING';
                    this.shootCooldown -= dt;
                    if (this.shootCooldown <= 0) {
                        this.shootCooldown = 0.5 + Math.random() * 0.5;
                        target.hp -= 25;
                        playSound('shoot');
                        // Muzzle flash particle
                        particles.push({
                            x: this.x + 20 * this.facing, y: this.y - 25,
                            vx: this.facing * 5, vy: -2, life: 1, decay: 0.1, color: '#ffffaa', size: 3
                        });
                    }
                } else {
                    this.state = 'WALKING';
                    this.x += 60 * dt * this.facing;
                    
                    // Base damage
                    if (this.isRobot && this.x <= 200) {
                        p1Base.hp -= 20 * dt;
                        this.x = 200;
                        if (Math.random() < 0.1) playSound('hit');
                    } else if (!this.isRobot && this.x >= 1720) {
                        p2Base.hp -= 20 * dt;
                        this.x = 1720;
                        if (Math.random() < 0.1) playSound('hit');
                    }
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.facing, 1);
                
                let wOffset = this.state === 'WALKING' ? Math.sin(this.walkCycle) : 0;
                
                if (this.isRobot) {
                    // Robot Man (Chrome/Red)
                    ctx.fillStyle = '#667';
                    ctx.strokeStyle = '#223';
                    ctx.lineWidth = 2;
                    
                    ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(-10 * wOffset, 0); ctx.stroke(); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(10 * wOffset, 0); ctx.stroke(); ctx.fill();
                    
                    ctx.fillStyle = '#889'; ctx.fillRect(-6, -30, 12, 16);
                    ctx.fillStyle = '#445'; ctx.beginPath(); ctx.arc(0, -35, 6, 0, Math.PI*2); ctx.fill();
                    
                    ctx.fillStyle = '#f00'; ctx.shadowBlur = 10; ctx.shadowColor = '#f00';
                    ctx.fillRect(0, -37, 5, 2); ctx.shadowBlur = 0;

                    ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(-2, -26); ctx.lineTo(12, -22); ctx.stroke();
                    ctx.fillStyle = '#111'; ctx.fillRect(10, -25, 18, 4);
                } else {
                    // Army Man (Olive/Tan)
                    ctx.fillStyle = '#4A5D23';
                    
                    ctx.strokeStyle = '#3A4D13'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(-12 * wOffset, 0); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(12 * wOffset, 0); ctx.stroke();
                    
                    ctx.fillRect(-7, -30, 14, 16);
                    ctx.fillStyle = '#E5C298'; ctx.beginPath(); ctx.arc(0, -35, 5, 0, Math.PI*2); ctx.fill();
                    
                    ctx.fillStyle = '#2A3D03'; ctx.beginPath(); ctx.arc(0, -36, 6, Math.PI, 0); ctx.fill();
                    ctx.fillRect(-7, -36, 14, 3);
                    
                    ctx.strokeStyle = '#4A5D23'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(-2, -26); ctx.lineTo(10, -22); ctx.stroke();
                    ctx.fillStyle = '#222'; ctx.fillRect(5, -24, 20, 3); ctx.fillRect(12, -21, 3, 4); 
                }
                
                if (this.hp < 100) {
                    ctx.fillStyle = 'red'; ctx.fillRect(-10, -50, 20, 3);
                    ctx.fillStyle = '#0f0'; ctx.fillRect(-10, -50, 20 * (this.hp/100), 3);
                }
                
                ctx.restore();
            }
        }

        class Helicopter {
            constructor(side, targetX) {
                this.side = side;
                this.isRobot = side === 2;
                this.x = side === 1 ? -200 : 2120;
                this.y = 200 + Math.random() * 100;
                this.targetX = targetX;
                this.state = 'INBOUND';
                this.hoverTimer = 2.0;
                this.rotorAngle = 0;
            }
            update(dt) {
                this.rotorAngle += 20 * dt;
                
                if (this.state === 'INBOUND') {
                    let dir = this.targetX > this.x ? 1 : -1;
                    this.x += dir * 400 * dt;
                    if (Math.abs(this.x - this.targetX) < 10) {
                        this.x = this.targetX;
                        this.state = 'HOVERING';
                    }
                } else if (this.state === 'HOVERING') {
                    this.hoverTimer -= dt;
                    if (this.hoverTimer < 1.0 && this.hoverTimer + dt >= 1.0) {
                        troops.push(new Troop(this.x, this.y + 40, this.isRobot, true));
                    }
                    if (this.hoverTimer <= 0) this.state = 'OUTBOUND';
                } else if (this.state === 'OUTBOUND') {
                    let dir = this.side === 1 ? -1 : 1;
                    this.x += dir * 400 * dt;
                }
                
                if (this.state === 'HOVERING') {
                    particles.push({
                        x: this.x + (Math.random()-0.5)*100, y: 940,
                        vx: (Math.random()-0.5)*30, vy: -5 - Math.random()*10,
                        life: 1, decay: 0.05, color: '#554433', size: Math.random()*20+10
                    });
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                let pitch = 0;
                if (this.state === 'INBOUND') pitch = this.side === 1 ? 0.2 : -0.2;
                if (this.state === 'OUTBOUND') pitch = this.side === 1 ? -0.2 : 0.2;
                ctx.rotate(pitch);
                
                let facing = this.side === 1 ? 1 : -1;
                ctx.scale(facing, 1);
                
                if (this.isRobot) {
                    ctx.fillStyle = '#2b2b2b';
                    ctx.beginPath(); ctx.moveTo(40, 0); ctx.lineTo(-40, -10); ctx.lineTo(-60, 0); ctx.lineTo(-40, 20); ctx.lineTo(30, 20); ctx.fill();
                    ctx.fillStyle = '#f00'; ctx.shadowBlur = 15; ctx.shadowColor = '#f00';
                    ctx.fillRect(-50, 0, 10, 5); ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(200, 200, 255, 0.5)';
                    ctx.beginPath(); ctx.ellipse(20, -15, 40 * Math.abs(Math.sin(this.rotorAngle)), 2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(-30, -15, 40 * Math.abs(Math.sin(this.rotorAngle)), 2, 0, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = '#3A4D13';
                    ctx.beginPath(); ctx.ellipse(0, 0, 45, 20, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-90, -10); ctx.lineTo(-90, 5); ctx.lineTo(-30, 10); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(-85, -10); ctx.lineTo(-95, -30); ctx.lineTo(-80, -30); ctx.fill();
                    ctx.fillStyle = '#447799';
                    ctx.beginPath(); ctx.moveTo(20, -10); ctx.lineTo(40, 0); ctx.lineTo(40, 10); ctx.lineTo(10, 10); ctx.fill();
                    ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(-20, 15); ctx.lineTo(-20, 30); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(20, 15); ctx.lineTo(20, 30); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-40, 30); ctx.lineTo(40, 30); ctx.stroke();
                    ctx.fillStyle = 'rgba(50, 50, 50, 0.6)';
                    ctx.beginPath(); ctx.ellipse(0, -22, 70 * Math.abs(Math.sin(this.rotorAngle)), 3, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillRect(-2, -22, 4, 10); 
                    ctx.beginPath(); ctx.ellipse(-90, -20, 15 * Math.abs(Math.sin(this.rotorAngle)), 2, Math.PI/2, 0, Math.PI*2); ctx.fill();
                }
                
                if (this.state === 'HOVERING' && this.hoverTimer > 0) {
                    ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
                    let ropeLen = (2.0 - this.hoverTimer) * 400;
                    if (ropeLen > 750) ropeLen = 750;
                    ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(0, 20 + ropeLen); ctx.stroke();
                }
                ctx.restore();
            }
        }

        class Missile {
            constructor(startX, startY, targetX, targetY, isRobot) {
                this.x = startX; this.y = startY;
                this.targetX = targetX; this.targetY = targetY;
                this.isRobot = isRobot;
                
                let dx = targetX - startX;
                let dy = targetY - startY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                this.vx = (dx / dist) * 800;
                this.vy = (dy / dist) * 800;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                particles.push({
                    x: this.x, y: this.y,
                    vx: -this.vx*0.1 + (Math.random()-0.5)*10, vy: -this.vy*0.1 + (Math.random()-0.5)*10,
                    life: 1, decay: 0.05, color: this.isRobot ? '#ff0000' : '#ffaa00', size: 6
                });
                
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                if (dx*this.vx <= 0 && dy*this.vy <= 0) { 
                    addExplosion(this.targetX, this.targetY, 120);
                    playSound('explosion');
                    for (let t of troops) {
                        let dist = Math.sqrt((t.x - this.targetX)**2 + (t.y - this.targetY)**2);
                        if (dist < 120) t.hp -= 200; 
                    }
                    if (Math.abs(this.targetX - 100) < 150 && this.targetY > 800) p1Base.hp -= 100;
                    if (Math.abs(this.targetX - 1820) < 150 && this.targetY > 800) p2Base.hp -= 100;
                    return true; 
                }
                return false;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.vy, this.vx));
                ctx.fillStyle = '#fff'; ctx.fillRect(-15, -3, 30, 6);
                ctx.fillStyle = this.isRobot ? '#f00' : '#fa0';
                ctx.fillRect(10, -3, 5, 6); 
                ctx.restore();
            }
        }

        let troops = [];
        let helicopters = [];
        let missiles = [];
        
        const p1Base = { hp: 1000, maxHp: 1000, tankCooldown: 0, heliCooldown: 0, spawnTimer: 0 };
        const p2Base = { hp: 1000, maxHp: 1000, tankCooldown: 0, heliCooldown: 0, spawnTimer: 0 };
        
        let gameState = 'MENU'; // MENU, PVE, PVP, GAMEOVER
        let winner = 0;
        let lastTime = 0;

        function resetGame() {
            troops = []; helicopters = []; missiles = []; particles = []; craters = [];
            p1Base.hp = 1000; p1Base.tankCooldown = 0; p1Base.heliCooldown = 0; p1Base.spawnTimer = 0;
            p2Base.hp = 1000; p2Base.tankCooldown = 0; p2Base.heliCooldown = 0; p2Base.spawnTimer = 0;
            Input.p1.x = 400; Input.p1.y = 540;
            Input.p2.x = 1520; Input.p2.y = 540;
            opticsMode = 0;
            terminalState.visible = false;
            updateTerminalDOM();
        }

        // --- DRAWING FUNCTIONS ---
        function drawBackground() {
            // Expanded bounds from -5000 to 5000 so background isn't clipped during 90-degree optics rotation
            let grad = ctx.createLinearGradient(0, 0, 0, 1080);
            grad.addColorStop(0, '#0a0b10');
            grad.addColorStop(0.7, '#2a1b15');
            grad.addColorStop(1, '#000');
            ctx.fillStyle = grad;
            ctx.fillRect(-5000, -5000, 10000, 10000);
            
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.moveTo(-5000, 950);
            for(let i=-5000; i<=5000; i+=100) ctx.lineTo(i, 700 - Math.sin(i*0.01)*50 - Math.cos(i*0.023)*30);
            ctx.lineTo(5000, 950); ctx.fill();

            ctx.fillStyle = '#1c1815';
            ctx.fillRect(-5000, 950, 10000, 1000);
            ctx.fillStyle = '#2c251f';
            ctx.fillRect(-5000, 955, 10000, 1000);
            
            for (let c of craters) {
                ctx.fillStyle = `rgba(10, 8, 5, ${c.life})`;
                ctx.beginPath(); ctx.ellipse(c.x, c.y, c.size, c.size*0.3, 0, 0, Math.PI*2); ctx.fill();
                c.life -= 0.0005;
            }
            craters = craters.filter(c => c.life > 0);
        }

        function drawTank(x, y, facing, isRobot, aimX, aimY) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(facing, 1);
            
            let actualAimX = facing === 1 ? aimX : (x - (aimX - x));
            let dx = actualAimX - x;
            let dy = aimY - y;
            let angle = Math.atan2(dy, dx);
            if (angle > 0) angle = 0; 
            
            if (isRobot) {
                ctx.save(); ctx.translate(0, -30); ctx.rotate(angle);
                ctx.fillStyle = '#445'; ctx.fillRect(0, -10, 100, 20); 
                ctx.fillStyle = '#556'; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#f00'; ctx.shadowBlur = 10; ctx.shadowColor = '#f00'; ctx.beginPath(); ctx.arc(10, -5, 5, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                ctx.restore();
                
                ctx.fillStyle = '#223';
                ctx.beginPath(); ctx.moveTo(-60, -20); ctx.lineTo(60, -10); ctx.lineTo(40, 10); ctx.lineTo(-40, 10); ctx.fill();
                ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                ctx.beginPath(); ctx.ellipse(0, 15, 50, 5, 0, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.save(); ctx.translate(10, -35); ctx.rotate(angle);
                ctx.fillStyle = '#2A3D03'; ctx.fillRect(0, -6, 110, 12);
                ctx.fillStyle = '#3A4D13'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI, true); ctx.fill(); ctx.fillRect(-30, 0, 60, 10);
                ctx.restore();
                
                ctx.fillStyle = '#4A5D23';
                ctx.beginPath(); ctx.moveTo(-70, -25); ctx.lineTo(60, -25); ctx.lineTo(80, -5); ctx.lineTo(-80, -5); ctx.fill();
                
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.roundRect(-80, -5, 160, 25, 10); ctx.fill();
                ctx.fillStyle = '#333';
                for(let i=-60; i<=60; i+=25) { ctx.beginPath(); ctx.arc(i, 7, 8, 0, Math.PI*2); ctx.fill(); }
            }
            ctx.restore();
        }

        function drawBase(x, y, isRobot, hp, maxHp) {
            ctx.save();
            ctx.translate(x, y);
            
            if (isRobot) {
                ctx.fillStyle = '#111'; ctx.fillRect(-80, -150, 160, 150);
                ctx.fillStyle = '#333'; ctx.fillRect(-60, -200, 120, 50);
                ctx.fillStyle = '#f00'; ctx.shadowBlur = 20; ctx.shadowColor = '#f00';
                ctx.beginPath(); ctx.arc(0, -100, 30, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = '#3A4D13'; ctx.fillRect(-80, -120, 160, 120);
                ctx.fillStyle = '#2A3D03';
                ctx.beginPath(); ctx.moveTo(-100, -120); ctx.lineTo(100, -120); ctx.lineTo(70, -180); ctx.lineTo(-70, -180); ctx.fill();
                ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(0, -180); ctx.lineTo(0, -250); ctx.stroke();
                ctx.fillStyle = '#44f'; ctx.fillRect(0, -250, 40, 25);
            }
            
            ctx.fillStyle = '#f00'; ctx.fillRect(-80, -280, 160, 10);
            ctx.fillStyle = '#0f0'; ctx.fillRect(-80, -280, 160 * (Math.max(0, hp) / maxHp), 10);
            
            ctx.restore();
        }

        function drawCrosshair(x, y, color, reloadPercent) {
            ctx.save();
            ctx.translate(x, y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-25, 0); ctx.lineTo(-5, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(25, 0); ctx.lineTo(5, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(0, -5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 25); ctx.lineTo(0, 5); ctx.stroke();
            
            if (reloadPercent < 1) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.arc(0, 0, 15, -Math.PI/2, -Math.PI/2 + (Math.PI*2 * reloadPercent), true);
                ctx.fill();
            } else {
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        // --- UPDATE LOOP ---
        function update(dt) {
            if (gameState === 'MENU' && Input.p1.intelJustPressed) triggerGeminiIntel('PROPAGANDA');
            else if (gameState === 'GAMEOVER' && Input.p1.intelJustPressed) triggerGeminiIntel('AAR');

            if (gameState === 'GAMEOVER') {
                if (Input.p1.fireJustPressed || Input.p2.fireJustPressed || Input.keys.space || Input.keys.enter) {
                    initAudio();
                    gameState = 'MENU';
                }
                return;
            }

            if (gameState === 'MENU') return;

            // Camera Toggle (Optics View)
            if (gameState === 'PVE' && Input.p1.viewJustPressed) {
                opticsMode = (opticsMode + 1) % 3;
                playSound('toggle');
            }

            // AI LOGIC
            if (gameState === 'PVE') {
                let aiX = Input.p2.x;
                let aiY = Input.p2.y;
                let target = p1Base.hp > 0 ? {x: 100, y: 950} : null;
                
                let playerTroops = troops.filter(t => !t.isRobot && t.state !== 'RAPPELLING');
                if (playerTroops.length > 0) {
                    target = playerTroops.reduce((prev, curr) => (curr.x > prev.x ? curr : prev)); 
                }

                if (target) {
                    let dx = target.x - aiX;
                    let dy = target.y - aiY;
                    Input.p2.x += Math.sign(dx) * 400 * dt;
                    Input.p2.y += Math.sign(dy) * 400 * dt;
                    
                    if (Math.abs(dx) < 50 && Math.abs(dy) < 50) {
                        if (p2Base.tankCooldown <= 0) Input.p2.fireJustPressed = true;
                        if (p2Base.heliCooldown <= 0 && Math.random() < 0.02) Input.p2.heliJustPressed = true;
                    }
                }
            }

            p1Base.tankCooldown -= dt; p1Base.heliCooldown -= dt;
            p2Base.tankCooldown -= dt; p2Base.heliCooldown -= dt;

            p1Base.spawnTimer -= dt;
            if (p1Base.spawnTimer <= 0) {
                troops.push(new Troop(220, 950, false));
                p1Base.spawnTimer = 4.0;
            }
            p2Base.spawnTimer -= dt;
            if (p2Base.spawnTimer <= 0) {
                troops.push(new Troop(1700, 950, true));
                p2Base.spawnTimer = 4.0;
            }

            if (Input.p1.fireJustPressed && p1Base.tankCooldown <= 0) {
                missiles.push(new Missile(150, 915, Input.p1.x, Input.p1.y, false));
                p1Base.tankCooldown = 1.5;
                addExplosion(150, 915, 20, true); 
                playSound('tank');
            }
            if (Input.p1.heliJustPressed && p1Base.heliCooldown <= 0) {
                helicopters.push(new Helicopter(1, Math.min(Input.p1.x, 1500)));
                p1Base.heliCooldown = 8.0;
                playSound('heli');
            }

            if (Input.p2.fireJustPressed && p2Base.tankCooldown <= 0) {
                missiles.push(new Missile(1770, 915, Input.p2.x, Input.p2.y, true));
                p2Base.tankCooldown = 1.5;
                addExplosion(1770, 915, 20, true);
                playSound('tank');
            }
            if (Input.p2.heliJustPressed && p2Base.heliCooldown <= 0) {
                helicopters.push(new Helicopter(2, Math.max(Input.p2.x, 400)));
                p2Base.heliCooldown = 8.0;
                playSound('heli');
            }
            Input.p2.fireJustPressed = false; Input.p2.heliJustPressed = false;

            for (let i = troops.length - 1; i >= 0; i--) {
                troops[i].update(dt);
                if (troops[i].hp <= 0) {
                    addExplosion(troops[i].x, troops[i].y - 20, 30, true);
                    troops.splice(i, 1);
                }
            }
            for (let i = helicopters.length - 1; i >= 0; i--) {
                helicopters[i].update(dt);
                if (helicopters[i].x < -300 || helicopters[i].x > 2220) helicopters.splice(i, 1);
            }
            for (let i = missiles.length - 1; i >= 0; i--) {
                if (missiles[i].update(dt)) missiles.splice(i, 1);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life -= particles[i].decay;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            
            if (screenShake > 0) screenShake -= dt * 30;
            if (screenShake < 0) screenShake = 0;

            if (p1Base.hp <= 0) { gameState = 'GAMEOVER'; winner = 2; opticsMode = 0; terminalState.visible = false; updateTerminalDOM(); }
            else if (p2Base.hp <= 0) { gameState = 'GAMEOVER'; winner = 1; opticsMode = 0; terminalState.visible = false; updateTerminalDOM(); }
        }

        // --- RENDER LOOP ---
        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.save(); // Top Level Save
            
            let dx = (width - 1920 * scale) / 2;
            let dy = (height - 1080 * scale) / 2;
            ctx.translate(dx, dy);
            ctx.scale(scale, scale);
            
            ctx.save(); // Game World Transform Save
            if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            
            ctx.beginPath(); ctx.rect(0, 0, 1920, 1080); ctx.clip();

            if (gameState === 'MENU') {
                drawBackground();
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,1920,1080);
                
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 80px "Segoe UI"';
                ctx.fillText('IRON & FLESH: ANNIHILATION', 1920/2, 220);
                
                // HUD Box
                ctx.fillStyle = 'rgba(10, 20, 10, 0.85)';
                ctx.strokeStyle = '#334433';
                ctx.lineWidth = 4;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(1920/2 - 550, 280, 1100, 420, 10);
                else ctx.rect(1920/2 - 550, 280, 1100, 420); 
                ctx.fill(); ctx.stroke();

                ctx.fillStyle = '#0f0';
                ctx.font = 'bold 32px "Courier New"';
                ctx.fillText('// TACTICAL CONTROL LINK ESTABLISHED', 1920/2, 340);
                
                ctx.font = 'bold 24px "Segoe UI"';
                ctx.fillStyle = '#888'; ctx.fillText('ACTION', 1920/2, 410);
                ctx.fillStyle = '#0f0'; ctx.fillText('PLAYER 1 (ARMY)', 1920/2 - 300, 410);
                ctx.fillStyle = '#f00'; ctx.fillText('PLAYER 2 (ROBOTS)', 1920/2 + 300, 410);

                ctx.font = '26px "Segoe UI"';
                let cy = 460;
                
                ctx.fillStyle = '#fff'; ctx.fillText('Aim Artillery', 1920/2, cy);
                ctx.fillStyle = '#0f0'; ctx.fillText('L-Stick / WASD', 1920/2 - 300, cy);
                ctx.fillStyle = '#f00'; ctx.fillText('L-Stick / Arrows', 1920/2 + 300, cy);
                cy += 50;

                ctx.fillStyle = '#fff'; ctx.fillText('Fire Tank Missile', 1920/2, cy);
                ctx.fillStyle = '#0f0'; ctx.fillText('RT / (A) / Space', 1920/2 - 300, cy);
                ctx.fillStyle = '#f00'; ctx.fillText('RT / (A) / Enter', 1920/2 + 300, cy);
                cy += 50;

                ctx.fillStyle = '#fff'; ctx.fillText('Call Heli Drop', 1920/2, cy);
                ctx.fillStyle = '#0f0'; ctx.fillText('LT / (X) / L-Shift', 1920/2 - 300, cy);
                ctx.fillStyle = '#f00'; ctx.fillText('LT / (X) / R-Shift', 1920/2 + 300, cy);
                cy += 50;

                ctx.fillStyle = '#fff'; ctx.fillText('Toggle Optics (PVE)', 1920/2, cy);
                ctx.fillStyle = '#0f0'; ctx.fillText('(Y) / V Key', 1920/2 - 300, cy);
                ctx.fillStyle = '#f00'; ctx.fillText('N/A', 1920/2 + 300, cy);
                cy += 60;

                ctx.fillStyle = '#0ff'; 
                ctx.fillText('✨ Intercept Intel / Propaganda: Press (Y) Button or "C" Key', 1920/2, cy);

                ctx.font = 'bold 36px "Segoe UI"';
                ctx.fillStyle = '#0f0'; ctx.fillText('Press [P1 Fire] to play 1 Player (Vs AI)', 1920/2, 800);
                ctx.fillStyle = '#f00'; ctx.fillText('Press [P2 Fire] to play 2 Player PvP', 1920/2, 870);

                if (Input.p1.fireJustPressed || Input.keys.space) { initAudio(); resetGame(); gameState = 'PVE'; }
                if (Input.p1.heliJustPressed || Input.keys.enter) { initAudio(); resetGame(); gameState = 'PVP'; }

                ctx.restore(); // POP GAME WORLD TRANSFORM - Balanced perfectly
            } else {
                // Apply True Line-of-Sight Tank Optics Transform
                if (gameState === 'PVE' && opticsMode > 0) {
                    let tx = opticsMode === 1 ? 150 : 1770;
                    let ty = 915; // Tank barrel height
                    let cx = opticsMode === 1 ? Input.p1.x : Input.p2.x;
                    let cy = opticsMode === 1 ? Input.p1.y : Input.p2.y;
                    
                    // Calculate true angle from the active tank to its current crosshair
                    let angle = Math.atan2(cy - ty, cx - tx);
                    
                    ctx.translate(1920/2, 1080/2); // Center of screen
                    
                    // Rotate the canvas so the line-of-sight vector maps directly UP (-90 degrees) on your screen
                    ctx.rotate(-Math.PI/2 - angle);
                    
                    ctx.scale(2.5, 2.5); // Scope Zoom
                    ctx.translate(-cx, -cy); // Lock the crosshair to dead-center
                }

                drawBackground();
                
                drawBase(100, 950, false, p1Base.hp, p1Base.maxHp);
                drawBase(1820, 950, true, p2Base.hp, p2Base.maxHp);
                drawTank(150, 950, 1, false, Input.p1.x, Input.p1.y);
                drawTank(1770, 950, -1, true, Input.p2.x, Input.p2.y);
                
                for (let h of helicopters) h.draw(ctx);
                for (let t of troops) t.draw(ctx);
                for (let m of missiles) m.draw(ctx);
                
                for (let p of particles) {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
                
                ctx.restore(); // POP GAME WORLD TRANSFORM - Balanced perfectly
                
                // Draw Optics HUD Overlay
                if (gameState === 'PVE' && opticsMode > 0) {
                    let grad = ctx.createRadialGradient(1920/2, 1080/2, 200, 1920/2, 1080/2, 1000);
                    grad.addColorStop(0, 'rgba(0,255,0,0)');
                    grad.addColorStop(1, 'rgba(0,10,0,0.95)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0,0,1920,1080);
                    
                    ctx.strokeStyle = 'rgba(0, 255, 0, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(1920/2, 0); ctx.lineTo(1920/2, 1080); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, 1080/2); ctx.lineTo(1920, 1080/2); ctx.stroke();
                    
                    for(let i=1080/2 + 50; i<1080; i+=50) {
                        ctx.beginPath(); ctx.moveTo(1920/2 - 20, i); ctx.lineTo(1920/2 + 20, i); ctx.stroke();
                    }
                    
                    let cx = opticsMode === 1 ? Input.p1.x : Input.p2.x;
                    let targetDist = Math.floor(Math.abs(cx - (opticsMode === 1 ? 150 : 1770)));
                    
                    ctx.fillStyle = '#0f0'; ctx.font = '24px "Courier New"'; ctx.textAlign = 'left';
                    ctx.fillText(opticsMode === 1 ? 'OPTICS: ARMY TANK (P1)' : 'OPTICS: ROBOT TANK (P2/AI)', 50, 100);
                    ctx.fillText('VIEW: TRUE LINE OF SIGHT', 50, 130);
                    ctx.fillText(`RANGE: ${targetDist}m`, 50, 160);

                    // Always draw crosshair at physical screen center in optics mode
                    let cd = opticsMode === 1 ? p1Base.tankCooldown : p2Base.tankCooldown;
                    drawCrosshair(1920/2, 1080/2, opticsMode === 1 ? '#0f0' : '#f00', Math.max(0, 1.5 - cd) / 1.5);
                } else {
                    // Standard Top-Down Crosshairs
                    drawCrosshair(Input.p1.x, Input.p1.y, '#0f0', Math.max(0, 1.5 - p1Base.tankCooldown) / 1.5);
                    if (gameState === 'PVP') drawCrosshair(Input.p2.x, Input.p2.y, '#f00', Math.max(0, 1.5 - p2Base.tankCooldown) / 1.5);
                }
                
                ctx.fillStyle = '#fff'; ctx.font = '24px "Segoe UI"'; ctx.textAlign = 'left';
                let h1 = p1Base.heliCooldown > 0 ? (p1Base.heliCooldown).toFixed(1) + 's' : 'READY (LT)';
                ctx.fillText('Heli: ' + h1, 30, 40);
                
                ctx.textAlign = 'right';
                let h2 = p2Base.heliCooldown > 0 ? (p2Base.heliCooldown).toFixed(1) + 's' : (gameState === 'PVP' ? 'READY (LT)' : 'AI AUTO');
                ctx.fillText('Heli: ' + h2, 1890, 40);

                if (gameState === 'GAMEOVER') {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,1920,1080);
                    ctx.fillStyle = winner === 1 ? '#0f0' : '#f00';
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 100px "Segoe UI"';
                    ctx.fillText(winner === 1 ? 'ARMY WINS' : 'ROBOTS WIN', 1920/2, 400);
                    ctx.fillStyle = '#fff'; ctx.font = '40px "Segoe UI"';
                    ctx.fillText('Press Fire to Return to Menu', 1920/2, 550);
                    
                    ctx.fillStyle = '#0ff';
                    ctx.font = '30px "Segoe UI"';
                    ctx.fillText('Press (Y) or "C" for ✨ After-Action Report', 1920/2, 700);
                }
            }
            
            ctx.restore(); // Top Level Restore
            ctx.fillStyle = '#000';
            if (dx > 0) { ctx.fillRect(0, 0, dx, height); ctx.fillRect(width - dx, 0, dx, height); }
            if (dy > 0) { ctx.fillRect(0, 0, width, dy); ctx.fillRect(0, height - dy, width, dy); }
        }

        function loop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; 
            lastTime = timestamp;
            
            pollInput();
            update(dt);
            draw();
            
            requestAnimationFrame(loop);
        }
        
        requestAnimationFrame(loop);
    </script>
</body>
</html>
