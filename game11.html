<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tadpole Swarm: Versus Mode (Economy Rebalance)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #0a0a0f; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let gameState = 'START'; 
        let winner = '';

        // Game Variables
        let nestMaxHealth = 6000; 
        let nestHealth = nestMaxHealth;
        let playerBaseMaxHealth = 500;
        let playerHealth = playerBaseMaxHealth;
        
        // Separate Energy Pools
        let p1Energy = 100;
        let p2Energy = 100;
        
        // Map Structures
        const tadpoleNest = { x: canvas.width - 150, y: 0, width: 150, height: canvas.height };
        const playerBase = { x: 0, y: 0, width: 60, height: canvas.height };
        
        const enemies = [];
        const units = [];
        const projectiles = [];
        const particles = [];

        // Player Tracking for Versus
        const players = [
            { 
                id: 0, // Defender (Human)
                crosshair: { x: canvas.width / 4, y: canvas.height / 2, radius: 10, speed: 10, color: '#00aaff' }, 
                buttons: { A: false, LB: false, LT: false, RB: false, RT: false } 
            },
            { 
                id: 1, // Attacker (Swarm)
                crosshair: { x: canvas.width - 200, y: canvas.height / 2, radius: 10, speed: 10, color: '#ff0055' }, 
                buttons: { A: false, LB: false, LT: false, RB: false, RT: false } 
            }
        ];

        // --- WEB AUDIO API (SYNTHESIZER) ---
        let audioCtx;
        let lastHitSoundTime = 0;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            startSynthwaveTrack();
        }

        function playDeploySound(isSwarm = false) {
            if (!audioCtx) return;
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = isSwarm ? 'triangle' : 'square';
            osc.frequency.setValueAtTime(isSwarm ? 150 : 300, now);
            osc.frequency.exponentialRampToValueAtTime(isSwarm ? 50 : 600, now + 0.15);
            
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.15);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        function playHitSound() {
            if (!audioCtx) return;
            let now = audioCtx.currentTime;
            if (now - lastHitSoundTime < 0.08) return; 
            lastHitSoundTime = now;

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            
            gain.gain.setValueAtTime(0.03, now); 
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        }

        function startSynthwaveTrack() {
            const bassNotes = [65.41, 65.41, 130.81, 98.00, 65.41, 155.56, 130.81, 98.00];
            let step = 0;

            setInterval(() => {
                if (gameState !== 'PLAYING') return; 

                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                let filter = audioCtx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.value = bassNotes[step % bassNotes.length];
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, now);
                filter.frequency.exponentialRampToValueAtTime(80, now + 0.15);

                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
                step++;
            }, 180); 
        }

        function getActiveGamepads() {
            const gamepads = navigator.getGamepads();
            let activePads = [];
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i] && gamepads[i].mapping === 'standard') {
                    activePads.push(gamepads[i]);
                    if (activePads.length === 2) break; 
                }
            }
            return activePads;
        }

        function resetGame() {
            nestHealth = nestMaxHealth;
            playerHealth = playerBaseMaxHealth;
            p1Energy = 100;
            p2Energy = 100;
            enemies.length = 0;
            units.length = 0;
            projectiles.length = 0;
            particles.length = 0;
            winner = '';
            
            players[0].crosshair.x = canvas.width / 4;
            players[0].crosshair.y = canvas.height / 2;
            players[1].crosshair.x = canvas.width - 200;
            players[1].crosshair.y = canvas.height / 2;

            gameState = 'PLAYING';
        }

        // --- P1: HUMAN UNIT FACTORIES ---
        function spawnSoldier(x, y) {
            units.push({ 
                type: 'soldier', x: x, y: y, hp: 15, maxHp: 15, speed: 0.8, 
                range: 250, prefDist: 200 + Math.random() * 80,
                damage: 6, fireRate: 15, fireCooldown: 0, color: '#4CAF50', size: 5, animTimer: 0 
            });
        }

        function spawnTank(x, y) {
            units.push({ 
                type: 'tank', x: x, y: y, hp: 100, maxHp: 100, speed: 0.4, 
                range: 350, prefDist: 300 + Math.random() * 50,
                damage: 25, fireRate: 45, fireCooldown: 0, color: '#2E7D32', size: 12, animTimer: 0
            });
        }

        function spawnBunker(x, y) {
            units.push({ 
                type: 'bunker', x: x, y: y, hp: 300, maxHp: 300, speed: 0, 
                range: 300, prefDist: 0, damage: 12, fireRate: 6, fireCooldown: 0, color: '#757575', size: 16 
            });
        }

        // --- P2: MUTANT SPAWNER ---
        function spawnSpecificEnemy(type, y) {
            let enemy = { x: tadpoleNest.x - 10, y: y, wobble: Math.random() * Math.PI * 2, attackCooldown: 0, jumpTimer: 0 };
            
            if (type === 'frog') {
                enemy.type = 'frog'; enemy.hp = 350; enemy.radius = 18; enemy.speed = 0; enemy.maxSpeed = 4.5;
            } else if (type === 'froglet') {
                enemy.type = 'froglet'; enemy.hp = 40; enemy.radius = 7; enemy.speed = 2.5; 
            } else if (type === 'shielded') {
                enemy.type = 'shielded'; enemy.hp = 80; enemy.radius = 6; enemy.speed = 1.0;
            } else {
                enemy.type = 'basic'; enemy.hp = 35; enemy.radius = 6; enemy.speed = 0.8 + Math.random();
            }
            enemies.push(enemy);
        }

        function createExplosion(x, y, color, sizeMultiplier = 1) {
            for(let i=0; i<6; i++){
                particles.push({
                    x: x, y: y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                    life: 12, color: color, size: (Math.random() * 3 + 1) * sizeMultiplier
                });
            }
        }

        function drawTextCentered(text, yOffset, size, color) {
            ctx.fillStyle = color; ctx.font = `bold ${size}px Arial`;
            ctx.textAlign = 'center'; ctx.fillText(text, canvas.width / 2, canvas.height / 2 + yOffset);
            ctx.textAlign = 'left';
        }

        function gameLoop() {
            const pads = getActiveGamepads();
            
            players.forEach((player, index) => {
                const pad = pads[index];
                if (!pad) return; 

                // Start / Restart [A]
                if (pad.buttons[0].pressed && !player.buttons.A) {
                    initAudio(); 
                    if (gameState === 'START' || gameState === 'GAME_OVER') resetGame();
                    player.buttons.A = true;
                } else if (!pad.buttons[0].pressed) {
                    player.buttons.A = false;
                }

                if (gameState === 'PLAYING') {
                    const lx = pad.axes[0]; 
                    const ly = pad.axes[1]; 
                    const deadzone = 0.2;

                    if (Math.abs(lx) > deadzone) player.crosshair.x += lx * player.crosshair.speed;
                    if (Math.abs(ly) > deadzone) player.crosshair.y += ly * player.crosshair.speed;

                    player.crosshair.y = Math.max(10, Math.min(canvas.height - 10, player.crosshair.y));

                    // --- PLAYER 1 (COMMAND) LOGIC ---
                    if (index === 0) {
                        player.crosshair.x = Math.max(playerBase.width + 10, Math.min(canvas.width / 2 - 50, player.crosshair.x));

                        // [LB] Deploy Paratroopers (Cost 25)
                        if (pad.buttons[4].pressed && !player.buttons.LB) {
                            if (p1Energy >= 25) {
                                p1Energy -= 25;
                                spawnSoldier(player.crosshair.x, player.crosshair.y - 15);
                                spawnSoldier(player.crosshair.x - 12, player.crosshair.y + 12);
                                spawnSoldier(player.crosshair.x + 12, player.crosshair.y + 12);
                                playDeploySound();
                            }
                            player.buttons.LB = true;
                        } else if (!pad.buttons[4].pressed) player.buttons.LB = false;

                        // [LT] Tank Platoon (Cost 60)
                        if (pad.buttons[6].pressed && !player.buttons.LT) {
                            if (p1Energy >= 60) {
                                p1Energy -= 60;
                                spawnTank(player.crosshair.x, player.crosshair.y);
                                for(let i=0; i<4; i++) spawnSoldier(player.crosshair.x - 25 - (Math.random()*15), player.crosshair.y - 25 + (i*18));
                                playDeploySound();
                            }
                            player.buttons.LT = true;
                        } else if (!pad.buttons[6].pressed) player.buttons.LT = false;

                        // [RB] Heavy Bunker (Cost 90)
                        if (pad.buttons[5].pressed && !player.buttons.RB) {
                            if (p1Energy >= 90) {
                                p1Energy -= 90;
                                spawnBunker(player.crosshair.x, player.crosshair.y);
                                playDeploySound();
                            }
                            player.buttons.RB = true;
                        } else if (!pad.buttons[5].pressed) player.buttons.RB = false;
                    }
                    
                    // --- PLAYER 2 (SWARM) LOGIC ---
                    else if (index === 1) {
                        player.crosshair.x = Math.max(tadpoleNest.x - 100, Math.min(canvas.width - 10, player.crosshair.x));

                        // [LB] Basic Tadpole x3 (Cost 10)
                        if (pad.buttons[4].pressed && !player.buttons.LB) {
                            if (p2Energy >= 10) { 
                                p2Energy -= 10; 
                                for(let i=0; i<3; i++) spawnSpecificEnemy('basic', player.crosshair.y + (Math.random()*60-30));
                                playDeploySound(true); 
                            }
                            player.buttons.LB = true;
                        } else if (!pad.buttons[4].pressed) player.buttons.LB = false;

                        // [LT] Shielded Mutant x1 (Cost 20)
                        if (pad.buttons[6].pressed && !player.buttons.LT) {
                            if (p2Energy >= 20) { 
                                p2Energy -= 20; 
                                spawnSpecificEnemy('shielded', player.crosshair.y);
                                playDeploySound(true); 
                            }
                            player.buttons.LT = true;
                        } else if (!pad.buttons[6].pressed) player.buttons.LT = false;

                        // [RB] Speed Froglet x3 (Cost 30)
                        if (pad.buttons[5].pressed && !player.buttons.RB) {
                            if (p2Energy >= 30) { 
                                p2Energy -= 30; 
                                for(let i=0; i<3; i++) spawnSpecificEnemy('froglet', player.crosshair.y + (Math.random()*60-30));
                                playDeploySound(true); 
                            }
                            player.buttons.RB = true;
                        } else if (!pad.buttons[5].pressed) player.buttons.RB = false;

                        // [RT] Giant Boss Frog x1 (Cost 70)
                        if (pad.buttons[7].pressed && !player.buttons.RT) {
                            if (p2Energy >= 70) { 
                                p2Energy -= 70; 
                                spawnSpecificEnemy('frog', player.crosshair.y + (Math.random()*40-20));
                                playDeploySound(true); 
                            }
                            player.buttons.RT = true;
                        } else if (!pad.buttons[7].pressed) player.buttons.RT = false;
                    }
                }
            });

            // --- UPDATE LOGIC ---
            if (gameState === 'PLAYING') {
                // COMMAND now earns 40% more energy per second to offset the Swarm's numbers
                p1Energy = Math.min(100, p1Energy + 0.28); 
                p2Energy = Math.min(100, p2Energy + 0.20); 

                // 1. Update Units (P1)
                for (let i = units.length - 1; i >= 0; i--) {
                    let u = units[i];
                    if (u.fireCooldown > 0) u.fireCooldown--;

                    let target = null;
                    let closestDist = u.range;

                    for (let e of enemies) {
                        let dist = Math.hypot(u.x - e.x, u.y - e.y);
                        if (dist < closestDist) { closestDist = dist; target = e; }
                    }

                    if (!target && (tadpoleNest.x - u.x) < u.range) target = tadpoleNest;

                    let isMoving = false;

                    if (target) {
                        if (u.fireCooldown <= 0) {
                            let targetY = target === tadpoleNest ? u.y + (Math.random()*20-10) : target.y;
                            let angle = Math.atan2(targetY - u.y, (target === tadpoleNest ? tadpoleNest.x : target.x) - u.x);
                            
                            projectiles.push({
                                x: u.x + (u.type === 'tank' ? u.size : 5), y: u.y,
                                vx: Math.cos(angle) * 20, vy: Math.sin(angle) * 20,
                                damage: u.damage, isExplosive: u.type === 'tank'
                            });
                            u.fireCooldown = u.fireRate;
                        }
                    } else if (u.speed > 0 && (tadpoleNest.x - u.x) > u.prefDist) {
                        u.x += u.speed; isMoving = true;
                    }

                    if (isMoving) u.animTimer += (u.type === 'soldier' ? 0.4 : 0.2);
                    else u.animTimer = 0; 

                    if (u.hp <= 0) {
                        createExplosion(u.x, u.y, '#ff8800', 1.5);
                        units.splice(i, 1);
                    }
                }

                // 2. Update Projectiles
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    let p = projectiles[i];
                    p.x += p.vx; p.y += p.vy;

                    let hit = false;
                    if (p.x > tadpoleNest.x) {
                        nestHealth -= p.damage;
                        createExplosion(p.x, p.y, '#88ffaa', 1.0);
                        playHitSound();
                        hit = true;
                    } else {
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            let e = enemies[j];
                            if (Math.hypot(p.x - e.x, p.y - e.y) < e.radius + 3) {
                                e.hp -= p.damage;
                                hit = true;
                                if (p.isExplosive) createExplosion(p.x, p.y, '#ff4400', 1.5);
                                else createExplosion(p.x, p.y, e.type === 'shielded' && e.hp > 0 ? '#00ffff' : '#88ff88', 0.5);
                                
                                playHitSound();
                                if (e.hp <= 0) enemies.splice(j, 1);
                                break;
                            }
                        }
                    }
                    if (hit || p.x > canvas.width || p.x < 0 || p.y < 0 || p.y > canvas.height) projectiles.splice(i, 1);
                }
                
                // 3. Update Enemies (P2)
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    let aggroUnit = null;
                    let closestDist = e.type === 'froglet' ? 350 : 250; 
                    let eatingUnit = null;

                    for (let u of units) {
                        let dist = Math.hypot(u.x - e.x, u.y - e.y);
                        if (dist < e.radius + u.size + 2) { eatingUnit = u; break; }
                        if (dist < closestDist) { closestDist = dist; aggroUnit = u; }
                    }

                    if (e.type === 'frog') {
                        e.jumpTimer++;
                        if (e.jumpTimer > 90) {
                            e.speed = e.maxSpeed; 
                            if (e.jumpTimer > 110) e.jumpTimer = 0; 
                        } else e.speed *= 0.85; 
                    }

                    if (eatingUnit) {
                        if (e.attackCooldown <= 0) {
                            eatingUnit.hp -= (e.type === 'frog' ? 25 : (e.type === 'froglet' ? 4 : 2));
                            e.attackCooldown = e.type === 'frog' ? 30 : 8;
                            createExplosion(e.x - 5, e.y, '#ff0000', 0.5);
                        } else e.attackCooldown--;
                    } else if (aggroUnit) {
                        let angle = Math.atan2(aggroUnit.y - e.y, aggroUnit.x - e.x);
                        e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed;
                        if (e.type !== 'frog') {
                            e.x += Math.cos(e.wobble) * 0.5; e.y += Math.sin(e.wobble) * 0.5; e.wobble += 0.3;
                        }
                    } else {
                        e.x -= e.speed;
                        if (e.type !== 'frog') { e.y += Math.sin(e.wobble) * 1.5; e.wobble += 0.2; }
                    }
                    
                    if (e.x < playerBase.width) {
                        enemies.splice(i, 1);
                        playerHealth -= (e.type === 'frog' ? 50 : (e.type === 'shielded' ? 10 : 5)); 
                        if (playerHealth <= 0) {
                            playerHealth = 0;
                            winner = 'PLAYER 2 (SWARM)';
                            gameState = 'GAME_OVER';
                        }
                    }
                }

                // 4. Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].x += particles[i].vx; particles[i].y += particles[i].vy;
                    particles[i].life--;
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }

                if (nestHealth <= 0) {
                    winner = 'PLAYER 1 (COMMAND)';
                    gameState = 'GAME_OVER';
                }
            }

            // --- DRAWING ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'START') {
                drawTextCentered("TADPOLE SWARM: VERSUS MODE", -60, 50, "#ff00aa");
                drawTextCentered("P1 (Left) Defends the Base. P2 (Right) Controls the Swarm.", 0, 24, "white");
                drawTextCentered(pads.length === 2 ? "Press [A] to Start" : `Connect 2 Xbox Controllers to Play (${pads.length}/2 Connected)`, 60, 20, pads.length === 2 ? "#00aaff" : "yellow");
            } 
            else if (gameState === 'GAME_OVER') {
                drawTextCentered(`${winner} WINS!`, -40, 60, winner.includes('SWARM') ? '#ff4444' : '#44ff44');
                drawTextCentered("Press [A] to Rematch", 40, 20, "#00aaff");
            }
            else if (gameState === 'PLAYING') {
                // Center Line
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();

                // Draw Player Base
                ctx.fillStyle = '#223'; ctx.fillRect(playerBase.x, playerBase.y, playerBase.width, playerBase.height);
                ctx.fillStyle = '#445'; for(let i=0; i<canvas.height; i+=40) ctx.fillRect(playerBase.width - 10, i, 10, 20); 
                ctx.fillStyle = `rgba(255, 0, 0, ${1 - (playerHealth/playerBaseMaxHealth)})`; ctx.fillRect(playerBase.width, 0, 20, canvas.height);

                // Draw Mutant Nest
                ctx.fillStyle = '#0a2e15'; ctx.fillRect(tadpoleNest.x, tadpoleNest.y, tadpoleNest.width, tadpoleNest.height);
                for(let i=0; i<15; i++) {
                    ctx.fillStyle = `rgba(10, 60, 20, ${0.3 + Math.sin(Date.now()*0.001 + i)*0.2})`;
                    ctx.beginPath(); ctx.arc(tadpoleNest.x + (i%3)*50, i*80, 60, 0, Math.PI*2); ctx.fill();
                }

                // Draw Units 
                for (let u of units) {
                    if(u.type === 'soldier') {
                        let legOffset = Math.sin(u.animTimer) * 4;
                        ctx.fillStyle = '#1b5e20';
                        ctx.beginPath(); ctx.ellipse(u.x - 1 + legOffset, u.y - 4, 3, 2, 0, 0, Math.PI*2); ctx.fill(); 
                        ctx.beginPath(); ctx.ellipse(u.x - 1 - legOffset, u.y + 4, 3, 2, 0, 0, Math.PI*2); ctx.fill(); 
                        ctx.fillStyle = u.color;
                        ctx.beginPath(); ctx.ellipse(u.x, u.y, 4, 6, 0, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#111'; ctx.fillRect(u.x, u.y - 1, 12, 2); 
                        ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(u.x, u.y, 4, 0, Math.PI*2); ctx.fill();
                        if (u.fireCooldown > u.fireRate - 3) {
                            ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(u.x + 13, u.y, 3, 0, Math.PI*2); ctx.fill();
                        }
                    } else if (u.type === 'tank') {
                        let treadOffset = (u.animTimer * 5) % 8; 
                        ctx.fillStyle = '#111'; ctx.fillRect(u.x - u.size - 2, u.y - u.size, u.size*2 + 4, u.size*2);
                        ctx.fillStyle = '#333';
                        for(let t = 0; t < u.size*2; t+=4) ctx.fillRect(u.x - u.size + t - treadOffset, u.y - u.size, 2, u.size*2);
                        ctx.fillStyle = u.color; ctx.fillRect(u.x - u.size, u.y - u.size + 2, u.size*2, u.size*2 - 4);
                        ctx.fillStyle = '#1b5e20'; ctx.beginPath(); ctx.arc(u.x, u.y, u.size-3, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#111'; ctx.fillRect(u.x, u.y - 1.5, u.size + 12, 4);
                        if (u.fireCooldown > u.fireRate - 4) {
                            ctx.fillStyle = '#ff6600'; ctx.beginPath(); ctx.arc(u.x + u.size + 14, u.y, 6, 0, Math.PI*2); ctx.fill();
                        }
                    } else if (u.type === 'bunker') {
                        ctx.fillStyle = '#757575';
                        ctx.beginPath(); ctx.arc(u.x, u.y, u.size, Math.PI/2, Math.PI*1.5, true); ctx.fill();
                        ctx.fillRect(u.x, u.y - u.size, u.size+5, u.size*2);
                        ctx.fillStyle = '#111'; ctx.fillRect(u.x+5, u.y-2, 10, 4); 
                        if (u.fireCooldown > u.fireRate - 2) {
                            ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(u.x + 16, u.y, 4, 0, Math.PI*2); ctx.fill();
                        }
                    }
                    if(u.hp < u.maxHp) {
                        ctx.fillStyle = 'red'; ctx.fillRect(u.x - u.size, u.y - u.size - 6, u.size*2, 2);
                        ctx.fillStyle = 'green'; ctx.fillRect(u.x - u.size, u.y - u.size - 6, (u.size*2) * (u.hp/u.maxHp), 2);
                    }
                }

                // Draw Projectiles
                for (let p of projectiles) {
                    ctx.strokeStyle = p.isExplosive ? '#ffaa00' : '#ffff55'; ctx.lineWidth = p.isExplosive ? 3 : 1.5;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.7, p.y - p.vy * 0.7); ctx.stroke();
                }

                // Draw Enemies
                for (let e of enemies) {
                    if (e.type === 'shielded') {
                        ctx.fillStyle = `rgba(0, 255, 255, ${0.1 + (e.hp/80)*0.2})`;
                        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI*2); ctx.fill();
                        ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 1; ctx.stroke();
                    }
                    if (e.type === 'froglet' || e.type === 'frog') {
                        ctx.strokeStyle = '#007733'; ctx.lineWidth = e.type === 'frog' ? 4 : 2;
                        let legExt = e.type === 'frog' && e.jumpTimer > 90 ? 15 : 5; 
                        ctx.beginPath(); 
                        ctx.moveTo(e.x, e.y - e.radius); ctx.lineTo(e.x + legExt, e.y - e.radius - 5);
                        ctx.moveTo(e.x, e.y + e.radius); ctx.lineTo(e.x + legExt, e.y + e.radius + 5);
                        ctx.stroke();
                    } else {
                        ctx.strokeStyle = '#00aa55'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(e.x, e.y);
                        ctx.lineTo(e.x + e.radius + 4, e.y + Math.sin(e.wobble) * 4);
                        ctx.lineTo(e.x + e.radius + 8, e.y + Math.sin(e.wobble - 1) * 6); ctx.stroke();
                    }
                    ctx.fillStyle = e.type === 'frog' ? '#006622' : '#00ff88';
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
                    let eyeOffset = e.type === 'frog' ? 4 : 2;
                    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(e.x - eyeOffset, e.y - eyeOffset, eyeOffset, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(e.x - (eyeOffset+0.5), e.y - eyeOffset, eyeOffset/2, 0, Math.PI * 2); ctx.fill();
                    
                    if(e.type === 'frog') {
                        ctx.fillStyle = 'red'; ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, e.radius*2, 3);
                        ctx.fillStyle = 'green'; ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, (e.radius*2) * (e.hp/350), 3); 
                    }
                }

                // Particles
                for (let p of particles) {
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 12;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1.0;

                // Draw Crosshairs
                players.forEach(player => {
                    if (pads[player.id]) {
                        ctx.strokeStyle = player.crosshair.color; 
                        ctx.lineWidth = 2;
                        ctx.beginPath(); 
                        ctx.arc(player.crosshair.x, player.crosshair.y, player.crosshair.radius, 0, Math.PI * 2);
                        ctx.moveTo(player.crosshair.x - player.crosshair.radius - 4, player.crosshair.y); 
                        ctx.lineTo(player.crosshair.x + player.crosshair.radius + 4, player.crosshair.y);
                        ctx.moveTo(player.crosshair.x, player.crosshair.y - player.crosshair.radius - 4); 
                        ctx.lineTo(player.crosshair.x, player.crosshair.y + player.crosshair.radius + 4);
                        ctx.stroke();
                    }
                });

                // --- UI FOR P1 (COMMAND) ---
                ctx.fillStyle = 'white'; ctx.font = 'bold 20px Arial';
                ctx.fillText(`P1 (COMMAND)`, 80, 30);
                
                ctx.fillStyle = playerHealth > (playerBaseMaxHealth*0.3) ? '#44ff44' : '#ff4444'; 
                ctx.fillText(`Base HP: ${Math.max(0, playerHealth)}/${playerBaseMaxHealth}`, 80, 55);

                ctx.fillStyle = 'white'; ctx.font = '14px Arial'; ctx.fillText("Energy:", 80, 85);
                ctx.strokeStyle = 'white'; ctx.strokeRect(140, 72, 150, 15);
                ctx.fillStyle = '#00aaff'; ctx.fillRect(142, 74, 146 * (p1Energy/100), 11);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(80, 100, 240, 85);
                ctx.fillStyle = '#aaaaaa'; ctx.font = '12px Arial'; ctx.fillText("Deploy Units:", 90, 115);
                ctx.fillStyle = p1Energy >= 25 ? '#44ff44' : '#555'; ctx.fillText(`[LB] 3x Paratroopers (-25)`, 90, 135);
                ctx.fillStyle = p1Energy >= 60 ? '#44ff44' : '#555'; ctx.fillText(`[LT] Tank Platoon (-60)`, 90, 155);
                ctx.fillStyle = p1Energy >= 90 ? '#ff4444' : '#555'; ctx.fillText(`[RB] Heavy Bunker (-90)`, 90, 175);

                // --- UI FOR P2 (SWARM) ---
                let p2Offset = canvas.width - 320;
                ctx.fillStyle = 'white'; ctx.font = 'bold 20px Arial';
                ctx.fillText(`P2 (SWARM)`, p2Offset, 30);
                
                ctx.fillStyle = nestHealth > (nestMaxHealth*0.3) ? '#ff00aa' : '#ff4444'; 
                ctx.fillText(`Nest HP: ${Math.max(0, nestHealth)}/${nestMaxHealth}`, p2Offset, 55);

                ctx.fillStyle = 'white'; ctx.font = '14px Arial'; ctx.fillText("Bio-Energy:", p2Offset, 85);
                ctx.strokeStyle = 'white'; ctx.strokeRect(p2Offset + 80, 72, 150, 15);
                ctx.fillStyle = '#ff0055'; ctx.fillRect(p2Offset + 82, 74, 146 * (p2Energy/100), 11);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(p2Offset, 100, 240, 105);
                ctx.fillStyle = '#aaaaaa'; ctx.font = '12px Arial'; ctx.fillText("Spawn Mutants:", p2Offset + 10, 115);
                ctx.fillStyle = p2Energy >= 10 ? '#ff88aa' : '#555'; ctx.fillText(`[LB] 3x Basic Tadpole (-10)`, p2Offset + 10, 135);
                ctx.fillStyle = p2Energy >= 20 ? '#00ffff' : '#555'; ctx.fillText(`[LT] 1x Shielded Mutant (-20)`, p2Offset + 10, 155);
                ctx.fillStyle = p2Energy >= 30 ? '#44ff44' : '#555'; ctx.fillText(`[RB] 3x Speed Froglet (-30)`, p2Offset + 10, 175);
                ctx.fillStyle = p2Energy >= 70 ? '#ff4444' : '#555'; ctx.fillText(`[RT] 1x Giant Boss Frog (-70)`, p2Offset + 10, 195);
            }

            if (pads.length < 2 && gameState !== 'START') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawTextCentered("Waiting for 2 Controllers...", 0, 40, "yellow");
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            tadpoleNest.x = canvas.width - 150;
            tadpoleNest.height = canvas.height;
            playerBase.height = canvas.height;
        });
    </script>
</body>
</html>
