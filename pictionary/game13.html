<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictionary - TV Display</title>
    <style>
        body { margin: 0; padding: 0; background: #f0f0f0; font-family: sans-serif; overflow: hidden; }
        
        #ui-bar { 
            background: #333; 
            color: white; 
            padding: 15px 30px; 
            display: flex; 
            align-items: center;
            position: relative; /* Allows us to absolutely position the center element */
            height: 60px; /* Gives the bar a fixed height to contain the large text */
        }
        
        .url-info {
            font-size: 1.2em;
            z-index: 1; /* Ensures it stays visible */
        }

        .room-code-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%); /* Pulls it back exactly halfway to perfectly center it */
            font-size: 1.5em;
            text-align: center;
            white-space: nowrap;
        }

        #room-code { 
            font-size: 1.5em; 
            font-weight: bold; 
            color: #ffeb3b; 
            letter-spacing: 2px; 
        }
        
        /* Force the canvas to be a specific 16:9 ratio for the TV */
        #tvCanvas { background: white; box-shadow: 0 0 10px rgba(0,0,0,0.2); display: block; margin: 20px auto; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="ui-bar">
        <div class="url-info">Go to: <strong>https://avdpe22.github.io/xbox-web-games/pictionary/controller.html</strong></div>
        <div class="room-code-container">Room Code: <span id="room-code">GENERATING...</span></div>
    </div>
    
    <!-- 1920x1080 resolution for high quality TV rendering -->
    <canvas id="tvCanvas" width="1920" height="1080" style="width: 90vw; max-width: 1920px; aspect-ratio: 16/9;"></canvas>

    <script src="host.js"></script>
</body>
</html>
