<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictionary - TV Display</title>
    <style>
        body { margin: 0; padding: 0; background: #f0f0f0; font-family: sans-serif; overflow: hidden; }
        
        /* CSS Grid divides the bar into 3 equal columns */
        #ui-bar { 
            background: #333; 
            color: white; 
            padding: 15px 30px; 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; /* Left takes 1 fraction, Center sizes to content, Right takes 1 fraction */
            align-items: center;
            height: 60px;
        }
        
        /* Aligns to the far left */
        .left-zone {
            justify-self: start;
            font-size: 1.2em;
        }

        /* Aligns to the dead center */
        .center-zone {
            justify-self: center;
            font-size: 1.5em;
            white-space: nowrap;
        }

        /* Aligns to the far right */
        .right-zone {
            justify-self: end;
        }

        #room-code { 
            font-size: 1.5em; 
            font-weight: bold; 
            color: #ffeb3b; 
            letter-spacing: 2px; 
        }
        
        /* Styling for the exit link/button so it looks good on the dark bar */
        .exit-btn {
            color: white;
            text-decoration: none;
            background: #dc3545;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        #tvCanvas { background: white; box-shadow: 0 0 10px rgba(0,0,0,0.2); display: block; margin: 20px auto; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    
    <div id="ui-bar">
        <!-- 1. Left Column: URL Instructions -->
        <div class="left-zone">
            Go to: <strong>https://avdpe22.github.io/xbox-web-games/pictionary/controller.html</strong>
        </div>
        
        <!-- 2. Center Column: Room Code -->
        <div class="center-zone">
            Room Code: <span id="room-code">GENERATING...</span>
        </div>

       <!--
            // 3. Right Column: Exit Button (Put your exit link here)
            <div class="right-zone">
            <a href="../index.html" class="exit-btn">Exit to Arcade</a>
            </div>
        -->
    </div>
    
    <canvas id="tvCanvas" width="1920" height="1080" style="width: 90vw; max-width: 1920px; aspect-ratio: 16/9;"></canvas>

    <script src="host.js"></script>
</body>
</html>
