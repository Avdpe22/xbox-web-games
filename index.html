<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Xbox Game Hub</title>
    <style>
        /* Modern Xbox-style dark theme with a radial gradient background */
        body { 
            background: radial-gradient(circle at top, #2b2b2b, #0b0b0b);
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 40px 20px;
            min-height: 100vh;
        }

        h1 { 
            font-size: 2.8rem; 
            margin-bottom: 40px; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(16, 124, 16, 0.5);
        }
        
        /* Tighter flexbox grid for smaller tiles */
        .game-grid { 
            display: flex; 
            justify-content: center; 
            align-items: stretch;
            gap: 20px; /* Reduced gap to fit more items */
            flex-wrap: wrap; 
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Compact card design */
        .game-card { 
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border-radius: 15px; 
            cursor: pointer; 
            border: 2px solid #333; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 170px; /* Shrunk from 260px */
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            outline: none;
        }

        /* Scaled down artwork area */
        .game-art {
            height: 90px; /* Shrunk from 140px */
            background: linear-gradient(145deg, #107C10, #0a4f0a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem; /* Shrunk from 3rem */
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        /* Tighter info padding and font sizing */
        .game-info {
            padding: 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-info h2 {
            margin: 0 0 6px 0;
            font-size: 1.1rem; /* Shrunk from 1.5rem */
            line-height: 1.2;
        }

        .game-info p {
            margin: 0;
            color: #aaaaaa;
            font-size: 0.8rem; /* Shrunk from 0.95rem */
        }
        
        /* Highlight effect */
        .game-card:hover, .game-card:focus { 
            border-color: #107C10; 
            transform: translateY(-8px) scale(1.05); 
            box-shadow: 0 12px 25px rgba(16, 124, 16, 0.4);
        }

        .game-card:hover .game-art, .game-card:focus .game-art {
            opacity: 1;
        }

        /* Fullscreen game container */
        #gameContainer { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #000; 
            z-index: 1000; 
            animation: fadeIn 0.3s ease-out;
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        
        /* Close button */
        .close-btn { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            padding: 10px 20px; 
            font-size: 14px; 
            font-weight: 600;
            background: rgba(229, 0, 0, 0.8); 
            color: white; 
            border: 2px solid transparent; 
            border-radius: 30px;
            cursor: pointer; 
            z-index: 1001;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }
        
        .close-btn:hover, .close-btn:focus { 
            background: rgba(255, 51, 51, 1); 
            transform: scale(1.05);
            border-color: white;
            outline: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>My Xbox Series X Arcade</h1>
    
    <div class="game-grid">
        <!-- Game 1 -->
        <div class="game-card" tabindex="0" onclick="launchGame('game.html')" onkeypress="handleKeyPress(event, 'game.html')">
            <div class="game-art">🎮</div>
            <div class="game-info">
                <h2>Test Template</h2>
                <p>Canvas + Gamepad API</p>
            </div>
        </div>

        <!-- Game 2 -->
        <div class="game-card" tabindex="0" onclick="launchGame('game2.html')" onkeypress="handleKeyPress(event, 'game2.html')">
            <div class="game-art">🚀</div>
            <div class="game-info">
                <h2>Space Shooter</h2>
                <p>Fly & Shoot</p>
            </div>
        </div>

        <!-- Game 3 -->
        <div class="game-card" tabindex="0" onclick="launchGame('game3.html')" onkeypress="handleKeyPress(event, 'game3.html')">
            <div class="game-art">🐸</div>
            <div class="game-info">
                <h2>Base Assault</h2>
                <p>Destroy Tadpoles</p>
            </div>
        </div> 

        <!-- Game 4 -->
        <div class="game-card" tabindex="0" onclick="launchGame('game4.html')" onkeypress="handleKeyPress(event, 'game4.html')">
            <div class="game-art">🪖</div>
            <div class="game-info">
                <h2>Toy Soldiers</h2>
                <p>Protect the Base</p>
            </div>
        </div> 
                
        <!-- Game 5 -->
        <div class="game-card" tabindex="0" onclick="launchGame('game5.html')" onkeypress="handleKeyPress(event, 'game5.html')">
            <div class="game-art">🎖️</div>
            <div class="game-info">
                <h2>Toy Soldiers Classic</h2>
                <p>Protect the Base</p>
            </div>
        </div>

        <!-- Game 6 -->
        <div class="game-card" tabindex="0" onclick="launchGame('game6.html')" onkeypress="handleKeyPress(event, 'game6.html')">
            <div class="game-art">⚔️</div>
            <div class="game-info">
                <h2>Tadpole Attack v2A</h2>
                <p>Spawn Army Troops</p>
            </div>
        </div>

        <!-- Game 7 -->
        <div class="game-card" tabindex="0" onclick="launchGame('game7.html')" onkeypress="handleKeyPress(event, 'game7.html')">
            <div class="game-art">🦠</div>
            <div class="game-info">
                <h2>Tadpole Swarm</h2>
                <p>Spawn Army Troops</p>
            </div>
        </div>        
    </div>

    <!-- The overlay that runs the game -->
    <div id="gameContainer">
        <button class="close-btn" tabindex="0" onclick="closeGame()" onkeypress="handleCloseKeyPress(event)">Exit Game (Back to Hub)</button>
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <script>
        // Accessibility addition: Allow launching games by pressing 'Enter' or 'A' button (if mapped to Enter)
        function handleKeyPress(event, gameUrl) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                launchGame(gameUrl);
            }
        }

        function handleCloseKeyPress(event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                closeGame();
            }
        }

        function launchGame(gameUrl) {
            const frame = document.getElementById('gameFrame');
            const container = document.getElementById('gameContainer');
            
            frame.src = gameUrl;
            container.style.display = 'block';
            
            // Force focus so the controller works immediately in the iframe
            setTimeout(() => { frame.focus(); }, 100);
        }

        function closeGame() {
            document.getElementById('gameFrame').src = '';
            document.getElementById('gameContainer').style.display = 'none';
        }
    </script>
</body>
</html>
