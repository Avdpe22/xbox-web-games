<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Rush - Xbox Web</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        h1 { margin: 0; color: #ffc107; text-shadow: 2px 2px 0px #000; }
        #ui p { text-shadow: 1px 1px 2px #000; }
        #score { color: #ffc107; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Honey Rush</h1>
        <p>Score: <span id="score">0</span></p>
        <p>🎮 <strong>Left Stick</strong>: Move Cursor | <strong>'A' Button</strong>: Extract Honey</p>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // --- Tunable constants (gameplay values unchanged from original) ---
        const HEX_SIZE = 45;
        const HEX_STROKE_SIZE = HEX_SIZE - 2;
        const HEX_WIDTH = Math.sqrt(3) * HEX_SIZE;
        const HEX_HEIGHT = 2 * HEX_SIZE;
        const HEX_ROW_SPACING = HEX_HEIGHT * 0.75;

        const CURSOR_SPEED = 7;
        const STICK_DEADZONE = 0.15;
        const A_BUTTON_INDEX = 0;

        const HONEY_INITIAL_MAX = 30;
        const HONEY_EXTRACT_THRESHOLD = 10;
        const HONEY_GROWTH_BASE = 0.08;
        const HONEY_GROWTH_SCORE_FACTOR = 0.00005;
        const HONEY_OVERFLOW = 100;
        const HONEY_WARN_LEVEL = 80; // purely visual "about to overflow" warning

        const CURSOR_DOT_RADIUS = 8;
        const CURSOR_RING_RADIUS = 16;
        const FLASH_DURATION_FRAMES = 18;

        const HEX_STROKE_STYLE = 'rgba(255, 193, 7, 0.3)';
        const HEX_STROKE_WIDTH = 3;

        // High-DPI support: render crisply on retina-style displays without
        // changing any logical coordinate math (cursor speed, hex layout, etc.
        // all continue to operate in CSS/logical pixels).
        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);

        // Precomputed unit-circle offsets for hex corners (pointy-topped).
        // Angle only depends on corner index, never on position/size, so this
        // table is built once instead of recomputing 6 sin/cos calls per hex
        // per frame.
        const HEX_CORNERS = Array.from({ length: 6 }, (_, i) => {
            const angle = Math.PI / 180 * (60 * i - 30);
            return { cos: Math.cos(angle), sin: Math.sin(angle) };
        });

        const grid = [];
        const flashes = []; // active extraction flash effects, reused in place

        let score = 0;
        let gameOver = false;

        // Virtual Cursor for Xbox Gamepad
        let cursor = { x: width / 2, y: height / 2, speed: CURSOR_SPEED };
        let lastAState = false;

        // Generate the honeycomb grid (unchanged layout/RNG behavior)
        const rows = Math.floor(height / HEX_ROW_SPACING);
        const cols = Math.floor(width / HEX_WIDTH);

        for (let row = 1; row < rows - 1; row++) {
            for (let col = 1; col < cols - 1; col++) {
                const x = (col * HEX_WIDTH) + (row % 2 === 1 ? HEX_WIDTH / 2 : 0);
                const y = row * HEX_ROW_SPACING;
                grid.push({ x, y, honey: Math.random() * HONEY_INITIAL_MAX });
            }
        }

        // Draw a single hexagon
        function drawHex(x, y, size, honeyLevel) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const corner = HEX_CORNERS[i];
                const px = x + size * corner.cos;
                const py = y + size * corner.sin;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();

            // The rising honey visual
            if (honeyLevel > 0) {
                ctx.fillStyle = `rgba(255, 160, 0, ${honeyLevel / 100})`;
                ctx.fill();

                // Subtle warning glow as a cell nears overflow (visual only)
                if (honeyLevel > HONEY_WARN_LEVEL) {
                    ctx.strokeStyle = 'rgba(255, 80, 40, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.strokeStyle = HEX_STROKE_STYLE;
                    ctx.lineWidth = HEX_STROKE_WIDTH;
                }
            }
        }

        // Extract honey based on cursor proximity
        function extractHoney() {
            let closest = null;
            let minDistSq = Infinity;
            const thresholdSq = HEX_SIZE * HEX_SIZE;
            for (let hex of grid) {
                const dx = hex.x - cursor.x;
                const dy = hex.y - cursor.y;
                const distSq = dx * dx + dy * dy;
                if (distSq < minDistSq && distSq < thresholdSq) {
                    minDistSq = distSq;
                    closest = hex;
                }
            }

            // Only reward if there was a dangerous amount of honey
            if (closest && closest.honey > HONEY_EXTRACT_THRESHOLD) {
                score += Math.floor(closest.honey);
                closest.honey = 0;
                scoreEl.innerText = score;
                flashes.push({ x: closest.x, y: closest.y, t: 0 });
            }
        }

        // Handle Xbox controller inputs via Gamepad API
        function pollGamepad() {
            const gamepads = navigator.getGamepads();
            if (gamepads[0]) {
                const gp = gamepads[0];

                // Axes 0 and 1 are the Left Stick
                const dx = gp.axes[0];
                const dy = gp.axes[1];

                // Deadzone to prevent drift
                if (Math.abs(dx) > STICK_DEADZONE) cursor.x += dx * cursor.speed;
                if (Math.abs(dy) > STICK_DEADZONE) cursor.y += dy * cursor.speed;

                // Keep cursor on screen
                cursor.x = Math.max(0, Math.min(width, cursor.x));
                cursor.y = Math.max(0, Math.min(height, cursor.y));

                // Button 0 is the 'A' Button
                const aPressed = gp.buttons[A_BUTTON_INDEX].pressed;
                if (aPressed && !lastAState) {
                    extractHoney();
                }
                lastAState = aPressed;
            }
        }

        // Mouse fallback for testing on PC
        window.addEventListener('mousedown', (e) => {
            cursor.x = e.clientX;
            cursor.y = e.clientY;
            extractHoney();
        });

        // Draw and age out active extraction flashes in place (no per-frame
        // array reallocation; finished flashes are spliced out)
        function drawFlashes() {
            for (let i = flashes.length - 1; i >= 0; i--) {
                const f = flashes[i];
                f.t++;
                const progress = f.t / FLASH_DURATION_FRAMES;
                if (progress >= 1) {
                    flashes.splice(i, 1);
                    continue;
                }
                ctx.beginPath();
                ctx.arc(f.x, f.y, HEX_SIZE * (0.3 + progress * 0.9), 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 235, 150, ${1 - progress})`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        // Main Game Loop
        function gameLoop() {
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 64px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('OVERFLOW!', width / 2, height / 2);
                ctx.fillStyle = 'white';
                ctx.font = '32px sans-serif';
                ctx.fillText(`Final Score: ${score}`, width / 2, height / 2 + 50);
                return;
            }

            // Clear screen
            ctx.clearRect(0, 0, width, height);
            pollGamepad();

            // Update and draw grid
            ctx.strokeStyle = HEX_STROKE_STYLE;
            ctx.lineWidth = HEX_STROKE_WIDTH;
            for (let hex of grid) {
                // Honey rises faster as your score gets higher
                hex.honey += HONEY_GROWTH_BASE + (score * HONEY_GROWTH_SCORE_FACTOR);
                if (hex.honey >= HONEY_OVERFLOW) gameOver = true;
                drawHex(hex.x, hex.y, HEX_STROKE_SIZE, hex.honey);
            }

            drawFlashes();

            // Draw Virtual Target Cursor
            ctx.beginPath();
            ctx.arc(cursor.x, cursor.y, CURSOR_DOT_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cursor.x, cursor.y, CURSOR_RING_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
