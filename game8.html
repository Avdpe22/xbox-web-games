<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Rush - Xbox Web</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        h1 { margin: 0; color: #ffc107; text-shadow: 2px 2px 0px #000; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Honey Rush</h1>
        <p>Score: <span id="score">0</span></p>
        <p>🎮 <strong>Left Stick</strong>: Move Cursor | <strong>'A' Button</strong>: Extract Honey</p>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Hexagon math setup
        const hexSize = 45;
        const hexWidth = Math.sqrt(3) * hexSize;
        const hexHeight = 2 * hexSize;
        const grid = [];
        
        let score = 0;
        let gameOver = false;

        // Virtual Cursor for Xbox Gamepad
        let cursor = { x: canvas.width / 2, y: canvas.height / 2, speed: 7 };
        let lastAState = false;

        // Generate the honeycomb grid
        const rows = Math.floor(canvas.height / (hexHeight * 0.75));
        const cols = Math.floor(canvas.width / hexWidth);
        
        for (let row = 1; row < rows - 1; row++) {
            for (let col = 1; col < cols - 1; col++) {
                let x = (col * hexWidth) + (row % 2 === 1 ? hexWidth / 2 : 0);
                let y = row * hexHeight * 0.75;
                grid.push({ x, y, honey: Math.random() * 30 }); // Random starting honey
            }
        }

        // Draw a single hexagon
        function drawHex(x, y, size, honeyLevel) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                let angle_deg = 60 * i - 30; // Pointy-topped
                let angle_rad = Math.PI / 180 * angle_deg;
                let px = x + size * Math.cos(angle_rad);
                let py = y + size * Math.sin(angle_rad);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            // Hex outline
            ctx.strokeStyle = 'rgba(255, 193, 7, 0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // The rising honey visual
            if (honeyLevel > 0) {
                ctx.fillStyle = `rgba(255, 160, 0, ${honeyLevel / 100})`;
                ctx.fill();
            }
        }

        // Extract honey based on cursor proximity
        function extractHoney() {
            let closest = null;
            let minDist = Infinity;
            for (let hex of grid) {
                let dist = Math.hypot(hex.x - cursor.x, hex.y - cursor.y);
                if (dist < minDist && dist < hexSize) {
                    minDist = dist;
                    closest = hex;
                }
            }
            
            // Only reward if there was a dangerous amount of honey
            if (closest && closest.honey > 10) {
                score += Math.floor(closest.honey);
                closest.honey = 0;
                document.getElementById('score').innerText = score;
            }
        }

        // Handle Xbox controller inputs via Gamepad API
        function pollGamepad() {
            const gamepads = navigator.getGamepads();
            if (gamepads[0]) {
                const gp = gamepads[0];
                
                // Axes 0 and 1 are the Left Stick
                let dx = gp.axes[0];
                let dy = gp.axes[1];

                // Deadzone to prevent drift
                if (Math.abs(dx) > 0.15) cursor.x += dx * cursor.speed;
                if (Math.abs(dy) > 0.15) cursor.y += dy * cursor.speed;

                // Keep cursor on screen
                cursor.x = Math.max(0, Math.min(canvas.width, cursor.x));
                cursor.y = Math.max(0, Math.min(canvas.height, cursor.y));

                // Button 0 is the 'A' Button
                let aPressed = gp.buttons[0].pressed;
                if (aPressed && !lastAState) {
                    extractHoney();
                }
                lastAState = aPressed;
            }
        }

        // Mouse fallback for testing on PC
        window.addEventListener('mousedown', (e) => {
            cursor.x = e.clientX;
            cursor.y = e.clientY;
            extractHoney();
        });

        // Main Game Loop
        function gameLoop() {
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 64px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('OVERFLOW!', canvas.width/2, canvas.height/2);
                ctx.fillStyle = 'white';
                ctx.font = '32px sans-serif';
                ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2 + 50);
                return;
            }

            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pollGamepad();

            // Update and draw grid
            for (let hex of grid) {
                // Honey rises faster as your score gets higher
                hex.honey += 0.08 + (score * 0.00005); 
                if (hex.honey >= 100) gameOver = true;
                drawHex(hex.x, hex.y, hexSize - 2, hex.honey);
            }

            // Draw Virtual Target Cursor
            ctx.beginPath();
            ctx.arc(cursor.x, cursor.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cursor.x, cursor.y, 16, 0, Math.PI * 2);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
