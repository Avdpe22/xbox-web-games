        else this.x -= this.speed;

function startCandyBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    const stepTime = 0.15; // Groovy acid pacing
    const arp = [392.00, 311.13, 392.00, 466.16, 392.00, 311.13, 261.63, 311.13]; // G minor sour vibe
    const bass = [98.00, 98.00, 77.78, 77.78, 116.54, 116.54, 103.83, 103.83];

    bgmInterval = setInterval(() => {
        if (!audioCtx || gameState !== 'PLAYING') return;
        const now = audioCtx.currentTime;

        const lead = audioCtx.createOscillator();
        const leadGain = audioCtx.createGain();
        lead.type = 'square';
        lead.frequency.setValueAtTime(arp[musicStep % 8], now);
        leadGain.gain.setValueAtTime(0.04, now);
        leadGain.gain.exponentialRampToValueAtTime(0.001, now + stepTime * 0.9);
        lead.connect(leadGain); leadGain.connect(audioCtx.destination);
        lead.start(now); lead.stop(now + stepTime * 0.9);

        if (musicStep % 2 === 0) {
            const bOsc = audioCtx.createOscillator();
            const bGain = audioCtx.createGain();
            bOsc.type = 'sawtooth'; // Buzzy acid bass
            bOsc.frequency.setValueAtTime(bass[Math.floor(musicStep/2) % 8], now);
            bGain.gain.setValueAtTime(0.12, now);
            bGain.gain.exponentialRampToValueAtTime(0.01, now + stepTime * 1.5);
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(100, now + stepTime);
            
            bOsc.connect(filter); filter.connect(bGain); bGain.connect(audioCtx.destination);
            bOsc.start(now); bOsc.stop(now + stepTime * 1.5);
        }
        musicStep++;
    }, stepTime * 1000);
}

const GRAVITY = 0.2; // Halved for slower pacing
let score = 0;
let gumballsPlayed = 1;

class Gumball {
    constructor(x, y) { this.reset(x, y); }
    reset(x, y) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.radius = 22; 
        this.color = '#39ff14'; // Neon Green Sourball
        this.active = true;
        this.trail = [];
    }
    update() {
        if (!this.active) return;
        this.vy += GRAVITY;
        
        // Capped terminal velocity for easy tracking
        const speed = Math.hypot(this.vx, this.vy);
        if (speed > 16) {
            this.vx = (this.vx / speed) * 16;
            this.vy = (this.vy / speed) * 16;
        }

        this.x += this.vx; this.y += this.vy;

        // Motion Trail
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > 12) this.trail.shift();

        // Wall collisions
        if (this.x > 1800 && this.x < 1920) {
            if (this.x - this.radius < 1800) { this.x = 1800 + this.radius; this.vx *= -0.5; }
            if (this.x + this.radius > 1920) { this.x = 1920 - this.radius; this.vx *= -0.5; }
        } else {
            if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.6; }
            if (this.x + this.radius > 1800) { this.x = 1800 - this.radius; this.vx *= -0.6; }
        }
        if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -0.6; }

        // Drain / Forgiveness State
        if (this.y > 1100) {
            playSound('drain');
            this.active = false;
            tryAgainTimer = 90; // 1.5 second pause before auto-respawn
            gumballsPlayed++;
            fetchAnnouncerMessage(score);
        }
    }
    draw(ctx) {
        if (!this.active) return;
        ctx.save();
        
        // Draw Glowing Motion Trail
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.strokeStyle = `rgba(57, 255, 20, 0.3)`;
            ctx.lineWidth = this.radius * 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        ctx.translate(this.x, this.y);
        
        ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 15;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
        
        // Sour Dust Speckles
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        for(let i = 0; i < 8; i++) {
            let a = (i / 8) * Math.PI * 2 + (this.x * 0.05); // Spin with movement
            let r = this.radius * 0.6;
            ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 1.5, 0, Math.PI*2); ctx.fill();
        }

        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(-8, -8, 6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

    checkCollision(ball) {

        const dist = Math.hypot(dx, dy);
        
        if (dist < this.radius + ball.radius) {
            const overlap = (this.radius + ball.radius) - dist;
            const nx = dx / dist; const ny = dy / dist;
            ball.x += nx * overlap; ball.y += ny * overlap;

            const dotProduct = ball.vx * nx + ball.vy * ny;
            ball.vx -= dotProduct * nx * 1.2; ball.vy -= dotProduct * ny * 1.2;
            
            ball.vx += nx * 4; ball.vy += ny * 4; // Softer bounce
            this.hitFlash = 15;
            score += 250;
            playSound('bumper');

            // Juice: Screen Shake & Particles
            screenShake = 8;
            spawnParticles(this.x + nx * this.radius, this.y + ny * this.radius, '#ccff00', 15);
            floatingTexts.push({ x: this.x, y: this.y - 40, text: "+250", life: 60 });
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        if (this.hitFlash > 0) { ctx.scale(1.1, 1.1); this.hitFlash--; }
        
        // Glowing Sour Ring
        ctx.shadowColor = '#8a2be2'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#110022';
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
        
        ctx.lineWidth = 12;
        ctx.strokeStyle = '#8a2be2';
        ctx.beginPath(); ctx.arc(0, 0, this.radius - 6, 0, Math.PI * 2); ctx.stroke();

        ctx.shadowBlur = 0;
        
        // Sour Citrus Segments
        ctx.fillStyle = '#39ff14';
        for (let i = 0; i < 6; i++) {
            ctx.rotate(Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, this.radius - 12, 0.08, (Math.PI / 3) - 0.08);
            ctx.fill();
        }

        ctx.fillStyle = '#ccff00';
        ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.25, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

// --- PARTICLES & JUICE ---
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1.0, color: color, size: Math.random() * 6 + 4
        });
    }
}

function updateAndDrawJuice(ctx) {
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // Floating Text
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 1; ft.life--;
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.globalAlpha = ft.life / 60;
        ctx.fillStyle = '#ccff00';
        ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 10;
        ctx.font = '900 36px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
}

class Flipper {
    constructor(x, y, length, isRight) {
        this.x = x; this.y = y; 
        this.length = length; // Extended length to close the middle gap
        this.isRight = isRight;
        this.baseAngle = isRight ? Math.PI * 0.85 : Math.PI * 0.15;
        this.upAngle = isRight ? Math.PI * 1.15 : -Math.PI * 0.15;
        this.angle = this.baseAngle; this.width = 32; // Thicker flippers
    }
    update(isPressed) {
        this.angle += ((isPressed ? this.upAngle : this.baseAngle) - this.angle) * 0.35;
    }
    checkCollision(ball) {
        const endX = this.x + Math.cos(this.angle) * this.length;
        const endY = this.y + Math.sin(this.angle) * this.length;
        const l2 = this.length * this.length;
        let t = Math.max(0, Math.min(1, ((ball.x - this.x) * (endX - this.x) + (ball.y - this.y) * (endY - this.y)) / l2));
        
        const projX = this.x + t * (endX - this.x); const projY = this.y + t * (endY - this.y);
        const dx = ball.x - projX; const dy = ball.y - projY;
        const dist = Math.hypot(dx, dy);
        
        if (dist < ball.radius + this.width / 2) {
            const nx = dx / dist; const ny = dy / dist;
            ball.x += nx * ((ball.radius + this.width / 2) - dist);
            ball.y += ny * ((ball.radius + this.width / 2) - dist);
            
            const kickForce = (Math.abs(this.angle - this.upAngle) > 0.1) ? 20 * t : 0;
            const dot = ball.vx * nx + ball.vy * ny;
            if (dot < 0) { ball.vx -= dot * nx * 1.1; ball.vy -= dot * ny * 1.1; }
            
            const kX = Math.cos(this.angle - Math.PI/2) * (this.isRight ? -1 : 1);
            const kY = Math.sin(this.angle - Math.PI/2) * (this.isRight ? -1 : 1);
            
            if (kickForce > 0) { ball.vx += kX * kickForce; ball.vy -= Math.abs(kY * kickForce); }
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y); ctx.rotate(this.angle);
        ctx.shadowColor = '#ccff00'; ctx.shadowBlur = 12;
        
        // Sour Belt Flipper
        ctx.fillStyle = '#8a2be2';
        ctx.beginPath();
        ctx.arc(0, 0, this.width/2, Math.PI/2, Math.PI*1.5);
        ctx.lineTo(this.length, -this.width/4);
        ctx.arc(this.length, 0, this.width/4, -Math.PI/2, Math.PI/2);
        ctx.fill(); ctx.clip();
        
        ctx.shadowBlur = 0; ctx.lineWidth = 16; 
        ctx.strokeStyle = '#39ff14'; // Neon green stripes
        for (let i = -10; i < this.length + 20; i += 25) {
            ctx.beginPath(); ctx.moveTo(i, -this.width); ctx.lineTo(i + 15, this.width); ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle = '#ccff00'; ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI*2); ctx.fill();
    }
}
