<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUR RUSH PINBALL - 1ST GRADE EDITION</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background-color: #0a1100;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            background: linear-gradient(180deg, #112200 0%, #2a0033 100%);
            max-width: 100vw; max-height: 100vh;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.6), inset 0 0 100px rgba(138, 43, 226, 0.3);
            border-radius: 20px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1920" height="1080"></canvas>

<script>
/**
 * SOUR RUSH PINBALL - 1st Grade Accessibility Edition
 * - 50% Speed Physics
 * - 1-Button Universal Controls
 * - Visual Telegraphing
 * - Infinite Gumballs (No Game Over)
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- XBOX EDGE BROWSER FOCUS FIX ---
function ensureGameFocus() { window.focus(); canvas.focus({ preventScroll: true }); }
ensureGameFocus();
window.addEventListener('load', ensureGameFocus);
document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureGameFocus(); });
window.addEventListener('gamepadconnected', ensureGameFocus);
window.addEventListener('click', ensureGameFocus);

// --- AUDIO ENGINE ---
let audioCtx = null;
let bgmInterval = null;
let musicStep = 0;
let isAudioInit = false;

// --- CANDY KING AI (GEMINI API) ---
let currentAnnouncerMessage = "WELCOME TO THE SOUR RUSH, LITTLE BOUNCER!";
let isFetchingMessage = false;

async function fetchAnnouncerMessage(currentScore) {
    if (isFetchingMessage) return;
    isFetchingMessage = true;
    try {
        const prompt = `Act as a magical Sour Candy King cheering on a 6-year-old playing pinball. The player just lost a ball, but they get infinite tries! Their score is ${currentScore}. Write one super short, exciting, supportive sentence (maximum 10 words) to keep them happy! Use sour candy themes like neon, tangy, electric, lime, or zap.`;
        const payload = {
            contents: [{ parts: [{ text: prompt }] }]
        };
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.candidates && result.candidates[0].content?.parts?.[0]?.text) {
            let text = result.candidates[0].content.parts[0].text.trim();
            text = text.replace(/^"|"$/g, ''); // Remove quotes if present
            currentAnnouncerMessage = text.toUpperCase();
        }
    } catch (e) {
        console.error("LLM Error:", e);
    } finally {
        // Short cooldown before allowing another fetch
        setTimeout(() => { isFetchingMessage = false; }, 3000);
    }
}

function initAudio() {
    if (isAudioInit) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isAudioInit = true;
        startCandyBGM();
    } catch (e) {}
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'bumper') {
        osc.type = 'sawtooth'; // Edgier Zap
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'flipper') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'plunger') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.3); // High-pitched windup
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'drain') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.4);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    }
}

function startCandyBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    const stepTime = 0.15; // Groovy acid pacing
    const arp = [392.00, 311.13, 392.00, 466.16, 392.00, 311.13, 261.63, 311.13]; // G minor sour vibe
    const bass = [98.00, 98.00, 77.78, 77.78, 116.54, 116.54, 103.83, 103.83];

    bgmInterval = setInterval(() => {
        if (!audioCtx || gameState !== 'PLAYING') return;
        const now = audioCtx.currentTime;

        const lead = audioCtx.createOscillator();
        const leadGain = audioCtx.createGain();
        lead.type = 'square';
        lead.frequency.setValueAtTime(arp[musicStep % 8], now);
        leadGain.gain.setValueAtTime(0.04, now);
        leadGain.gain.exponentialRampToValueAtTime(0.001, now + stepTime * 0.9);
        lead.connect(leadGain); leadGain.connect(audioCtx.destination);
        lead.start(now); lead.stop(now + stepTime * 0.9);

        if (musicStep % 2 === 0) {
            const bOsc = audioCtx.createOscillator();
            const bGain = audioCtx.createGain();
            bOsc.type = 'sawtooth'; // Buzzy acid bass
            bOsc.frequency.setValueAtTime(bass[Math.floor(musicStep/2) % 8], now);
            bGain.gain.setValueAtTime(0.12, now);
            bGain.gain.exponentialRampToValueAtTime(0.01, now + stepTime * 1.5);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(100, now + stepTime);

            bOsc.connect(filter); filter.connect(bGain); bGain.connect(audioCtx.destination);
            bOsc.start(now); bOsc.stop(now + stepTime * 1.5);
        }
        musicStep++;
    }, stepTime * 1000);
}

// --- INPUT MANAGEMENT ---
// Left flipper and right flipper each answer to their own button; any of
// them (plus the dedicated action keys) will start the game / charge the plunger.
const Input = {
    leftPressed: false,
    rightPressed: false,
    actionPressed: false,
    actionJustPressed: false,
    prevAction: false,
    plungerHoldTime: 0,
    plungerReleased: false,
    plungerReleaseForce: 0,
    keys: { left: false, right: false, action: false },
    poll() {
        let left = this.keys.left;
        let right = this.keys.right;
        let action = this.keys.action;

        try {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = gamepads[0];
            if (pad && pad.buttons) {
                // Left flipper: LB, LT, D-Pad Left
                if (pad.buttons[4]?.pressed || pad.buttons[6]?.pressed || pad.buttons[14]?.pressed) left = true;
                // Right flipper: RB, RT, D-Pad Right
                if (pad.buttons[5]?.pressed || pad.buttons[7]?.pressed || pad.buttons[15]?.pressed) right = true;
                // Any face button also works for starting the game
                for (let i = 0; i <= 3; i++) {
                    if (pad.buttons[i]?.pressed) action = true;
                }
            }
        } catch (e) {}

        this.leftPressed = left;
        this.rightPressed = right;

        const anyPressed = left || right || action;
        this.actionJustPressed = anyPressed && !this.prevAction;
        this.actionPressed = anyPressed;
        this.prevAction = anyPressed;

        // Flipper sound on press
        if (this.actionJustPressed && gameState === 'PLAYING' && !(ball.x > 1800 && ball.y > 800)) {
            playSound('flipper');
        }

        // Plunger Logic - track the release edge here so it can never be
        // missed by callers that only read state on some frames (e.g. the
        // very first frame after the START screen).
        this.plungerReleased = false;
        if (anyPressed && ball.x > 1800 && ball.y > 800) {
            this.plungerHoldTime = Math.min(this.plungerHoldTime + 2, 100);
        } else if (this.plungerHoldTime > 0) {
            this.plungerReleased = true;
            this.plungerReleaseForce = this.plungerHoldTime;
            this.plungerHoldTime = 0;
        }
    }
};

// --- ACCESSIBLE PHYSICS ---
const GRAVITY = 0.2; // Halved for slower pacing
let score = 0;
let gumballsPlayed = 1;
let gameState = 'START';
let tryAgainTimer = 0;

let screenShake = 0;
let particles = [];
let floatingTexts = [];

class Gumball {
    constructor(x, y) { this.reset(x, y); }
    reset(x, y) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.radius = 22;
        this.color = '#39ff14'; // Neon Green Sourball
        this.active = true;
        this.trail = [];
        this.laneKicked = false;
    }
    update() {
        if (!this.active) return;
        this.vy += GRAVITY;

        // Capped terminal velocity for easy tracking
        const speed = Math.hypot(this.vx, this.vy);
        if (speed > 16) {
            this.vx = (this.vx / speed) * 16;
            this.vy = (this.vy / speed) * 16;
        }

        this.x += this.vx; this.y += this.vy;

        // Motion Trail
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > 12) this.trail.shift();

        // Outer screen edges
        if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.6; }
        if (this.x + this.radius > 1920) { this.x = 1920 - this.radius; this.vx *= -0.5; }
        if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -0.6; }

        // Shooter-lane divider - solid along the lane, but open above the
        // lane's mouth so a strong plunge can sail over it into the table.
        if (this.y > 450) {
            if (this.x > 1800 && this.x - this.radius < 1800) { this.x = 1800 + this.radius; this.vx *= -0.5; }
            if (this.x <= 1800 && this.x + this.radius > 1800) { this.x = 1800 - this.radius; this.vx *= -0.6; }
        }

        // Shooter lane floor - the ball rests here while the plunger charges
        // instead of free-falling straight through and draining.
        if (this.x > 1800 && this.y + this.radius > 1050) {
            this.y = 1050 - this.radius;
            if (this.vy > 0) this.vy = 0;
            this.laneKicked = false;
        }

        // Shooter lane rail - once a plunge clears the lane's open mouth,
        // the curved guide kicks it left into the table.
        if (this.x > 1800 && this.y < 450 && this.vy < 0 && !this.laneKicked) {
            this.vx = -9;
            this.laneKicked = true;
        }

        // Drain / Forgiveness State
        if (this.y > 1100) {
            playSound('drain');
            this.active = false;
            tryAgainTimer = 90; // 1.5 second pause before auto-respawn
            gumballsPlayed++;
            fetchAnnouncerMessage(score);
        }
    }
    draw(ctx) {
        if (!this.active) return;
        ctx.save();

        // Draw Glowing Motion Trail
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.strokeStyle = `rgba(57, 255, 20, 0.3)`;
            ctx.lineWidth = this.radius * 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        ctx.translate(this.x, this.y);

        ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 15;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();

        // Sour Dust Speckles
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        for(let i = 0; i < 8; i++) {
            let a = (i / 8) * Math.PI * 2 + (this.x * 0.05); // Spin with movement
            let r = this.radius * 0.6;
            ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 1.5, 0, Math.PI*2); ctx.fill();
        }

        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(-8, -8, 6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

class Bumper {
    constructor(x, y, radius) {
        this.x = x; this.y = y; this.radius = radius;
        this.hitFlash = 0;
    }
    checkCollision(ball) {
        const dx = ball.x - this.x; const dy = ball.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < this.radius + ball.radius) {
            const overlap = (this.radius + ball.radius) - dist;
            const nx = dx / dist; const ny = dy / dist;
            ball.x += nx * overlap; ball.y += ny * overlap;

            const dotProduct = ball.vx * nx + ball.vy * ny;
            ball.vx -= dotProduct * nx * 1.2; ball.vy -= dotProduct * ny * 1.2;

            ball.vx += nx * 4; ball.vy += ny * 4; // Softer bounce
            this.hitFlash = 15;
            score += 250;
            playSound('bumper');

            // Juice: Screen Shake & Particles
            screenShake = 8;
            spawnParticles(this.x + nx * this.radius, this.y + ny * this.radius, '#ccff00', 15);
            floatingTexts.push({ x: this.x, y: this.y - 40, text: "+250", life: 60 });
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        if (this.hitFlash > 0) { ctx.scale(1.1, 1.1); this.hitFlash--; }

        // Glowing Sour Ring
        ctx.shadowColor = '#8a2be2'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#110022';
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();

        ctx.lineWidth = 12;
        ctx.strokeStyle = '#8a2be2';
        ctx.beginPath(); ctx.arc(0, 0, this.radius - 6, 0, Math.PI * 2); ctx.stroke();

        ctx.shadowBlur = 0;

        // Sour Citrus Segments
        ctx.fillStyle = '#39ff14';
        for (let i = 0; i < 6; i++) {
            ctx.rotate(Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, this.radius - 12, 0.08, (Math.PI / 3) - 0.08);
            ctx.fill();
        }

        ctx.fillStyle = '#ccff00';
        ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.25, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// --- PARTICLES & JUICE ---
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1.0, color: color, size: Math.random() * 6 + 4
        });
    }
}

function updateAndDrawJuice(ctx) {
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // Floating Text
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 1; ft.life--;
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.globalAlpha = ft.life / 60;
        ctx.fillStyle = '#ccff00';
        ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 10;
        ctx.font = '900 36px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
}

class Flipper {
    constructor(x, y, length, isRight) {
        this.x = x; this.y = y;
        this.length = length; // Extended length to close the middle gap
        this.isRight = isRight;
        // Resting: tips droop toward center, nearly closing the gap.
        // Pressed: a real ~100 deg swing so a lone flipper sweeps back across
        // its own side of the table instead of just wobbling near center.
        this.baseAngle = isRight ? Math.PI * 0.85 : Math.PI * 0.15;
        this.upAngle = isRight ? Math.PI * 1.4 : -Math.PI * 0.4;
        this.angle = this.baseAngle; this.width = 32; // Thicker flippers
    }
    update(isPressed) {
        this.angle += ((isPressed ? this.upAngle : this.baseAngle) - this.angle) * 0.35;
    }
    checkCollision(ball) {
        const endX = this.x + Math.cos(this.angle) * this.length;
        const endY = this.y + Math.sin(this.angle) * this.length;
        const l2 = this.length * this.length;
        let t = Math.max(0, Math.min(1, ((ball.x - this.x) * (endX - this.x) + (ball.y - this.y) * (endY - this.y)) / l2));

        const projX = this.x + t * (endX - this.x); const projY = this.y + t * (endY - this.y);
        const dx = ball.x - projX; const dy = ball.y - projY;
        const dist = Math.hypot(dx, dy);

        if (dist < ball.radius + this.width / 2) {
            const nx = dx / dist; const ny = dy / dist;
            ball.x += nx * ((ball.radius + this.width / 2) - dist);
            ball.y += ny * ((ball.radius + this.width / 2) - dist);

            const kickForce = (Math.abs(this.angle - this.upAngle) > 0.1) ? 20 * t : 0;
            const dot = ball.vx * nx + ball.vy * ny;
            if (dot < 0) { ball.vx -= dot * nx * 1.1; ball.vy -= dot * ny * 1.1; }

            const kX = Math.cos(this.angle - Math.PI/2) * (this.isRight ? -1 : 1);
            const kY = Math.sin(this.angle - Math.PI/2) * (this.isRight ? -1 : 1);

            if (kickForce > 0) { ball.vx += kX * kickForce; ball.vy -= Math.abs(kY * kickForce); }
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y); ctx.rotate(this.angle);
        ctx.shadowColor = '#ccff00'; ctx.shadowBlur = 12;

        // Sour Belt Flipper
        ctx.fillStyle = '#8a2be2';
        ctx.beginPath();
        ctx.arc(0, 0, this.width/2, Math.PI/2, Math.PI*1.5);
        ctx.lineTo(this.length, -this.width/4);
        ctx.arc(this.length, 0, this.width/4, -Math.PI/2, Math.PI/2);
        ctx.fill(); ctx.clip();

        ctx.shadowBlur = 0; ctx.lineWidth = 16;
        ctx.strokeStyle = '#39ff14'; // Neon green stripes
        for (let i = -10; i < this.length + 20; i += 25) {
            ctx.beginPath(); ctx.moveTo(i, -this.width); ctx.lineTo(i + 15, this.width); ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle = '#ccff00'; ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI*2); ctx.fill();
    }
}

// --- GAME SETUP ---
let ball = new Gumball(1860, 900);
let bumpers = [
    new Bumper(1920/2, 250, 70), new Bumper(1920/2 - 220, 400, 80), new Bumper(1920/2 + 220, 400, 80)
];
// Extended flippers to close the drain gap, making it much easier for kids
let flippers = [
    new Flipper(1920/2 - 220, 950, 240, false), new Flipper(1920/2 + 220, 950, 240, true)
];

function startGame() {
    initAudio();
    score = 0; gumballsPlayed = 1;
    ball.reset(1860, 900);
    gameState = 'PLAYING';
}

function update() {
    Input.poll();
    if (!isAudioInit && Input.actionPressed) initAudio();

    if (gameState === 'START') {
        if (Input.actionPressed) startGame();
        return;
    }

    if (!ball.active) {
        tryAgainTimer--;
        if (tryAgainTimer <= 0) {
            ball.reset(1860, 900); // Infinite Forgiveness Loop
        }
        return;
    }

    // Single button plunges OR flips depending on ball position
    if (ball.x > 1800 && ball.y > 800) {
        // Plunger
        if (Input.plungerReleased && ball.vy > -2 && Input.plungerReleaseForce > 10) {
            ball.vy = -(Input.plungerReleaseForce * 0.40); // Softer launch
            playSound('plunger');
        }
        flippers[0].update(false);
        flippers[1].update(false);
    } else {
        // Flippers - each one only answers to its own button
        flippers[0].update(Input.leftPressed);
        flippers[1].update(Input.rightPressed);
    }

    ball.update();

    bumpers.forEach(b => b.checkCollision(ball));
    flippers.forEach(f => f.checkCollision(ball));

    // Slingshot Guides
    if (ball.y > 700 && ball.y < 950) {
        if (ball.x < 500 + (ball.y - 700)*0.5) {
            ball.x = 500 + (ball.y - 700)*0.5;
            const dot = ball.vx * 0.866 + ball.vy * -0.5;
            if (dot < 0) {
                ball.vx -= dot * 0.866 * 1.2; ball.vy -= dot * -0.5 * 1.2; ball.vx += 6; ball.vy -= 3; score += 50;
                spawnParticles(ball.x, ball.y, '#8a2be2', 10); screenShake = 4;
            }
        }
        if (ball.x > 1400 - (ball.y - 700)*0.5 && ball.x < 1800) {
            ball.x = 1400 - (ball.y - 700)*0.5;
            const dot = ball.vx * -0.866 + ball.vy * -0.5;
            if (dot < 0) {
                ball.vx -= dot * -0.866 * 1.2; ball.vy -= dot * -0.5 * 1.2; ball.vx -= 6; ball.vy -= 3; score += 50;
                spawnParticles(ball.x, ball.y, '#8a2be2', 10); screenShake = 4;
            }
        }
    }
}

function drawBackground() {
    ctx.fillStyle = '#39ff14'; ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 20;
    ctx.fillRect(1800, 0, 10, 1080);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = '#8a2be2'; ctx.lineWidth = 20; ctx.lineCap = 'round';
    ctx.shadowColor = '#8a2be2'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.moveTo(0, 600); ctx.lineTo(500, 950); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1800, 600); ctx.lineTo(1300, 950); ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawVisualTelegraphs() {
    if (gameState !== 'PLAYING' || !ball.active) return;

    // Glowing Action Prompt when ball approaches flippers
    if (ball.y > 650 && ball.vy > 0 && ball.x < 1800) {
        const pulse = Math.abs(Math.sin(Date.now() / 150));
        ctx.fillStyle = `rgba(204, 255, 0, ${pulse * 0.8 + 0.2})`;
        ctx.font = '900 60px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 20;
        ctx.fillText("PRESS ANY BUTTON!", 1920/2, 750);
        ctx.shadowBlur = 0;
    }
}

function drawHUD() {
    ctx.fillStyle = '#39ff14'; ctx.font = '900 48px "Segoe UI"';
    ctx.textAlign = 'left'; ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 10;
    ctx.fillText(`SCORE: ${score.toLocaleString()}`, 40, 80);
    ctx.textAlign = 'right'; ctx.fillText(`SOURBALL: ${gumballsPlayed}`, 1760, 80);

    // AI Announcer Message
    ctx.fillStyle = '#ccff00';
    ctx.textAlign = 'center';
    ctx.font = '800 32px "Segoe UI"';
    ctx.fillText(`👑 SOUR KING: "${currentAnnouncerMessage}"`, 1920/2, 80);
    ctx.shadowBlur = 0;

    // Plunger UI
    if (ball.x > 1800 && ball.y > 800 && ball.active) {
        ctx.fillStyle = '#112200'; ctx.fillRect(1830, 1000, 60, 50);
        ctx.fillStyle = '#8a2be2';
        ctx.fillRect(1830, 1000 + (100 - Input.plungerHoldTime), 60, Input.plungerHoldTime);

        // Plunger Hint
        ctx.fillStyle = `rgba(204, 255, 0, ${Math.abs(Math.sin(Date.now()/200))})`;
        ctx.font = '900 40px "Segoe UI"'; ctx.textAlign = 'right';
        ctx.fillText("HOLD & LET GO!", 1780, 950);
    }

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0,10,0,0.7)'; ctx.fillRect(0,0,1920,1080);
        ctx.fillStyle = '#39ff14'; ctx.textAlign = 'center'; ctx.shadowBlur = 25;
        ctx.shadowColor = '#39ff14';
        ctx.font = '900 100px "Segoe UI"';
        ctx.fillText("SOUR RUSH PINBALL", 1920/2, 450);
        ctx.fillStyle = '#ccff00';
        ctx.font = '600 40px "Segoe UI"';
        ctx.fillText("PRESS ANY BUTTON TO PLAY!", 1920/2, 550);
        ctx.shadowBlur = 0;
    }

    if (tryAgainTimer > 0) {
        ctx.fillStyle = '#39ff14'; ctx.textAlign = 'center'; ctx.shadowBlur = 20;
        ctx.font = '900 80px "Segoe UI"';
        ctx.fillText("ZAP! LET'S TRY AGAIN!", 1920/2, 540);
        ctx.shadowBlur = 0;
    }
}

function loop() {
    update();
    ctx.save();

    // Apply global screen shake
    if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawVisualTelegraphs();
    bumpers.forEach(b => b.draw(ctx));
    flippers.forEach(f => f.draw(ctx));
    ball.draw(ctx);

    updateAndDrawJuice(ctx);

    drawHUD();

    ctx.restore();
    requestAnimationFrame(loop);
}

// Left/Right arrows drive their own flipper; Space/Enter/Up/Down start the
// game and can also charge the plunger.
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') Input.keys.left = true;
    else if (e.key === 'ArrowRight') Input.keys.right = true;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter') Input.keys.action = true;
});
window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') Input.keys.left = false;
    else if (e.key === 'ArrowRight') Input.keys.right = false;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter') Input.keys.action = false;
});

requestAnimationFrame(loop);
</script>
</body>
</html>
