<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUR RUSH PINBALL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background-color: #05070f;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            background: #05070f;
            max-width: 100vw; max-height: 100vh;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 60px rgba(255, 45, 149, 0.35), inset 0 0 120px rgba(138, 43, 226, 0.25);
            border-radius: 20px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1920" height="1080"></canvas>

<script>
/**
 * SOUR RUSH PINBALL - Arcade Rebuild
 * Full-height candy table, closed outlanes (flippers are physically walled
 * into the cabinet so the ball can never sneak past them), sub-stepped
 * physics to prevent tunneling through thin rails, 3-ball game with combo
 * scoring, slingshots, spinners, W-I-N rollover jackpot, multiball, extra
 * ball award, and persistent high score.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- XBOX EDGE BROWSER FOCUS FIX ---
function ensureGameFocus() { window.focus(); canvas.focus({ preventScroll: true }); }
ensureGameFocus();
window.addEventListener('load', ensureGameFocus);
document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureGameFocus(); });
window.addEventListener('gamepadconnected', ensureGameFocus);
window.addEventListener('click', ensureGameFocus);

// --- AUDIO ENGINE ---
let audioCtx = null;
let bgmInterval = null;
let musicStep = 0;
let isAudioInit = false;

function initAudio() {
    if (isAudioInit) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isAudioInit = true;
        startCandyBGM();
    } catch (e) {}
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'bumper') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'flipper') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'plunger') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'drain') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.4);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'slingshot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(700, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'spinner') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(500 + Math.random() * 200, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'rollover') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1320, now + 0.06);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'jackpot' || type === 'multiball') {
        [523, 659, 784, 1047].forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'square'; o.frequency.setValueAtTime(f, now + i * 0.07);
            g.gain.setValueAtTime(0.001, now + i * 0.07);
            g.gain.linearRampToValueAtTime(0.25, now + i * 0.07 + 0.02);
            g.gain.linearRampToValueAtTime(0.001, now + i * 0.07 + 0.25);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now + i * 0.07); o.stop(now + i * 0.07 + 0.25);
        });
    } else if (type === 'extraball') {
        [660, 880, 1100].forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(f, now + i * 0.09);
            g.gain.setValueAtTime(0.3, now + i * 0.09);
            g.gain.linearRampToValueAtTime(0.001, now + i * 0.09 + 0.2);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now + i * 0.09); o.stop(now + i * 0.09 + 0.2);
        });
    } else if (type === 'gameover') {
        [400, 350, 300, 220].forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'sawtooth'; o.frequency.setValueAtTime(f, now + i * 0.15);
            g.gain.setValueAtTime(0.3, now + i * 0.15);
            g.gain.linearRampToValueAtTime(0.001, now + i * 0.15 + 0.18);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now + i * 0.15); o.stop(now + i * 0.15 + 0.18);
        });
    }
}

function startCandyBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    const stepTime = 0.15;
    const arp = [392.00, 311.13, 392.00, 466.16, 392.00, 311.13, 261.63, 311.13];
    const bass = [98.00, 98.00, 77.78, 77.78, 116.54, 116.54, 103.83, 103.83];

    bgmInterval = setInterval(() => {
        if (!audioCtx || gameState !== 'PLAYING') return;
        const now = audioCtx.currentTime;
        const intensity = multiballActive ? 1.6 : 1.0;

        const lead = audioCtx.createOscillator();
        const leadGain = audioCtx.createGain();
        lead.type = 'square';
        lead.frequency.setValueAtTime(arp[musicStep % 8] * (multiballActive ? 2 : 1), now);
        leadGain.gain.setValueAtTime(0.04 * intensity, now);
        leadGain.gain.exponentialRampToValueAtTime(0.001, now + stepTime * 0.9);
        lead.connect(leadGain); leadGain.connect(audioCtx.destination);
        lead.start(now); lead.stop(now + stepTime * 0.9);

        if (musicStep % 2 === 0) {
            const bOsc = audioCtx.createOscillator();
            const bGain = audioCtx.createGain();
            bOsc.type = 'sawtooth';
            bOsc.frequency.setValueAtTime(bass[Math.floor(musicStep / 2) % 8], now);
            bGain.gain.setValueAtTime(0.12, now);
            bGain.gain.exponentialRampToValueAtTime(0.01, now + stepTime * 1.5);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(multiballActive ? 2200 : 1200, now);
            filter.frequency.exponentialRampToValueAtTime(100, now + stepTime);

            bOsc.connect(filter); filter.connect(bGain); bGain.connect(audioCtx.destination);
            bOsc.start(now); bOsc.stop(now + stepTime * 1.5);
        }
        musicStep++;
    }, stepTime * 1000);
}

// --- CANDY KING ANNOUNCER (local, no network dependency) ---
const ANNOUNCER = {
    start: ["WELCOME TO THE SOUR RUSH!", "LET'S GET TANGY!", "TIME TO ZAP SOME CANDY!"],
    bumper: ["ELECTRIC FLAVOR!", "TANGY HIT!", "ZAP! NICE ONE!", "SOUR POWER!"],
    combo: ["COMBO IS HEATING UP!", "KEEP THE STREAK GOING!", "SUGAR RUSH BUILDING!"],
    slingshot: ["SNAPPED BACK IN!", "RUBBER BAND ZAP!"],
    drain: ["ZAP! LET'S TRY AGAIN!", "SHAKE IT OFF, BOUNCER!", "NEXT BALL, LET'S GO!"],
    jackpot: ["W-I-N JACKPOT!!", "CANDY VAULT CRACKED!"],
    multiball: ["SUGAR RUSH MULTIBALL!!", "DOUBLE THE GUMBALLS!"],
    extraball: ["EXTRA BALL, LITTLE BOUNCER!", "BONUS GUMBALL EARNED!"],
    gameover: ["SWEET GAME, BOUNCER!", "COME BACK FOR MORE SOUR!"]
};
let currentAnnouncerMessage = ANNOUNCER.start[0];
function announce(key) {
    const list = ANNOUNCER[key];
    if (!list) return;
    currentAnnouncerMessage = list[Math.floor(Math.random() * list.length)];
}

// --- INPUT MANAGEMENT ---
const Input = {
    leftPressed: false,
    rightPressed: false,
    actionPressed: false,
    actionJustPressed: false,
    prevAction: false,
    plungerHoldTime: 0,
    plungerReleased: false,
    plungerReleaseForce: 0,
    keys: { left: false, right: false, action: false },
    poll() {
        let left = this.keys.left;
        let right = this.keys.right;
        let action = this.keys.action;

        try {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = gamepads[0];
            if (pad && pad.buttons) {
                if (pad.buttons[4]?.pressed || pad.buttons[6]?.pressed || pad.buttons[14]?.pressed) left = true;
                if (pad.buttons[5]?.pressed || pad.buttons[7]?.pressed || pad.buttons[15]?.pressed) right = true;
                for (let i = 0; i <= 3; i++) {
                    if (pad.buttons[i]?.pressed) action = true;
                }
            }
        } catch (e) {}

        this.leftPressed = left;
        this.rightPressed = right;

        const anyPressed = left || right || action;
        this.actionJustPressed = anyPressed && !this.prevAction;
        this.actionPressed = anyPressed;
        this.prevAction = anyPressed;

        const inLane = ballInLane();
        if (this.actionJustPressed && gameState === 'PLAYING' && !inLane) {
            playSound('flipper');
        }

        this.plungerReleased = false;
        if (anyPressed && inLane) {
            this.plungerHoldTime = Math.min(this.plungerHoldTime + 2, 100);
        } else if (this.plungerHoldTime > 0) {
            this.plungerReleased = true;
            this.plungerReleaseForce = this.plungerHoldTime;
            this.plungerHoldTime = 0;
        }
    }
};

function ballInLane() {
    return balls.some(b => b.active && b.x > LANE_X && b.y > PLUNGER_ZONE_Y);
}

// --- TABLE GEOMETRY ---
const CENTER_X = 920;
const LANE_X = 1800;          // divider between main field and shooter lane
const LANE_KICK_Y = 460;      // above this, a plunged ball is free to sail into the field
const LANE_GUARD_Y = 620;     // below this, the funnel wall (not the divider) is the boundary
const LANE_FLOOR_Y = 1050;
const PLUNGER_ZONE_Y = 900;

const FLIP_LEFT = { x: 610, y: 930 };
const FLIP_RIGHT = { x: 1230, y: 930 };
const FLIPPER_LEN = 225;

// Every rail on the table. The two "funnel" segments are the fix for the
// original bug: they run from the dome all the way down to the flipper
// pivot with zero gap, so there is no longer an open lane beside each
// flipper for the ball to fall through untouched. They also double as
// slingshots.
const WALLS = [
    { x1: 40, y1: 300, x2: 40, y2: LANE_GUARD_Y, sling: false },
    { x1: 40, y1: 300, x2: 160, y2: 110, sling: false },
    { x1: 160, y1: 110, x2: 420, y2: 55, sling: false },
    { x1: 420, y1: 55, x2: CENTER_X, y2: 25, sling: false },
    { x1: CENTER_X, y1: 25, x2: 1420, y2: 55, sling: false },
    { x1: 1420, y1: 55, x2: 1680, y2: 110, sling: false },
    { x1: 1680, y1: 110, x2: LANE_X, y2: 300, sling: false },
    { x1: 40, y1: LANE_GUARD_Y, x2: FLIP_LEFT.x, y2: FLIP_LEFT.y, sling: true },
    { x1: LANE_X, y1: LANE_GUARD_Y, x2: FLIP_RIGHT.x, y2: FLIP_RIGHT.y, sling: true },
];
const WALL_THICKNESS = 16;

const BUMPERS_DEF = [
    { x: CENTER_X, y: 260, radius: 68 },
    { x: 700, y: 415, radius: 74 },
    { x: 1140, y: 415, radius: 74 },
];

const SPINNERS_DEF = [
    { x: 330, y: 560 },
    { x: 1510, y: 560 },
];

const LANES_DEF = [
    { x: 300, y: 105, letter: 'W' },
    { x: CENTER_X, y: 40, letter: 'I' },
    { x: 1540, y: 105, letter: 'N' },
];

// --- PHYSICS CONSTANTS ---
const GRAVITY = 0.45;
const MAX_SPEED = 30;
const SUBSTEPS = 4;
const BALL_RADIUS = 20;
const CANDY_COLORS = ['#39ff14', '#ff2d95', '#00e5ff', '#ffdd00'];

// --- GAME STATE ---
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('sourRushHighScore') || '0', 10) || 0; } catch (e) {}
let isNewHighScore = false;
let TOTAL_BALLS = 3;
let ballsLeft = TOTAL_BALLS;
let extraBallAwarded = false;
let gameState = 'START';
let ballLostTimer = 0;
let gameOverTimer = 0;

let comboMultiplier = 1;
let comboTimer = 0;
const COMBO_WINDOW = 150;

let multiballActive = false;
let bannerText = '';
let bannerTimer = 0;

let screenShake = 0;
let particles = [];
let floatingTexts = [];

const laneLit = { W: false, I: false, N: false };
const laneCooldown = { W: 0, I: 0, N: 0 };
const spinnerCooldown = [0, 0];
const spinnerSpin = [0, 0];

const EXTRA_BALL_SCORE = 60000;

// --- SUB-STEPPED WALL COLLISION ---
function collideSegment(ball, x1, y1, x2, y2, isSling) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = len2 > 0 ? ((ball.x - x1) * dx + (ball.y - y1) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    const nx0 = ball.x - cx, ny0 = ball.y - cy;
    const dist = Math.hypot(nx0, ny0);
    const minDist = ball.radius + WALL_THICKNESS / 2;
    if (dist < minDist && dist > 0.0001) {
        const nx = nx0 / dist, ny = ny0 / dist;
        ball.x += nx * (minDist - dist);
        ball.y += ny * (minDist - dist);
        const dot = ball.vx * nx + ball.vy * ny;
        const restitution = isSling ? 0.9 : 0.55;
        if (dot < 0) {
            ball.vx -= dot * nx * (1 + restitution);
            ball.vy -= dot * ny * (1 + restitution);
            if (isSling && dot < -3) {
                ball.vx += nx * 9; ball.vy += ny * 9 - 2;
                addScore(75, cx, cy, '#ff2d95');
                playSound('slingshot');
                announce('slingshot');
                screenShake = Math.max(screenShake, 6);
                spawnParticles(cx, cy, '#ff2d95', 10);
            }
        }
    }
}

// --- SCORING ---
function addScore(base, x, y, color) {
    if (comboTimer > 0) comboMultiplier = Math.min(comboMultiplier + 1, 5);
    else comboMultiplier = 1;
    comboTimer = COMBO_WINDOW;
    const pts = base * comboMultiplier * (multiballActive ? 2 : 1);
    score += pts;
    floatingTexts.push({
        x, y: y - 40,
        text: `+${pts}` + (comboMultiplier > 1 ? ` x${comboMultiplier}` : ''),
        life: 60, color
    });
    if (comboMultiplier === 3) announce('combo');
    checkExtraBall();
}

function checkExtraBall() {
    if (!extraBallAwarded && score >= EXTRA_BALL_SCORE) {
        extraBallAwarded = true;
        ballsLeft++;
        showBanner('EXTRA BALL AWARDED!');
        playSound('extraball');
        announce('extraball');
    }
}

function showBanner(text) { bannerText = text; bannerTimer = 150; }

// --- GUMBALL ---
class Gumball {
    constructor(x, y) { this.reset(x, y); }
    reset(x, y) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.radius = BALL_RADIUS;
        this.color = CANDY_COLORS[Math.floor(Math.random() * CANDY_COLORS.length)];
        this.active = true;
        this.trail = [];
        this.laneKicked = false;
    }
    substep(dx, dy) {
        this.x += dx; this.y += dy;
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 12) this.trail.shift();

        // Outer safety edges
        if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.5; }
        if (this.x + this.radius > W) { this.x = W - this.radius; this.vx *= -0.5; }
        if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -0.5; }

        for (const seg of WALLS) collideSegment(this, seg.x1, seg.y1, seg.x2, seg.y2, seg.sling);

        // Shooter-lane divider: keep a ball already in the lane from
        // drifting back into the field...
        if (this.y > LANE_KICK_Y) {
            if (this.x > LANE_X && this.x - this.radius < LANE_X) { this.x = LANE_X + this.radius; this.vx *= -0.5; }
        }
        // ...and keep a field ball from sneaking into the lane, but only in
        // the short transition band above where the funnel wall takes over.
        if (this.y > LANE_KICK_Y && this.y < LANE_GUARD_Y) {
            if (this.x <= LANE_X && this.x + this.radius > LANE_X) { this.x = LANE_X - this.radius; this.vx *= -0.5; }
        }

        // Shooter lane floor - ball rests here while the plunger charges
        if (this.x > LANE_X && this.y + this.radius > LANE_FLOOR_Y) {
            this.y = LANE_FLOOR_Y - this.radius;
            if (this.vy > 0) this.vy = 0;
            this.laneKicked = false;
        }

        // Shooter lane rail - once a plunge clears the lane's open mouth,
        // the curved guide kicks it left into the table.
        if (this.x > LANE_X && this.y < LANE_KICK_Y && this.vy < 0 && !this.laneKicked) {
            this.vx = -10;
            this.laneKicked = true;
        }

        flippers.forEach(f => f.checkCollision(this));
        bumpers.forEach(b => b.checkCollision(this));

        if (this.y > H + 40) {
            playSound('drain');
            this.active = false;
        }
    }
    update() {
        if (!this.active) return;
        this.vy += GRAVITY;
        const speed = Math.hypot(this.vx, this.vy);
        if (speed > MAX_SPEED) {
            this.vx = (this.vx / speed) * MAX_SPEED;
            this.vy = (this.vy / speed) * MAX_SPEED;
        }
        for (let i = 0; i < SUBSTEPS && this.active; i++) {
            this.substep(this.vx / SUBSTEPS, this.vy / SUBSTEPS);
        }
    }
    draw(ctx) {
        if (!this.active) return;
        ctx.save();
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.lineWidth = this.radius * 1.3;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.stroke();
        }

        ctx.translate(this.x, this.y);
        ctx.shadowColor = this.color; ctx.shadowBlur = 18;
        const grad = ctx.createRadialGradient(-6, -6, 2, 0, 0, this.radius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.35, this.color);
        grad.addColorStop(1, '#1a1a1a');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath(); ctx.arc(-7, -7, 5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// --- BUMPER (gumdrop) ---
class Bumper {
    constructor(x, y, radius) {
        this.x = x; this.y = y; this.radius = radius;
        this.hitFlash = 0;
        this.hue = Math.random() * 360;
    }
    checkCollision(ball) {
        const dx = ball.x - this.x; const dy = ball.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < this.radius + ball.radius && dist > 0.0001) {
            const overlap = (this.radius + ball.radius) - dist;
            const nx = dx / dist; const ny = dy / dist;
            ball.x += nx * overlap; ball.y += ny * overlap;

            const dotProduct = ball.vx * nx + ball.vy * ny;
            if (dotProduct < 0) {
                ball.vx -= dotProduct * nx * 1.4; ball.vy -= dotProduct * ny * 1.4;
            }
            ball.vx += nx * 6; ball.vy += ny * 6;

            this.hitFlash = 15;
            playSound('bumper');
            announce('bumper');
            addScore(100, this.x + nx * this.radius, this.y + ny * this.radius, '#ccff00');
            screenShake = Math.max(screenShake, 8);
            spawnParticles(this.x + nx * this.radius, this.y + ny * this.radius, '#ccff00', 15);
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        if (this.hitFlash > 0) { ctx.scale(1.12, 1.12); this.hitFlash--; }

        ctx.shadowColor = '#8a2be2'; ctx.shadowBlur = 22;
        ctx.fillStyle = '#180024';
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();

        ctx.lineWidth = 12;
        ctx.strokeStyle = '#8a2be2';
        ctx.beginPath(); ctx.arc(0, 0, this.radius - 6, 0, Math.PI * 2); ctx.stroke();

        ctx.shadowBlur = 0;
        const swirl = ['#ff2d95', '#39ff14', '#00e5ff', '#ffdd00', '#ff2d95', '#39ff14'];
        for (let i = 0; i < 6; i++) {
            ctx.rotate(Math.PI / 3);
            ctx.fillStyle = swirl[i];
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, this.radius - 12, 0.08, (Math.PI / 3) - 0.08);
            ctx.fill();
        }

        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// --- FLIPPER ---
class Flipper {
    constructor(x, y, length, isRight) {
        this.x = x; this.y = y;
        this.length = length;
        this.isRight = isRight;
        this.baseAngle = isRight ? Math.PI * 0.86 : Math.PI * 0.14;
        this.upAngle = isRight ? Math.PI * 1.38 : -Math.PI * 0.38;
        this.angle = this.baseAngle; this.width = 34;
    }
    update(isPressed) {
        this.angle += ((isPressed ? this.upAngle : this.baseAngle) - this.angle) * 0.4;
    }
    checkCollision(ball) {
        const endX = this.x + Math.cos(this.angle) * this.length;
        const endY = this.y + Math.sin(this.angle) * this.length;
        const l2 = this.length * this.length;
        let t = Math.max(0, Math.min(1, ((ball.x - this.x) * (endX - this.x) + (ball.y - this.y) * (endY - this.y)) / l2));

        const projX = this.x + t * (endX - this.x); const projY = this.y + t * (endY - this.y);
        const dx = ball.x - projX; const dy = ball.y - projY;
        const dist = Math.hypot(dx, dy);

        if (dist < ball.radius + this.width / 2 && dist > 0.0001) {
            const nx = dx / dist; const ny = dy / dist;
            ball.x += nx * ((ball.radius + this.width / 2) - dist);
            ball.y += ny * ((ball.radius + this.width / 2) - dist);

            const kickForce = (Math.abs(this.angle - this.upAngle) > 0.12) ? 24 * t : 0;
            const dot = ball.vx * nx + ball.vy * ny;
            if (dot < 0) { ball.vx -= dot * nx * 1.2; ball.vy -= dot * ny * 1.2; }

            const kX = Math.cos(this.angle - Math.PI / 2) * (this.isRight ? -1 : 1);
            const kY = Math.sin(this.angle - Math.PI / 2) * (this.isRight ? -1 : 1);

            if (kickForce > 0) { ball.vx += kX * kickForce; ball.vy -= Math.abs(kY * kickForce); }
        }
    }
    capsulePath(ctx, length, width) {
        ctx.beginPath();
        ctx.arc(0, 0, width / 2, Math.PI / 2, Math.PI * 1.5);
        ctx.lineTo(length, -width / 4);
        ctx.arc(length, 0, width / 4, -Math.PI / 2, Math.PI / 2);
        ctx.closePath();
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y); ctx.rotate(this.angle);
        ctx.shadowColor = '#ff2d95'; ctx.shadowBlur = 14;

        ctx.fillStyle = '#f4f4f8';
        this.capsulePath(ctx, this.length, this.width);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ff2d95';
        this.capsulePath(ctx, this.length * 0.96, this.width * 0.5);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.shadowColor = '#ccff00'; ctx.shadowBlur = 8;
        ctx.fillStyle = '#ccff00';
        ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.arc(this.x, this.y, 5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// --- PARTICLES & JUICE ---
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1.0, color, size: Math.random() * 6 + 4
        });
    }
}

function updateAndDrawJuice(ctx) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.15;
        p.life -= 0.04;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 1; ft.life--;
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.globalAlpha = ft.life / 60;
        ctx.fillStyle = ft.color || '#ccff00';
        ctx.shadowColor = ft.color || '#39ff14'; ctx.shadowBlur = 10;
        ctx.font = '900 36px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
}

// --- GAME OBJECTS ---
let balls = [];
let bumpers = BUMPERS_DEF.map(b => new Bumper(b.x, b.y, b.radius));
let flippers = [
    new Flipper(FLIP_LEFT.x, FLIP_LEFT.y, FLIPPER_LEN, false),
    new Flipper(FLIP_RIGHT.x, FLIP_RIGHT.y, FLIPPER_LEN, true)
];

function serveBall() {
    const b = new Gumball(1860, 950);
    balls.push(b);
}

function dropInBall() {
    const b = new Gumball(CENTER_X + (Math.random() * 200 - 100), 90);
    b.vx = (Math.random() * 4 - 2);
    b.vy = 2;
    b.laneKicked = true;
    balls.push(b);
}

function startGame() {
    initAudio();
    score = 0; ballsLeft = TOTAL_BALLS; extraBallAwarded = false;
    isNewHighScore = false;
    comboMultiplier = 1; comboTimer = 0;
    multiballActive = false;
    laneLit.W = laneLit.I = laneLit.N = false;
    balls = [];
    serveBall();
    gameState = 'PLAYING';
    announce('start');
}

function resetLanesIfComplete() {
    if (laneLit.W && laneLit.I && laneLit.N) {
        addScore(5000, CENTER_X, 150, '#ffdd00');
        showBanner('W-I-N JACKPOT!');
        playSound('jackpot');
        announce('jackpot');
        laneLit.W = laneLit.I = laneLit.N = false;
        if (balls.length < 2) {
            multiballActive = true;
            dropInBall();
            showBanner('SUGAR RUSH MULTIBALL!');
            playSound('multiball');
            announce('multiball');
        }
    }
}

function endBall() {
    ballsLeft--;
    multiballActive = false;
    if (ballsLeft > 0) {
        gameState = 'BALL_LOST';
        ballLostTimer = 90;
        announce('drain');
    } else {
        gameState = 'GAME_OVER';
        gameOverTimer = 0;
        isNewHighScore = score > highScore;
        if (isNewHighScore) {
            highScore = score;
            try { localStorage.setItem('sourRushHighScore', String(highScore)); } catch (e) {}
        }
        playSound('gameover');
        announce('gameover');
    }
}

function update() {
    Input.poll();
    if (!isAudioInit && Input.actionPressed) initAudio();

    if (bannerTimer > 0) bannerTimer--;
    if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) comboMultiplier = 1; }

    if (gameState === 'START') {
        if (Input.actionJustPressed) startGame();
        return;
    }
    if (gameState === 'GAME_OVER') {
        gameOverTimer++;
        if (gameOverTimer > 60 && Input.actionJustPressed) gameState = 'START';
        return;
    }
    if (gameState === 'BALL_LOST') {
        ballLostTimer--;
        if (ballLostTimer <= 0) {
            balls = [];
            serveBall();
            gameState = 'PLAYING';
        }
        return;
    }

    // PLAYING
    const inLane = ballInLane();
    if (inLane) {
        const laneBall = balls.find(b => b.active && b.x > LANE_X && b.y > PLUNGER_ZONE_Y);
        if (Input.plungerReleased && laneBall && Input.plungerReleaseForce > 10) {
            laneBall.vy = -(Input.plungerReleaseForce * 0.55);
            playSound('plunger');
        }
        flippers[0].update(false);
        flippers[1].update(false);
    } else {
        flippers[0].update(Input.leftPressed);
        flippers[1].update(Input.rightPressed);
    }

    for (const ball of balls) {
        if (!ball.active) continue;
        ball.update();

        // Spinners - free-passing scoring triggers
        SPINNERS_DEF.forEach((s, i) => {
            const d = Math.hypot(ball.x - s.x, ball.y - s.y);
            if (d < 46 && spinnerCooldown[i] <= 0) {
                spinnerCooldown[i] = 14;
                spinnerSpin[i] = 1;
                addScore(40, s.x, s.y, '#00e5ff');
                playSound('spinner');
            }
        });

        // Top rollover lanes
        LANES_DEF.forEach(l => {
            const d = Math.hypot(ball.x - l.x, ball.y - l.y);
            if (d < 85 && laneCooldown[l.letter] <= 0) {
                laneCooldown[l.letter] = 60;
                if (!laneLit[l.letter]) {
                    laneLit[l.letter] = true;
                    addScore(200, l.x, l.y, '#ffdd00');
                    playSound('rollover');
                    resetLanesIfComplete();
                }
            }
        });
    }

    for (let i = 0; i < SPINNERS_DEF.length; i++) {
        if (spinnerCooldown[i] > 0) spinnerCooldown[i]--;
        spinnerSpin[i] *= 0.92;
    }
    for (const k of ['W', 'I', 'N']) if (laneCooldown[k] > 0) laneCooldown[k]--;

    balls = balls.filter(b => b.active);
    if (balls.length === 0) endBall();
}

// --- DRAWING ---
function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a0033');
    grad.addColorStop(0.5, '#0d0018');
    grad.addColorStop(1, '#05070f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // faint candy swirl backdrop
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#ff2d95';
    for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(CENTER_X, 500, 120 + i * 90, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();

    // shooter lane
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(LANE_X, 0, W - LANE_X, H);

    // rails (licorice twist)
    ctx.save();
    for (const seg of WALLS) {
        ctx.lineWidth = WALL_THICKNESS;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = seg.sling ? '#ff2d95' : '#8a2be2';
        ctx.shadowColor = seg.sling ? '#ff2d95' : '#8a2be2';
        ctx.shadowBlur = seg.sling ? 20 : 12;
        ctx.beginPath(); ctx.moveTo(seg.x1, seg.y1); ctx.lineTo(seg.x2, seg.y2); ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.setLineDash([10, 14]);
        ctx.beginPath(); ctx.moveTo(seg.x1, seg.y1); ctx.lineTo(seg.x2, seg.y2); ctx.stroke();
        ctx.setLineDash([]);
    }
    ctx.restore();

    // shooter lane divider
    ctx.save();
    ctx.strokeStyle = '#39ff14'; ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 15;
    ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(LANE_X, LANE_KICK_Y); ctx.lineTo(LANE_X, LANE_FLOOR_Y); ctx.stroke();
    ctx.restore();
}

function drawSpinners(ctx) {
    SPINNERS_DEF.forEach((s, i) => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(Date.now() / 400 + spinnerSpin[i] * 5);
        ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 14;
        ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(0, 38); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-14, -20); ctx.lineTo(14, 20); ctx.stroke();
        ctx.restore();
    });
}

function drawLanes(ctx) {
    LANES_DEF.forEach(l => {
        const lit = laneLit[l.letter];
        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.shadowColor = lit ? '#ffdd00' : '#555';
        ctx.shadowBlur = lit ? 20 : 4;
        ctx.fillStyle = lit ? '#ffdd00' : 'rgba(255,255,255,0.15)';
        ctx.font = '900 40px "Segoe UI"';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(l.letter, 0, 0);
        ctx.restore();
    });
}

function drawMarqueeBorder(ctx) {
    const n = 60;
    const t = Date.now() / 200;
    const perim = 2 * (W + H);
    for (let i = 0; i < n; i++) {
        const d = (i / n) * perim;
        let x, y;
        if (d < W) { x = d; y = 4; }
        else if (d < W + H) { x = W - 4; y = d - W; }
        else if (d < 2 * W + H) { x = W - (d - W - H); y = H - 4; }
        else { x = 4; y = H - (d - 2 * W - H); }
        const lit = Math.floor((t + i) / 3) % 2 === 0;
        ctx.fillStyle = lit ? (i % 2 === 0 ? '#ff2d95' : '#ffdd00') : 'rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    }
}

function drawHUD() {
    ctx.fillStyle = '#39ff14'; ctx.font = '900 44px "Segoe UI"';
    ctx.textAlign = 'left'; ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 10;
    ctx.fillText(`SCORE ${score.toLocaleString()}`, 40, 70);

    ctx.font = '700 26px "Segoe UI"';
    ctx.fillStyle = '#ccff00'; ctx.shadowColor = '#ccff00';
    ctx.fillText(`HIGH ${highScore.toLocaleString()}`, 40, 105);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#39ff14'; ctx.font = '900 44px "Segoe UI"'; ctx.shadowColor = '#39ff14';
    ctx.fillText(`BALL ${Math.min(TOTAL_BALLS - ballsLeft + 1, TOTAL_BALLS)} / ${TOTAL_BALLS}`, 1880, 70);

    if (comboMultiplier > 1 && comboTimer > 0) {
        ctx.font = '900 30px "Segoe UI"'; ctx.fillStyle = '#ff2d95'; ctx.shadowColor = '#ff2d95';
        ctx.fillText(`COMBO x${comboMultiplier}`, 1880, 105);
    }
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ccff00';
    ctx.textAlign = 'center';
    ctx.font = '800 30px "Segoe UI"';
    ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 8;
    ctx.fillText(`👑 SOUR KING: "${currentAnnouncerMessage}"`, CENTER_X, 730 + 300);
    ctx.shadowBlur = 0;

    if (bannerTimer > 0) {
        const pulse = Math.abs(Math.sin(Date.now() / 120));
        ctx.fillStyle = `rgba(255, 221, 0, ${0.5 + pulse * 0.5})`;
        ctx.font = '900 64px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 24;
        ctx.fillText(bannerText, CENTER_X, 380);
        ctx.shadowBlur = 0;
    }

    const inLane = ballInLane();
    if (inLane && gameState === 'PLAYING') {
        ctx.fillStyle = '#112200'; ctx.fillRect(1830, 1000, 60, 50);
        ctx.fillStyle = '#8a2be2';
        ctx.fillRect(1830, 1000 + (100 - Input.plungerHoldTime), 60, Input.plungerHoldTime);

        ctx.fillStyle = `rgba(204, 255, 0, ${Math.abs(Math.sin(Date.now() / 200))})`;
        ctx.font = '900 36px "Segoe UI"'; ctx.textAlign = 'right';
        ctx.shadowColor = '#ccff00'; ctx.shadowBlur = 10;
        ctx.fillText("HOLD & LET GO!", 1790, 950);
        ctx.shadowBlur = 0;
    }

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0,0,10,0.72)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#39ff14'; ctx.textAlign = 'center'; ctx.shadowBlur = 26;
        ctx.shadowColor = '#39ff14';
        const wobble = Math.sin(Date.now() / 400) * 4;
        ctx.font = '900 110px "Segoe UI"';
        ctx.fillText("SOUR RUSH PINBALL", CENTER_X, 420 + wobble);
        ctx.fillStyle = '#ff2d95';
        ctx.font = '700 32px "Segoe UI"';
        ctx.shadowColor = '#ff2d95'; ctx.shadowBlur = 12;
        ctx.fillText("CANDY ARCADE EDITION", CENTER_X, 480);
        ctx.fillStyle = '#ccff00';
        ctx.font = '600 40px "Segoe UI"';
        ctx.shadowColor = '#ccff00';
        const pulse = Math.abs(Math.sin(Date.now() / 250));
        ctx.globalAlpha = 0.6 + pulse * 0.4;
        ctx.fillText("PRESS ANY BUTTON TO PLAY", CENTER_X, 580);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#ffdd00'; ctx.font = '700 34px "Segoe UI"';
        ctx.fillText(`HIGH SCORE: ${highScore.toLocaleString()}`, CENTER_X, 650);
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '500 24px "Segoe UI"';
        ctx.fillText("LB/LT — LEFT FLIPPER      RB/RT — RIGHT FLIPPER      HOLD & RELEASE TO LAUNCH", CENTER_X, 720);
        ctx.shadowBlur = 0;
    }

    if (gameState === 'BALL_LOST') {
        ctx.fillStyle = '#39ff14'; ctx.textAlign = 'center'; ctx.shadowBlur = 20;
        ctx.shadowColor = '#39ff14';
        ctx.font = '900 74px "Segoe UI"';
        ctx.fillText(currentAnnouncerMessage, CENTER_X, 500);
        ctx.shadowBlur = 0;
    }

    if (gameState === 'GAME_OVER') {
        ctx.fillStyle = 'rgba(0,0,10,0.78)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff2d95'; ctx.textAlign = 'center'; ctx.shadowBlur = 26;
        ctx.shadowColor = '#ff2d95';
        ctx.font = '900 90px "Segoe UI"';
        ctx.fillText("GAME OVER", CENTER_X, 400);
        ctx.fillStyle = '#39ff14'; ctx.font = '900 56px "Segoe UI"';
        ctx.shadowColor = '#39ff14';
        ctx.fillText(`FINAL SCORE: ${score.toLocaleString()}`, CENTER_X, 480);
        if (isNewHighScore) {
            const pulse = Math.abs(Math.sin(Date.now() / 150));
            ctx.fillStyle = `rgba(255,221,0,${0.6 + pulse * 0.4})`;
            ctx.font = '900 48px "Segoe UI"';
            ctx.shadowColor = '#ffdd00';
            ctx.fillText("✨ NEW HIGH SCORE! ✨", CENTER_X, 550);
        } else {
            ctx.fillStyle = '#ccff00'; ctx.font = '600 34px "Segoe UI"';
            ctx.shadowColor = '#ccff00';
            ctx.fillText(`HIGH SCORE: ${highScore.toLocaleString()}`, CENTER_X, 550);
        }
        if (gameOverTimer > 60) {
            ctx.fillStyle = '#ffffff'; ctx.font = '600 32px "Segoe UI"';
            ctx.globalAlpha = 0.6 + Math.abs(Math.sin(Date.now() / 250)) * 0.4;
            ctx.shadowBlur = 0;
            ctx.fillText("PRESS ANY BUTTON TO PLAY AGAIN", CENTER_X, 640);
            ctx.globalAlpha = 1;
        }
        ctx.shadowBlur = 0;
    }
}

function loop() {
    update();
    ctx.save();

    if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }

    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawLanes(ctx);
    drawSpinners(ctx);
    bumpers.forEach(b => b.draw(ctx));
    flippers.forEach(f => f.draw(ctx));
    balls.forEach(b => b.draw(ctx));

    updateAndDrawJuice(ctx);
    drawMarqueeBorder(ctx);
    drawHUD();

    ctx.restore();
    requestAnimationFrame(loop);
}

// Left/Right arrows drive their own flipper; Space/Enter/Up/Down start the
// game and can also charge the plunger.
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') Input.keys.left = true;
    else if (e.key === 'ArrowRight') Input.keys.right = true;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter') Input.keys.action = true;
});
window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') Input.keys.left = false;
    else if (e.key === 'ArrowRight') Input.keys.right = false;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter') Input.keys.action = false;
});

requestAnimationFrame(loop);
</script>
