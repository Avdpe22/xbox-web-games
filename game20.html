<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRIDIRON GAUNTLET: PLAYBOOK PURSUIT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #01160a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Impact', sans-serif;
        }
        #gameCanvas {
            background: radial-gradient(circle at center, #023818 0%, #01160a 100%);
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 50px rgba(0, 255, 100, 0.2);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1920" height="1080"></canvas>

<script>
/**
 * GRIDIRON GAUNTLET: PLAYBOOK PURSUIT
 * Optimized for Xbox Series S Controller
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- AUDIO ENGINE ---
let audioCtx = null;
function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'whistle') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.linearRampToValueAtTime(1400, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'pass') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'tackle') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'collect') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    }
}

// --- INPUT MANAGEMENT ---
const Input = {
    pads: {},
    keys: { left: false, right: false, up: false, down: false, pass: false, stiffArm: false, juke: false, sprint: false },
    poll() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i]) this.pads[i] = gamepads[i];
        }
    },
    getState() {
        const pad = this.pads[0];
        let vx = 0, vy = 0, aimX = 0, aimY = -1;
        let pass = false, stiffArm = false, juke = false, sprint = false;

        if (pad) {
            if (Math.abs(pad.axes[0]) > 0.2) vx = pad.axes[0];
            if (Math.abs(pad.axes[1]) > 0.2) vy = pad.axes[1];
            if (pad.buttons[14]?.pressed) vx = -1;
            if (pad.buttons[15]?.pressed) vx = 1;
            if (pad.buttons[12]?.pressed) vy = -1;
            if (pad.buttons[13]?.pressed) vy = 1;

            if (Math.hypot(pad.axes[2], pad.axes[3]) > 0.3) {
                aimX = pad.axes[2];
                aimY = pad.axes[3];
            }

            pass = pad.buttons[7]?.pressed || pad.buttons[0]?.pressed;      // RT / A
            stiffArm = pad.buttons[6]?.pressed || pad.buttons[1]?.pressed;  // LT / B
            juke = pad.buttons[4]?.pressed || pad.buttons[2]?.pressed;      // RB / X
            sprint = pad.buttons[5]?.pressed || pad.buttons[3]?.pressed;    // LB / Y
        }

        if (this.keys.left) vx = -1;
        if (this.keys.right) vx = 1;
        if (this.keys.up) vy = -1;
        if (this.keys.down) vy = 1;
        if (this.keys.pass) pass = true;
        if (this.keys.stiffArm) stiffArm = true;
        if (this.keys.juke) juke = true;
        if (this.keys.sprint) sprint = true;

        return { vx, vy, aimX, aimY, pass, stiffArm, juke, sprint };
    }
};

// --- MAZE DEFINITION ---
const TILE_SIZE = 80;
const MAZE_W = 24;
const MAZE_H = 13;
// 0=Wall, 1=Dot, 2=Empty, 3=Trophy
const mazeLayout = [
    "000000000000000000000000",
    "031111111100001111111130",
    "010001000100001000100010",
    "010001000111111000100010",
    "011111000100001000111110",
    "010001111111111111100010",
    "010001000022220000100010",
    "011111000022220000111110",
    "010001111111111111100010",
    "010001000010010000100010",
    "010001000010010000100010",
    "031111111111111111111130",
    "000000000000000000000000"
];

let grid = [];
let collectibles = [];
let totalDots = 0;

function buildMaze() {
    grid = [];
    collectibles = [];
    totalDots = 0;
    for (let y = 0; y < MAZE_H; y++) {
        let row = [];
        for (let x = 0; x < MAZE_W; x++) {
            let type = parseInt(mazeLayout[y][x]);
            row.push(type === 0 ? 1 : 0); // 1 = solid wall
            if (type === 1 || type === 3) {
                collectibles.push({ x: x * TILE_SIZE + TILE_SIZE/2, y: y * TILE_SIZE + TILE_SIZE/2, type: type, active: true });
                if (type === 1) totalDots++;
            }
        }
        grid.push(row);
    }
}

// --- ENTITIES ---

// Procedural Art Helper (Decoupled from Hitbox)
function drawFootballPlayer(ctx, x, y, angle, colorMain, colorSec, number, state, walkCycle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // Leg movement (IK simulation)
    const legSwing = Math.sin(walkCycle) * 12;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(-10, legSwing, 6, 12, 0, 0, Math.PI*2); ctx.fill(); // Left leg
    ctx.beginPath(); ctx.ellipse(10, -legSwing, 6, 12, 0, 0, Math.PI*2); ctx.fill(); // Right leg

    // Shoulder Pads
    ctx.fillStyle = colorSec;
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 14, 0, 0, Math.PI*2); ctx.fill();
    
    // Jersey
    ctx.fillStyle = colorMain;
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 12, 0, 0, Math.PI*2); ctx.fill();

    // Helmet
    ctx.fillStyle = colorMain;
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(0, 4, 14, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Center Stripe
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-2, -10, 4, 28);

    // Facemask
    ctx.strokeStyle = '#aaaaaa';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-10, 15); ctx.lineTo(10, 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, 18); ctx.lineTo(6, 18); ctx.stroke();

    // Arms
    if (state === 'stiffarm') {
        ctx.fillStyle = '#ffccaa';
        ctx.beginPath(); ctx.ellipse(15, 15, 6, 18, -Math.PI/4, 0, Math.PI*2); ctx.fill(); // Extended arm
    } else {
        ctx.fillStyle = colorSec;
        ctx.beginPath(); ctx.ellipse(-20, 0, 6, 10, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(20, 0, 6, 10, 0, 0, Math.PI*2); ctx.fill();
    }

    // Number
    ctx.translate(0, -6);
    ctx.rotate(-angle);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px Impact';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(number, 0, 0);

    ctx.restore();
}

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 16; // Logical collision radius
        this.baseSpeed = 5;
        this.speed = this.baseSpeed;
        this.angle = 0;
        this.aimAngle = 0;
        
        this.stamina = 100;
        this.stiffArmTimer = 0;
        this.passCooldown = 0;
        this.jukeTimer = 0;
        this.jukeCooldown = 0;
        
        this.walkCycle = 0;
    }

    update(input) {
        if (this.stiffArmTimer > 0) this.stiffArmTimer--;
        if (this.passCooldown > 0) this.passCooldown--;
        if (this.jukeCooldown > 0) this.jukeCooldown--;
        if (this.jukeTimer > 0) this.jukeTimer--;

        let curSpeed = this.speed;

        // Juke (Dash)
        if (input.juke && this.jukeCooldown <= 0 && this.stamina >= 20) {
            this.jukeTimer = 10;
            this.jukeCooldown = 60;
            this.stamina -= 20;
            createParticles(this.x, this.y, '#ffffff', 8);
        }

        // Sprint
        if (input.sprint && this.stamina > 0 && this.jukeTimer <= 0) {
            curSpeed *= 1.6;
            this.stamina -= 1;
        } else if (!input.sprint && this.stamina < 100) {
            this.stamina += 0.5;
        }

        if (this.jukeTimer > 0) curSpeed *= 2.5;

        let dx = input.vx * curSpeed;
        let dy = input.vy * curSpeed;

        if (dx !== 0 || dy !== 0) {
            this.angle = Math.atan2(dy, dx);
            this.walkCycle += curSpeed * 0.05;
        }

        // Aiming
        if (Math.hypot(input.aimX, input.aimY) > 0.2) {
            this.aimAngle = Math.atan2(input.aimY, input.aimX);
        } else {
            this.aimAngle = this.angle; // Default aim to facing
        }

        // AABB / Circle Collision with walls
        this.moveWithCollision(dx, 0);
        this.moveWithCollision(0, dy);

        // Abilities
        if (input.stiffArm && this.stiffArmTimer <= 0 && this.stamina >= 15) {
            this.stiffArmTimer = 25; // Active frames
            this.stamina -= 15;
            playSound('tackle');
            // Check hitbox collision immediately
            const reach = 40;
            const hx = this.x + Math.cos(this.aimAngle) * reach;
            const hy = this.y + Math.sin(this.aimAngle) * reach;
            
            enemies.forEach(e => {
                if (e.stunTimer <= 0 && Math.hypot(e.x - hx, e.y - hy) < e.radius + 25) {
                    e.stunTimer = 120;
                    e.x += Math.cos(this.aimAngle) * 60; // Recoil knockback
                    e.y += Math.sin(this.aimAngle) * 60;
                    createParticles(e.x, e.y, '#ffaa00', 15);
                    screenShake = 10;
                }
            });
        }

        if (input.pass && this.passCooldown <= 0) {
            this.passCooldown = 45;
            playSound('pass');
            projectiles.push(new Football(this.x, this.y, Math.cos(this.aimAngle) * 18, Math.sin(this.aimAngle) * 18));
        }

        // Collectibles
        collectibles.forEach(c => {
            if (c.active && Math.hypot(this.x - c.x, this.y - c.y) < this.radius + 15) {
                c.active = false;
                playSound('collect');
                if (c.type === 1) score += 10;
                if (c.type === 3) { score += 50; this.stamina = 100; }
                dotsCollected++;
                if (dotsCollected >= totalDots) gameState = STATES.VICTORY;
            }
        });
    }

    moveWithCollision(dx, dy) {
        let nextX = this.x + dx;
        let nextY = this.y + dy;
        
        let tileX = Math.floor(nextX / TILE_SIZE);
        let tileY = Math.floor(nextY / TILE_SIZE);

        // Simplified collision: check surrounding tiles
        let collision = false;
        for (let ty = tileY - 1; ty <= tileY + 1; ty++) {
            for (let tx = tileX - 1; tx <= tileX + 1; tx++) {
                if (ty >= 0 && ty < MAZE_H && tx >= 0 && tx < MAZE_W && grid[ty][tx] === 1) {
                    let rx = tx * TILE_SIZE;
                    let ry = ty * TILE_SIZE;
                    // AABB vs Circle
                    let testX = Math.max(rx, Math.min(nextX, rx + TILE_SIZE));
                    let testY = Math.max(ry, Math.min(nextY, ry + TILE_SIZE));
                    let dist = Math.hypot(nextX - testX, nextY - testY);
                    if (dist < this.radius) collision = true;
                }
            }
        }
        
        if (!collision) {
            this.x = nextX;
            this.y = nextY;
        }
    }

    draw(ctx) {
        // Reticle
        if (this.stiffArmTimer <= 0) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(this.x + Math.cos(this.aimAngle) * 60, this.y + Math.sin(this.aimAngle) * 60, 6, 0, Math.PI*2);
            ctx.fill();
        }

        drawFootballPlayer(ctx, this.x, this.y, this.angle, '#0044ff', '#ffffff', '12', this.stiffArmTimer > 0 ? 'stiffarm' : 'run', this.walkCycle);

        // Stiff Arm Hitbox visual tell
        if (this.stiffArmTimer > 15) {
            ctx.fillStyle = 'rgba(255, 150, 0, 0.5)';
            ctx.beginPath();
            ctx.arc(this.x + Math.cos(this.aimAngle) * 40, this.y + Math.sin(this.aimAngle) * 40, 25, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

class Enemy {
    constructor(x, y, number) {
        this.x = x;
        this.y = y;
        this.radius = 18;
        this.speed = 3.5;
        this.angle = 0;
        this.walkCycle = Math.random() * Math.PI;
        this.number = number;
        this.stunTimer = 0;
    }

    update(target) {
        if (this.stunTimer > 0) {
            this.stunTimer--;
            return;
        }

        // Simple Line of Sight / Direct Chase
        let dx = target.x - this.x;
        let dy = target.y - this.y;
        let dist = Math.hypot(dx, dy);
        
        if (dist > 0) {
            let vx = (dx / dist) * this.speed;
            let vy = (dy / dist) * this.speed;
            
            this.angle = Math.atan2(vy, vx);
            this.walkCycle += this.speed * 0.05;

            this.moveWithCollision(vx, 0);
            this.moveWithCollision(0, vy);
        }

        // Check player collision
        if (dist < this.radius + target.radius && target.jukeTimer <= 0) {
            gameState = STATES.GAMEOVER;
            playSound('whistle');
            screenShake = 20;
        }
    }

    moveWithCollision(dx, dy) {
        // Same as player
        let nextX = this.x + dx;
        let nextY = this.y + dy;
        let tileX = Math.floor(nextX / TILE_SIZE);
        let tileY = Math.floor(nextY / TILE_SIZE);
        let collision = false;
        for (let ty = tileY - 1; ty <= tileY + 1; ty++) {
            for (let tx = tileX - 1; tx <= tileX + 1; tx++) {
                if (ty >= 0 && ty < MAZE_H && tx >= 0 && tx < MAZE_W && grid[ty][tx] === 1) {
                    let rx = tx * TILE_SIZE;
                    let ry = ty * TILE_SIZE;
                    let testX = Math.max(rx, Math.min(nextX, rx + TILE_SIZE));
                    let testY = Math.max(ry, Math.min(nextY, ry + TILE_SIZE));
                    let dist = Math.hypot(nextX - testX, nextY - testY);
                    if (dist < this.radius) collision = true;
                }
            }
        }
        
        if (!collision) {
            this.x = nextX;
            this.y = nextY;
        } else {
            // Slide along walls
            this.x += (Math.random() - 0.5) * 2;
            this.y += (Math.random() - 0.5) * 2;
        }
    }

    draw(ctx) {
        if (this.stunTimer > 0) {
            ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.02) * 0.3;
        }
        drawFootballPlayer(ctx, this.x, this.y, this.angle, '#aa0000', '#222222', this.number, 'run', this.walkCycle);
        ctx.globalAlpha = 1.0;
        
        if (this.stunTimer > 0) {
            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 20px Impact';
            ctx.fillText("*STUNNED*", this.x - 30, this.y - 30);
        }
    }
}

class Football {
    constructor(x, y, vx, vy) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = 8;
        this.life = 60;
        this.rotation = 0;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += 0.4;
        this.life--;

        // Collision with walls
        let tx = Math.floor(this.x / TILE_SIZE);
        let ty = Math.floor(this.y / TILE_SIZE);
        if (ty >= 0 && ty < MAZE_H && tx >= 0 && tx < MAZE_W && grid[ty][tx] === 1) {
            this.life = 0;
            createParticles(this.x, this.y, '#664422', 5);
            return;
        }

        // Collision with enemies
        enemies.forEach(e => {
            if (e.stunTimer <= 0 && Math.hypot(this.x - e.x, this.y - e.y) < e.radius + this.radius) {
                e.stunTimer = 150;
                this.life = 0;
                playSound('tackle');
                createParticles(e.x, e.y, '#ffffff', 10);
            }
        });
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = '#8b4513';
        ctx.beginPath(); ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-6, -2, 12, 4);
        ctx.restore();
    }
}

// --- PARTICLES ---
let particles = [];
function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color,
            decay: Math.random() * 0.05 + 0.02
        });
    }
}

// --- GAME STATE ---
const STATES = { MENU: 0, PLAYING: 1, GAMEOVER: 2, VICTORY: 3 };
let gameState = STATES.MENU;
let score = 0;
let dotsCollected = 0;
let player, enemies, projectiles, screenShake;

function startGame() {
    initAudio();
    buildMaze();
    player = new Player(12 * TILE_SIZE + TILE_SIZE/2, 6 * TILE_SIZE + TILE_SIZE/2);
    enemies = [
        new Enemy(1 * TILE_SIZE + TILE_SIZE/2, 1 * TILE_SIZE + TILE_SIZE/2, '52'),
        new Enemy(22 * TILE_SIZE + TILE_SIZE/2, 1 * TILE_SIZE + TILE_SIZE/2, '54'),
        new Enemy(1 * TILE_SIZE + TILE_SIZE/2, 11 * TILE_SIZE + TILE_SIZE/2, '55'),
        new Enemy(22 * TILE_SIZE + TILE_SIZE/2, 11 * TILE_SIZE + TILE_SIZE/2, '58')
    ];
    projectiles = [];
    particles = [];
    score = 0;
    dotsCollected = 0;
    screenShake = 0;
    playSound('whistle');
    gameState = STATES.PLAYING;
}

// --- MAIN LOOP ---
function update() {
    Input.poll();
    const input = Input.getState();

    if (gameState === STATES.MENU || gameState === STATES.GAMEOVER || gameState === STATES.VICTORY) {
        if (input.pass) startGame();
        return;
    }

    player.update(input);
    enemies.forEach(e => e.update(player));
    
    for (let i = projectiles.length - 1; i >= 0; i--) {
        projectiles[i].update();
        if (projectiles[i].life <= 0) projectiles.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life -= particles[i].decay;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function drawMaze(ctx) {
    // Yard Lines
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.lineWidth = 2;
    for(let i=0; i<MAZE_W; i+=2) {
        ctx.beginPath(); ctx.moveTo(i*TILE_SIZE, 0); ctx.lineTo(i*TILE_SIZE, MAZE_H*TILE_SIZE); ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    for (let y = 0; y < MAZE_H; y++) {
        for (let x = 0; x < MAZE_W; x++) {
            if (grid[y][x] === 1) {
                // Procedural neon wall
                ctx.fillStyle = '#0a2e16';
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 3;
                ctx.strokeRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            }
        }
    }

    collectibles.forEach(c => {
        if (c.active) {
            if (c.type === 1) { // Dot (Football)
                ctx.fillStyle = '#8b4513';
                ctx.beginPath(); ctx.ellipse(c.x, c.y, 8, 4, 0, 0, Math.PI*2); ctx.fill();
            } else if (c.type === 3) { // Trophy
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.moveTo(c.x - 10, c.y - 10); ctx.lineTo(c.x + 10, c.y - 10); 
                ctx.lineTo(c.x, c.y + 15); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
    });
}

function drawHUD(ctx) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 36px Impact';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 30, 50);

    // Stamina Bar
    ctx.fillStyle = '#222';
    ctx.fillRect(1920 / 2 - 150, 20, 300, 25);
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(1920 / 2 - 150 + 2, 22, (player.stamina / 100) * 296, 21);
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px Impact';
    ctx.textAlign = 'center';
    ctx.fillText("STAMINA [LB/Y]", 1920 / 2, 40);
}

function loop() {
    update();

    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === STATES.PLAYING || gameState === STATES.GAMEOVER || gameState === STATES.VICTORY) {
        drawMaze(ctx);
        collectibles.forEach(c => { /* drawn in maze */ });
        projectiles.forEach(p => p.draw(ctx));
        enemies.forEach(e => e.draw(ctx));
        if (gameState !== STATES.GAMEOVER) player.draw(ctx);
        
        particles.forEach(pt => {
            ctx.fillStyle = pt.color; ctx.globalAlpha = pt.life;
            ctx.fillRect(pt.x, pt.y, 6, 6);
        });
        ctx.globalAlpha = 1.0;
        
        drawHUD(ctx);
    }

    if (gameState === STATES.MENU) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 90px Impact';
        ctx.textAlign = 'center';
        ctx.fillText("GRIDIRON GAUNTLET", 1920 / 2, 400);
        ctx.fillStyle = '#00ff66';
        ctx.font = '40px Impact';
        ctx.fillText("PLAYBOOK PURSUIT", 1920 / 2, 460);
        ctx.fillStyle = '#ffffff';
        ctx.font = '30px Impact';
        ctx.fillText("PRESS (RT) OR (A) TO HIKE THE BALL", 1920 / 2, 600);
    } else if (gameState === STATES.GAMEOVER) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, 1920, 1080);
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 100px Impact';
        ctx.textAlign = 'center';
        ctx.fillText("TACKLED FOR A LOSS", 1920 / 2, 450);
        ctx.fillStyle = '#ffffff';
        ctx.font = '40px Impact';
        ctx.fillText("PRESS (RT) OR (A) TO RESTART DRILL", 1920 / 2, 550);
    } else if (gameState === STATES.VICTORY) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, 1920, 1080);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 100px Impact';
        ctx.textAlign = 'center';
        ctx.fillText("TOUCHDOWN!", 1920 / 2, 450);
        ctx.fillStyle = '#ffffff';
        ctx.font = '40px Impact';
        ctx.fillText(`FINAL SCORE: ${score}`, 1920 / 2, 530);
        ctx.fillText("PRESS (RT) OR (A) TO PLAY AGAIN", 1920 / 2, 600);
    }

    ctx.restore();
    requestAnimationFrame(loop);
}

// Keyboard Fallback for testing without Xbox Controller
window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'w' || e.key === 'ArrowUp') Input.keys.up = true;
    if (k === 's' || e.key === 'ArrowDown') Input.keys.down = true;
    if (k === 'a' || e.key === 'ArrowLeft') Input.keys.left = true;
    if (k === 'd' || e.key === 'ArrowRight') Input.keys.right = true;
    if (e.code === 'Space') Input.keys.pass = true;
    if (k === 'q') Input.keys.stiffArm = true;
    if (k === 'e') Input.keys.juke = true;
    if (k === 'shift') Input.keys.sprint = true;
});
window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'w' || e.key === 'ArrowUp') Input.keys.up = false;
    if (k === 's' || e.key === 'ArrowDown') Input.keys.down = false;
    if (k === 'a' || e.key === 'ArrowLeft') Input.keys.left = false;
    if (k === 'd' || e.key === 'ArrowRight') Input.keys.right = false;
    if (e.code === 'Space') Input.keys.pass = false;
    if (k === 'q') Input.keys.stiffArm = false;
    if (k === 'e') Input.keys.juke = false;
    if (k === 'shift') Input.keys.sprint = false;
});

// PC Mouse Aiming Fallback
window.addEventListener('mousemove', e => {
    if (Input.pads[0]) return; 
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mouseX = (e.clientX - rect.left) * scaleX;
    const mouseY = (e.clientY - rect.top) * scaleY;
    
    if (player) {
        const dx = mouseX - player.x;
        const dy = mouseY - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
            Input.keys.aimX = dx / dist;
            Input.keys.aimY = dy / dist;
        }
    }
});

const originalGetState = Input.getState.bind(Input);
Input.getState = function() {
    let state = originalGetState();
    if (!this.pads[0] && this.keys.aimX !== undefined) {
        state.aimX = this.keys.aimX;
        state.aimY = this.keys.aimY;
    }
    return state;
};

requestAnimationFrame(loop);
</script>
