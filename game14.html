<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Gate Siege</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #121214; color: #e0e0e0; font-family: 'Georgia', serif; user-select: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let dpr = window.devicePixelRatio || 1;
        let logicalWidth = window.innerWidth;
        let logicalHeight = window.innerHeight;

        function applyCanvasSize() {
            dpr = window.devicePixelRatio || 1;
            logicalWidth = window.innerWidth;
            logicalHeight = window.innerHeight;
            canvas.width = Math.round(logicalWidth * dpr);
            canvas.height = Math.round(logicalHeight * dpr);
            canvas.style.width = logicalWidth + 'px';
            canvas.style.height = logicalHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        applyCanvasSize();

        // ============================================================
        // GAME STATE
        // ============================================================
        let gameState = 'MENU';
        let mode = null; 
        let menuIndex = 0;
        let menuAxisReady = true;
        let level = 1;
        let score = 0;
        const menuButtons = {}; // <--- THIS WAS MISSING!

        const MENU_OPTIONS = [
            { id: '1p', title: 'SOLO CRUSADE', color: '#00aaff', subtitle: 'Storm the dragon gates alone.', hint: '1 Player' },
            { id: '2p', title: 'CO-OP SIEGE', color: '#ffaa00', subtitle: 'Two knights, one objective: Break the door.', hint: '2 Players (Controllers recommended)' }
        ];

        // ============================================================
        // ENTITIES & TUNING
        // ============================================================
        const PLAYER_SPEED = 4.5;
        const FIRE_SPEED = 6;
        const BOLT_SPEED = 15;
        
        // Attack Cooldowns (Frames at 60FPS)
        const CD_SWORD = 40;   
        const CD_SPEAR = 50;   
        const CD_CROSSBOW = 75; 

        // Attack Damages
        const DMG_SWORD = 40;
        const DMG_SPEAR = 25;
        const DMG_CROSSBOW = 15;

        let players = [];
        let dragons = [];
        let dragonSlots = [];
        let projectiles = [];
        let activeMeleeHitboxes = [];
        let particles = [];
        let shakeTime = 0;

        let door = { x: 0, y: 0, w: 200, h: 80, hp: 1000, maxHp: 1000 };

        function initMode(selectedMode, isNextLevel = false) {
            mode = selectedMode;
            if (!isNextLevel) {
                level = 1;
                score = 0;
            }

            door.w = 240;
            door.h = 80;
            door.x = logicalWidth / 2 - door.w / 2;
            door.y = 20;
            door.maxHp = 800 + (level * 400);
            door.hp = door.maxHp;

            projectiles = [];
            activeMeleeHitboxes = [];
            particles = [];

            // Setup Players
            if (!isNextLevel) {
                players = [];
                players.push(createPlayer(1, '#00aaff', logicalWidth / 2 - 50, logicalHeight - 100));
                if (mode === '2p') {
                    players.push(createPlayer(2, '#ffaa00', logicalWidth / 2 + 50, logicalHeight - 100));
                }
            } else {
                players.forEach(p => {
                    p.x = logicalWidth / 2 + (p.id === 1 ? -50 : 50);
                    p.y = logicalHeight - 100;
                    p.hp = Math.min(p.maxHp, p.hp + 50); // heal between levels
                });
            }

            // Setup Dragon Slots (Spawns horizontally)
            dragonSlots = [];
            dragons = [];
            const slotCount = Math.max(3, Math.floor(logicalWidth / 180));
            const slotWidth = logicalWidth / slotCount;
            
            for (let i = 0; i < slotCount; i++) {
                // Don't place a dragon directly in front of the door's exact center if it overlaps too much
                let cx = (i * slotWidth) + (slotWidth / 2);
                dragonSlots.push({
                    x: cx,
                    y: 110,
                    timer: Math.random() * 60, 
                    dragon: null
                });
            }

            gameState = 'PLAYING';
        }

        function createPlayer(id, color, startX, startY) {
            return {
                id: id, color: color, x: startX, y: startY, radius: 15,
                hp: 200, maxHp: 200, cooldowns: { sword: 0, spear: 0, crossbow: 0 },
                buttons: {} 
            };
        }

        function createDragon(x, y) {
            return {
                x: x, y: y, radius: 25, 
                hp: 100 + (level * 20), 
                maxHp: 100 + (level * 20),
                fireTimer: Math.random() * 100
            };
        }

        function createExplosion(x, y, color, sizeMulti = 1) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                    life: 15, color, size: (Math.random() * 4 + 2) * sizeMulti
                });
            }
        }

        // ============================================================
        // INPUT HANDLING
        // ============================================================
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function getGamepads() {
            return Array.from(navigator.getGamepads()).filter(p => p && p.mapping === 'standard');
        }

        function wasJustPressed(pad, buttonIndex, stateObj, key) {
            if (!pad) return false;
            const btn = pad.buttons[buttonIndex];
            const isPressed = !!btn && btn.pressed;
            const justPressed = isPressed && !stateObj[key];
            stateObj[key] = isPressed;
            return justPressed;
        }

        function handleMenuInput() {
            const pads = getGamepads();
            const pad = pads[0];
            
            let moveUp = keys['ArrowUp'] || keys['KeyW'];
            let moveDown = keys['ArrowDown'] || keys['KeyS'];
            let select = keys['Enter'] || keys['Space'];

            if (pad) {
                if (pad.axes[1] < -0.5 || (pad.buttons[12] && pad.buttons[12].pressed)) moveUp = true;
                if (pad.axes[1] > 0.5 || (pad.buttons[13] && pad.buttons[13].pressed)) moveDown = true;
                if (wasJustPressed(pad, 0, menuButtons, 'A')) select = true;
            } else {
                // Keyboard debounce for menu
                if (select && !menuButtons['A']) { select = true; menuButtons['A'] = true; }
                else if (!select) { menuButtons['A'] = false; select = false; }
            }

            if (!moveUp && !moveDown) menuAxisReady = true;
            else if (menuAxisReady) {
                menuIndex = (menuIndex + (moveDown ? 1 : -1) + MENU_OPTIONS.length) % MENU_OPTIONS.length;
                menuAxisReady = false;
            }

            if (select) {
                initMode(MENU_OPTIONS[menuIndex].id);
            }
        }

        function handlePlayerInput() {
            const pads = getGamepads();

            players.forEach((p, idx) => {
                if (p.hp <= 0) return;
                let pad = pads[idx];
                
                let vx = 0, vy = 0;
                let atkSword = false, atkSpear = false, atkCrossbow = false;

                // Keyboard Fallback for Player 1
                if (idx === 0 && !pad) {
                    if (keys['ArrowLeft'] || keys['KeyA']) vx = -1;
                    if (keys['ArrowRight'] || keys['KeyD']) vx = 1;
                    if (keys['ArrowUp'] || keys['KeyW']) vy = -1;
                    if (keys['ArrowDown'] || keys['KeyS']) vy = 1;
                    if (keys['KeyJ']) atkSword = true;
                    if (keys['KeyK']) atkSpear = true;
                    if (keys['KeyL'] || keys['Space']) atkCrossbow = true;
                }

                // Gamepad Input
                if (pad) {
                    if (Math.abs(pad.axes[0]) > 0.2) vx = pad.axes[0];
                    if (Math.abs(pad.axes[1]) > 0.2) vy = pad.axes[1];
                    if (pad.buttons[2].pressed) atkSword = true;    // X Button
                    if (pad.buttons[3].pressed) atkSpear = true;    // Y Button
                    if (pad.buttons[5].pressed) atkCrossbow = true; // RB Button
                }

                // Movement
                p.x += vx * PLAYER_SPEED;
                p.y += vy * PLAYER_SPEED;

                // Bounds
                p.x = Math.max(p.radius, Math.min(logicalWidth - p.radius, p.x));
                p.y = Math.max(150, Math.min(logicalHeight - p.radius, p.y)); // Can't go past the door line

                // Cooldowns
                if (p.cooldowns.sword > 0) p.cooldowns.sword--;
                if (p.cooldowns.spear > 0) p.cooldowns.spear--;
                if (p.cooldowns.crossbow > 0) p.cooldowns.crossbow--;

                // Attacks (Always striking upwards)
                if (atkSword && p.cooldowns.sword <= 0) {
                    p.cooldowns.sword = CD_SWORD;
                    activeMeleeHitboxes.push({ 
                        x: p.x - 40, y: p.y - 50, w: 80, h: 40, 
                        damage: DMG_SWORD, life: 8, color: '#ffffff', owner: p 
                    });
                }
                if (atkSpear && p.cooldowns.spear <= 0) {
                    p.cooldowns.spear = CD_SPEAR;
                    activeMeleeHitboxes.push({ 
                        x: p.x - 10, y: p.y - 100, w: 20, h: 90, 
                        damage: DMG_SPEAR, life: 10, color: '#cccccc', owner: p 
                    });
                }
                if (atkCrossbow && p.cooldowns.crossbow <= 0) {
                    p.cooldowns.crossbow = CD_CROSSBOW;
                    projectiles.push({
                        x: p.x, y: p.y - 15, vx: 0, vy: -BOLT_SPEED,
                        damage: DMG_CROSSBOW, isFire: false, size: 4
                    });
                }
            });
        }

        // ============================================================
        // GAME LOGIC UPDATES
        // ============================================================
        function updateLogic() {
            handlePlayerInput();

            // Check if all players dead
            if (players.every(p => p.hp <= 0)) {
                gameState = 'GAME_OVER';
                return;
            }

            // Dragon Slot Spawning
            let spawnThreshold = Math.max(40, 200 - (level * 20)); 
            dragonSlots.forEach(slot => {
                if (!slot.dragon) {
                    slot.timer++;
                    if (slot.timer >= spawnThreshold) {
                        slot.dragon = createDragon(slot.x, slot.y);
                        dragons.push(slot.dragon);
                        slot.timer = 0;
                        createExplosion(slot.x, slot.y, '#aa0000', 1.5);
                    }
                }
            });

            // Dragon Actions
            for (let i = dragons.length - 1; i >= 0; i--) {
                let d = dragons[i];
                if (d.hp <= 0) {
                    createExplosion(d.x, d.y, '#ff4400', 2);
                    score += 100;
                    // Free up the slot
                    let slot = dragonSlots.find(s => s.x === d.x);
                    if (slot) slot.dragon = null;
                    dragons.splice(i, 1);
                    continue;
                }

                d.fireTimer--;
                if (d.fireTimer <= 0) {
                    d.fireTimer = 80 + Math.random() * 60;
                    // Shoot fire down
                    projectiles.push({
                        x: d.x, y: d.y + 15, vx: 0, vy: FIRE_SPEED,
                        damage: 15 + (level * 2), isFire: true, size: 8
                    });
                }
            }

            // Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let pr = projectiles[i];
                pr.x += pr.vx;
                pr.y += pr.vy;
                let removed = false;

                if (pr.y < 0 || pr.y > logicalHeight) {
                    projectiles.splice(i, 1);
                    continue;
                }

                if (pr.isFire) {
                    // Hit player?
                    players.forEach(p => {
                        if (p.hp > 0 && Math.hypot(p.x - pr.x, p.y - pr.y) < p.radius + pr.size) {
                            p.hp -= pr.damage;
                            createExplosion(p.x, p.y, '#ff8800', 0.8);
                            removed = true;
                            shakeTime = 5;
                        }
                    });
                } else {
                    // Hit Door?
                    if (pr.x > door.x && pr.x < door.x + door.w && pr.y > door.y && pr.y < door.y + door.h) {
                        door.hp -= pr.damage;
                        createExplosion(pr.x, pr.y, '#aaaaaa', 0.5);
                        removed = true;
                    }
                    // Hit Dragon?
                    if (!removed) {
                        dragons.forEach(d => {
                            if (Math.hypot(d.x - pr.x, d.y - pr.y) < d.radius + pr.size) {
                                d.hp -= pr.damage;
                                createExplosion(pr.x, pr.y, '#ffcc00', 0.5);
                                removed = true;
                            }
                        });
                    }
                }

                if (removed) projectiles.splice(i, 1);
            }

            // Melee Hitboxes
            for (let i = activeMeleeHitboxes.length - 1; i >= 0; i--) {
                let hb = activeMeleeHitboxes[i];
                hb.life--;
                
                // Keep attached to player moving
                if (hb.owner) {
                    if (hb.w > hb.h) { // Sword
                        hb.x = hb.owner.x - 40; hb.y = hb.owner.y - 50;
                    } else { // Spear
                        hb.x = hb.owner.x - 10; hb.y = hb.owner.y - 100;
                    }
                }

                // Check collisions against door
                if (hb.y < door.y + door.h && hb.x + hb.w > door.x && hb.x < door.x + door.w) {
                    door.hp -= hb.damage / 5; // Do damage over ticks, scale down
                    createExplosion(hb.x + hb.w/2, door.y + door.h, '#aaaaaa', 0.2);
                }

                // Check collisions against dragons
                dragons.forEach(d => {
                    if (d.x + d.radius > hb.x && d.x - d.radius < hb.x + hb.w &&
                        d.y + d.radius > hb.y && d.y - d.radius < hb.y + hb.h) {
                        d.hp -= hb.damage / 5; // Tick damage
                        createExplosion(d.x, d.y, '#ff0000', 0.2);
                    }
                });

                if (hb.life <= 0) activeMeleeHitboxes.splice(i, 1);
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Win Condition
            if (door.hp <= 0) {
                score += 5000 * level;
                gameState = 'LEVEL_CLEAR';
            }
        }

        // ============================================================
        // DRAWING
        // ============================================================
        function drawTextCentered(text, yOffset, size, color) {
            ctx.fillStyle = color; ctx.font = `bold ${size}px Georgia`;
            ctx.textAlign = 'center'; ctx.fillText(text, logicalWidth / 2, logicalHeight / 2 + yOffset);
            ctx.textAlign = 'left';
        }

        function drawGame() {
            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            // Floor
            ctx.fillStyle = '#222';
            for (let i = 0; i < logicalWidth; i+=100) {
                ctx.fillRect(i, 0, 2, logicalHeight);
            }

            ctx.save();
            if (shakeTime > 0) {
                const shakeMag = 5 * (shakeTime / 10);
                ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);
                shakeTime--;
            }

            // Draw Door
            ctx.fillStyle = '#37474f';
            ctx.fillRect(door.x, door.y, door.w, door.h);
            ctx.fillStyle = '#111';
            for (let i = 0; i < door.w; i += 20) {
                ctx.fillRect(door.x + i, door.y, 4, door.h);
            }
            // Door HP
            let doorHpPct = Math.max(0, door.hp / door.maxHp);
            ctx.fillStyle = 'red'; ctx.fillRect(door.x, door.y - 10, door.w, 6);
            ctx.fillStyle = '#ffaa00'; ctx.fillRect(door.x, door.y - 10, door.w * doorHpPct, 6);

            // Draw Dragon Slots (Empty indicators)
            dragonSlots.forEach(s => {
                if (!s.dragon) {
                    ctx.beginPath(); ctx.arc(s.x, s.y, 25, 0, Math.PI * 2);
                    ctx.strokeStyle = '#331111'; ctx.lineWidth = 2; ctx.stroke();
                }
            });

            // Draw Dragons
            dragons.forEach(d => {
                ctx.fillStyle = '#8e0000';
                ctx.beginPath(); ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ff4400'; ctx.beginPath(); ctx.arc(d.x, d.y+10, d.radius/1.5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'yellow';
                ctx.beginPath(); ctx.arc(d.x - 8, d.y - 5, 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(d.x + 8, d.y - 5, 4, 0, Math.PI * 2); ctx.fill();

                let hpPct = Math.max(0, d.hp / d.maxHp);
                ctx.fillStyle = 'red'; ctx.fillRect(d.x - 20, d.y - d.radius - 10, 40, 4);
                ctx.fillStyle = '#00ff00'; ctx.fillRect(d.x - 20, d.y - d.radius - 10, 40 * hpPct, 4);
            });

            // Draw Players
            players.forEach(p => {
                if (p.hp <= 0) return;
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath(); ctx.ellipse(p.x, p.y + p.radius, p.radius, p.radius/2, 0, 0, Math.PI*2); ctx.fill();

                // Body
                ctx.fillStyle = '#b0bec5'; 
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - 8, p.y - 8, 16, 16);
                
                // Helmet Visor
                ctx.fillStyle = '#111';
                ctx.fillRect(p.x - 10, p.y - 12, 20, 6);

                // Player HP
                let hpPct = Math.max(0, p.hp / p.maxHp);
                ctx.fillStyle = 'red'; ctx.fillRect(p.x - 15, p.y + p.radius + 5, 30, 4);
                ctx.fillStyle = '#00ff88'; ctx.fillRect(p.x - 15, p.y + p.radius + 5, 30 * hpPct, 4);
            });

            // Draw Hitboxes (Swords/Spears)
            activeMeleeHitboxes.forEach(hb => {
                ctx.fillStyle = hb.color;
                ctx.globalAlpha = hb.life / 10;
                if (hb.w > hb.h) {
                    // Sword arc style
                    ctx.beginPath();
                    ctx.ellipse(hb.x + hb.w/2, hb.y + hb.h/2, hb.w/2, hb.h/2, 0, Math.PI, 0);
                    ctx.fill();
                } else {
                    // Spear thrust style
                    ctx.beginPath();
                    ctx.moveTo(hb.x + hb.w/2, hb.y);
                    ctx.lineTo(hb.x + hb.w, hb.y + hb.h);
                    ctx.lineTo(hb.x, hb.y + hb.h);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            });

            // Draw Projectiles
            projectiles.forEach(pr => {
                ctx.fillStyle = pr.isFire ? '#ff6600' : '#eceff1';
                ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size, 0, Math.PI * 2); ctx.fill();
                if (pr.isFire) {
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size/2, 0, Math.PI * 2); ctx.fill();
                } else {
                    // Crossbow bolt trail
                    ctx.strokeStyle = '#aaaaaa'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(pr.x, pr.y); ctx.lineTo(pr.x, pr.y + 15); ctx.stroke();
                }
            });

            // Draw Particles
            particles.forEach(pt => {
                ctx.fillStyle = pt.color; ctx.globalAlpha = pt.life / 15;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();

            // HUD
            ctx.fillStyle = 'white'; ctx.font = 'bold 20px Georgia';
            ctx.fillText(`Level: ${level}   Score: ${score}`, 20, 30);
            
            ctx.font = '14px Georgia'; ctx.fillStyle = '#aaaaaa';
            ctx.fillText(`P1: Move (WASD/L-Stick) | Sword (J/X) | Spear (K/Y) | Crossbow (L/RB)`, 20, logicalHeight - 20);
        }

        function drawMenu() {
            ctx.clearRect(0, 0, logicalWidth, logicalHeight);
            ctx.textAlign = 'center';
            ctx.fillStyle = 'white'; ctx.font = 'bold 54px Georgia';
            ctx.fillText('DRAGON GATE SIEGE', logicalWidth / 2, 140);

            MENU_OPTIONS.forEach((opt, i) => {
                let y = 300 + (i * 100);
                const selected = i === menuIndex;
                ctx.fillStyle = selected ? 'rgba(255, 255, 255, 0.1)' : 'transparent';
                ctx.fillRect(logicalWidth / 2 - 200, y - 40, 400, 80);
                ctx.strokeStyle = selected ? opt.color : '#333';
                ctx.lineWidth = 2; ctx.strokeRect(logicalWidth / 2 - 200, y - 40, 400, 80);

                ctx.fillStyle = opt.color; ctx.font = 'bold 28px Georgia';
                ctx.fillText(opt.title, logicalWidth / 2, y);
                ctx.fillStyle = '#aaaaaa'; ctx.font = '14px Georgia';
                ctx.fillText(opt.subtitle, logicalWidth / 2, y + 25);
            });

            ctx.fillStyle = '#888'; ctx.font = '16px Georgia';
            ctx.fillText('Move: Arrows/Gamepad  •  Select: Space/Enter/A', logicalWidth / 2, logicalHeight - 60);
            ctx.textAlign = 'left';
        }

        // ============================================================
        // MAIN LOOP
        // ============================================================
        function gameLoop() {
            if (gameState === 'MENU') {
                handleMenuInput();
                drawMenu();
            } else if (gameState === 'PLAYING') {
                updateLogic();
                drawGame();
            } else if (gameState === 'LEVEL_CLEAR') {
                drawGame();
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,logicalWidth,logicalHeight);
                drawTextCentered('GATE DESTROYED!', -20, 50, '#44ff44');
                drawTextCentered('Press Space/Enter/A for Next Level', 40, 20, 'white');
                
                let pads = getGamepads();
                if (keys['Space'] || keys['Enter'] || (pads[0] && pads[0].buttons[0].pressed)) {
                    level++;
                    initMode(mode, true);
                }
            } else if (gameState === 'GAME_OVER') {
                drawGame();
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,logicalWidth,logicalHeight);
                drawTextCentered('THE KNIGHTS HAVE FALLEN', -20, 50, '#ff4444');
                drawTextCentered(`Final Score: ${score}`, 30, 24, 'white');
                drawTextCentered('Press Space/Enter/A for Main Menu', 80, 20, '#aaaaaa');

                let pads = getGamepads();
                if (keys['Space'] || keys['Enter'] || (pads[0] && pads[0].buttons[0].pressed)) {
                    gameState = 'MENU';
                }
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        window.addEventListener('resize', () => {
            applyCanvasSize();
            if (gameState === 'PLAYING') {
                door.x = logicalWidth / 2 - door.w / 2;
            }
        });
    </script>
</body>
</html>
