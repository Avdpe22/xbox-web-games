<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Gate Siege</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; color: #e0e0e0; font-family: 'Georgia', serif; user-select: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        canvas.tabIndex = 0;
        // Xbox Edge (console browser) only exposes the Gamepad API to the currently
        // focused document, and gains focus can be lost when loaded inside the hub's
        // iframe -- pull focus onto this game whenever we get a chance to.
        function ensureGameFocus() { window.focus(); canvas.focus({ preventScroll: true }); }
        ensureGameFocus();
        window.addEventListener('load', ensureGameFocus);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureGameFocus(); });
        window.addEventListener('gamepadconnected', ensureGameFocus);
        const ctx = canvas.getContext('2d');

        let dpr = window.devicePixelRatio || 1;
        let logicalWidth = window.innerWidth;
        let logicalHeight = window.innerHeight;
        
        let roadW = 0;
        let roadL = 0;
        let roadR = 0;
        let sceneryTrees = [];
        let currentSealBottom = 0;

        function generateScenery() {
            sceneryTrees = [];
            for(let i=0; i<30; i++) {
                sceneryTrees.push({
                    x: Math.random() * (roadL - 20),
                    y: Math.random() * logicalHeight,
                    r: 15 + Math.random() * 20,
                    color: `rgb(10, ${50 + Math.random()*50}, 20)`
                });
            }
            for(let i=0; i<30; i++) {
                sceneryTrees.push({
                    x: roadR + 20 + (Math.random() * (logicalWidth - roadR - 40)),
                    y: Math.random() * logicalHeight,
                    r: 15 + Math.random() * 20,
                    color: `rgb(10, ${50 + Math.random()*50}, 20)`
                });
            }
        }

        function applyCanvasSize() {
            dpr = window.devicePixelRatio || 1;
            logicalWidth = window.innerWidth;
            logicalHeight = window.innerHeight;
            canvas.width = Math.round(logicalWidth * dpr);
            canvas.height = Math.round(logicalHeight * dpr);
            canvas.style.width = logicalWidth + 'px';
            canvas.style.height = logicalHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            roadW = logicalWidth / 3;
            roadL = roadW;
            roadR = roadW * 2;
            
            generateScenery();
            if (gameState === 'PLAYING') {
                door.w = roadW - 40;
                door.x = roadL + 20;
            }
        }

        // ============================================================
        // AUDIO SYSTEM
        // ============================================================
        let audioCtx;
        let bgmInterval;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            startBGM();
        }

        function playSound(type) {
            if (!audioCtx) return;
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'sword') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'spear') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'crossbow') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'fire') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'gate_fire') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.6);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            let step = 0;
            bgmInterval = setInterval(() => {
                if (gameState !== 'PLAYING') return;
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(step % 4 === 0 ? 65 : 80, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.2);
                step++;
            }, 300);
        }

        // ============================================================
        // GAME STATE
        // ============================================================
        let gameState = 'MENU';
        let continueLocked = false; // require the select button to be released before it can advance past LEVEL_CLEAR/GAME_OVER
        let mode = null; 
        let menuIndex = 0;
        let menuAxisReady = true;
        let level = 1;
        let score = 0;
        const menuButtons = {};

        const MENU_OPTIONS = [
            { id: '1p', title: 'SOLO CRUSADE', color: '#00aaff', subtitle: 'Storm the dragon gates alone.', hint: '1 Player' },
            { id: '2p', title: 'CO-OP SIEGE', color: '#ffaa00', subtitle: 'Two knights, one objective: Break the door.', hint: '2 Players (Controllers recommended)' }
        ];

        // ============================================================
        // ENTITIES & TUNING
        // ============================================================
        const PLAYER_SPEED = 4.5;
        const FIRE_SPEED = 6;
        const BOLT_SPEED = 15;
        
        const CD_SWORD = 40;   
        const CD_SPEAR = 50;   
        const CD_CROSSBOW = 75; 

        const DMG_SWORD = 40;
        const DMG_SPEAR = 25;
        const DMG_CROSSBOW = 15;

        let players = [];
        let dragons = [];
        let dragonSlots = [];
        let spawnTimer = 0;
        let projectiles = [];
        let activeMeleeHitboxes = [];
        let particles = [];
        let shakeTime = 0;

        let door = { x: 0, y: 0, w: 200, h: 80, hp: 150, maxHp: 150, attackTimer: 100 };

        function initMode(selectedMode, isNextLevel = false) {
            initAudio();
            mode = selectedMode;
            if (!isNextLevel) {
                level = 1;
                score = 0;
            }

            door.w = roadW - 40;
            door.x = roadL + 20;
            door.h = 80;
            door.y = 20;
            door.maxHp = 150 + (level * 50); // Low health, easily shattered once exposed
            door.hp = door.maxHp;
            door.attackTimer = 150; 

            projectiles = [];
            activeMeleeHitboxes = [];
            particles = [];
            dragons = [];
            dragonSlots = [];
            spawnTimer = 60; 

            // Setup Dragon Grid
            let rows = 2 + Math.min(3, Math.ceil(level / 2)); // 3 rows at Lv1, 4 at Lv3, etc.
            let cols = Math.max(3, Math.floor(door.w / 60));
            let slotW = door.w / cols;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let cx = door.x + (c * slotW) + (slotW / 2);
                    let cy = door.y + door.h + 40 + (r * 60);
                    let slot = { x: cx, y: cy, dragon: null };
                    
                    let d = createDragon(cx, cy);
                    slot.dragon = d;
                    dragons.push(d);
                    dragonSlots.push(slot);
                }
            }

            if (!isNextLevel) {
                players = [];
                players.push(createPlayer(1, '#00aaff', logicalWidth / 2 - 20, logicalHeight - 100));
                if (mode === '2p') {
                    players.push(createPlayer(2, '#ffaa00', logicalWidth / 2 + 20, logicalHeight - 100));
                }
            } else {
                players.forEach(p => {
                    p.x = logicalWidth / 2 + (p.id === 1 ? -20 : 20);
                    p.y = logicalHeight - 100;
                    p.hp = p.maxHp; 
                });
            }

            gameState = 'PLAYING';
        }

        function createPlayer(id, color, startX, startY) {
            return {
                id: id, color: color, x: startX, y: startY, radius: 15,
                hp: 500, maxHp: 500, cooldowns: { sword: 0, spear: 0, crossbow: 0 },
                buttons: {} 
            };
        }

        function createDragon(x, y) {
            let roll = Math.random();
            let type = 'whelp';
            
            if (level >= 2 && roll > 0.85 - (level * 0.05)) type = 'drake';
            if (level >= 3 && roll > 0.95 - (level * 0.05)) type = 'armored';

            let hp, radius, fireRate, color, secColor;
            
            if (type === 'whelp') { 
                hp = 80; radius = 22; fireRate = 220; color = '#8e0000'; secColor = '#ff4400';
            } else if (type === 'drake') { 
                hp = 60; radius = 18; fireRate = 180; color = '#005500'; secColor = '#00ff00';
            } else { 
                hp = 160; radius = 28; fireRate = 260; color = '#333'; secColor = '#ff8800';
            }
            
            hp += (level * 10); 
            return {
                x, y, type, radius, hp, maxHp: hp, color, secColor,
                fireTimer: Math.random() * fireRate, maxFireRate: fireRate
            };
        }

        function createExplosion(x, y, color, sizeMulti = 1) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                    life: 15, color, size: (Math.random() * 4 + 2) * sizeMulti
                });
            }
        }

        // ============================================================
        // INPUT HANDLING
        // ============================================================
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function getGamepads() {
            return Array.from(navigator.getGamepads()).filter(p => p && p.mapping === 'standard');
        }

        function wasJustPressed(pad, buttonIndex, stateObj, key) {
            if (!pad) return false;
            const btn = pad.buttons[buttonIndex];
            const isPressed = !!btn && btn.pressed;
            const justPressed = isPressed && !stateObj[key];
            stateObj[key] = isPressed;
            return justPressed;
        }

        function handleMenuInput() {
            const pads = getGamepads();
            const pad = pads[0];
            
            let moveUp = keys['ArrowUp'] || keys['KeyW'];
            let moveDown = keys['ArrowDown'] || keys['KeyS'];
            let select = keys['Enter'] || keys['Space'];

            if (pad) {
                if (pad.axes[1] < -0.5 || (pad.buttons[12] && pad.buttons[12].pressed)) moveUp = true;
                if (pad.axes[1] > 0.5 || (pad.buttons[13] && pad.buttons[13].pressed)) moveDown = true;
                if (wasJustPressed(pad, 0, menuButtons, 'A')) select = true;
            } else {
                if (select && !menuButtons['A']) { select = true; menuButtons['A'] = true; }
                else if (!select) { menuButtons['A'] = false; select = false; }
            }

            if (!moveUp && !moveDown) menuAxisReady = true;
            else if (menuAxisReady) {
                menuIndex = (menuIndex + (moveDown ? 1 : -1) + MENU_OPTIONS.length) % MENU_OPTIONS.length;
                menuAxisReady = false;
            }

            if (select) {
                initMode(MENU_OPTIONS[menuIndex].id);
            }
        }

        function handlePlayerInput() {
            const pads = getGamepads();

            players.forEach((p, idx) => {
                if (p.hp <= 0) return;
                let pad = pads[idx];
                
                let vx = 0, vy = 0;
                let atkSword = false, atkSpear = false, atkCrossbow = false;

                if (idx === 0 && !pad) {
                    if (keys['ArrowLeft'] || keys['KeyA']) vx = -1;
                    if (keys['ArrowRight'] || keys['KeyD']) vx = 1;
                    if (keys['ArrowUp'] || keys['KeyW']) vy = -1;
                    if (keys['ArrowDown'] || keys['KeyS']) vy = 1;
                    if (keys['KeyJ']) atkSword = true;
                    if (keys['KeyK']) atkSpear = true;
                    if (keys['KeyL'] || keys['Space']) atkCrossbow = true;
                }

                if (pad) {
                    if (Math.abs(pad.axes[0]) > 0.2) vx = pad.axes[0];
                    if (Math.abs(pad.axes[1]) > 0.2) vy = pad.axes[1];
                    if (pad.buttons[2].pressed) atkSword = true;
                    if (pad.buttons[3].pressed) atkSpear = true;
                    if (pad.buttons[5].pressed) atkCrossbow = true;
                }

                p.x += vx * PLAYER_SPEED;
                p.y += vy * PLAYER_SPEED;

                // Bounds constrained to the ROAD and the SEAL
                p.x = Math.max(roadL + p.radius, Math.min(roadR - p.radius, p.x));
                p.y = Math.max(currentSealBottom + p.radius + 10, Math.min(logicalHeight - p.radius, p.y)); 

                if (p.cooldowns.sword > 0) p.cooldowns.sword--;
                if (p.cooldowns.spear > 0) p.cooldowns.spear--;
                if (p.cooldowns.crossbow > 0) p.cooldowns.crossbow--;

                if (atkSword && p.cooldowns.sword <= 0) {
                    p.cooldowns.sword = CD_SWORD;
                    playSound('sword');
                    activeMeleeHitboxes.push({ 
                        x: p.x - 40, y: p.y - 50, w: 80, h: 40, 
                        damage: DMG_SWORD, life: 8, color: '#ffffff', owner: p 
                    });
                }
                if (atkSpear && p.cooldowns.spear <= 0) {
                    p.cooldowns.spear = CD_SPEAR;
                    playSound('spear');
                    activeMeleeHitboxes.push({ 
                        x: p.x - 10, y: p.y - 100, w: 20, h: 90, 
                        damage: DMG_SPEAR, life: 10, color: '#cccccc', owner: p 
                    });
                }
                if (atkCrossbow && p.cooldowns.crossbow <= 0) {
                    p.cooldowns.crossbow = CD_CROSSBOW;
                    playSound('crossbow');
                    projectiles.push({
                        x: p.x, y: p.y - 15, vx: 0, vy: -BOLT_SPEED,
                        damage: DMG_CROSSBOW, isFire: false, size: 4
                    });
                }
            });
        }

        // ============================================================
        // GAME LOGIC UPDATES
        // ============================================================
        function getNearestPlayer(dx, dy) {
            let nearest = null;
            let minDist = Infinity;
            players.forEach(p => {
                if (p.hp > 0) {
                    let dist = Math.hypot(p.x - dx, p.y - dy);
                    if (dist < minDist) { minDist = dist; nearest = p; }
                }
            });
            return nearest;
        }

        function updateLogic() {
            // Calculate Current Seal Bottom before player input
            if (dragons.length > 0) {
                currentSealBottom = Math.max(...dragons.map(d => d.y + d.radius)) + 15;
            } else {
                currentSealBottom = door.y + door.h;
            }

            handlePlayerInput();

            if (players.every(p => p.hp <= 0)) {
                gameState = 'GAME_OVER';
                continueLocked = true;
                return;
            }

            // GATE ATTACKS
            door.attackTimer--;
            if (door.attackTimer <= 0) {
                playSound('gate_fire');
                door.attackTimer = 180 - Math.min(60, level * 10);
                
                projectiles.push({ 
                    x: door.x + door.w/2, 
                    y: door.y + door.h, 
                    vx: 0, 
                    vy: FIRE_SPEED * 1.5, 
                    damage: 25 + level*5, 
                    isFire: true, 
                    size: 30 
                });
                
                projectiles.push({ x: door.x + 20, y: door.y + door.h, vx: -2, vy: FIRE_SPEED, damage: 15, isFire: true, size: 12 });
                projectiles.push({ x: door.x + door.w - 20, y: door.y + door.h, vx: 2, vy: FIRE_SPEED, damage: 15, isFire: true, size: 12 });
                
                shakeTime = 8;
            }

            // Dragon Spawning within the Seal
            let maxDragons = 4 + (level * 2); 
            spawnTimer--;
            
            // Only spawn in slots that are at or above the current seal line
            let eligibleSlots = dragonSlots.filter(s => !s.dragon && s.y <= currentSealBottom + 10);

            if (spawnTimer <= 0 && eligibleSlots.length > 0 && dragons.length < maxDragons) {
                let slot = eligibleSlots[Math.floor(Math.random() * eligibleSlots.length)];
                let newDragon = createDragon(slot.x, slot.y);
                slot.dragon = newDragon;
                dragons.push(newDragon);
                createExplosion(slot.x, slot.y, '#aa0000', 1.5);
                spawnTimer = Math.max(80, 180 - (level * 15)); 
            }

            // Dragon Logic
            for (let i = dragons.length - 1; i >= 0; i--) {
                let d = dragons[i];
                if (d.hp <= 0) {
                    createExplosion(d.x, d.y, d.color, 2);
                    playSound('hit');
                    score += (d.type === 'armored' ? 300 : (d.type === 'drake' ? 200 : 100));
                    
                    // Clear from slot
                    let slot = dragonSlots.find(s => s.dragon === d);
                    if (slot) slot.dragon = null;

                    dragons.splice(i, 1);
                    continue;
                }

                d.fireTimer--;
                if (d.fireTimer <= 0) {
                    d.fireTimer = d.maxFireRate + (Math.random() * 60);
                    playSound('fire');
                    
                    if (d.type === 'whelp') {
                        projectiles.push({ x: d.x, y: d.y + 15, vx: 0, vy: FIRE_SPEED, damage: 15 + level, isFire: true, size: 8 });
                    } else if (d.type === 'drake') {
                        let target = getNearestPlayer(d.x, d.y);
                        let angle = target ? Math.atan2(target.y - d.y, target.x - d.x) : Math.PI/2;
                        projectiles.push({ x: d.x, y: d.y + 15, vx: Math.cos(angle)*FIRE_SPEED*1.2, vy: Math.sin(angle)*FIRE_SPEED*1.2, damage: 10 + level, isFire: true, size: 6 });
                    } else if (d.type === 'armored') {
                        projectiles.push({ x: d.x, y: d.y + 15, vx: 0, vy: FIRE_SPEED*0.8, damage: 20 + level*2, isFire: true, size: 12 });
                        projectiles.push({ x: d.x, y: d.y + 15, vx: -3, vy: FIRE_SPEED*0.8, damage: 20 + level*2, isFire: true, size: 12 });
                        projectiles.push({ x: d.x, y: d.y + 15, vx: 3, vy: FIRE_SPEED*0.8, damage: 20 + level*2, isFire: true, size: 12 });
                    }
                }
            }

            // Projectile Logic
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let pr = projectiles[i];
                pr.x += pr.vx;
                pr.y += pr.vy;
                let removed = false;

                if (pr.y < 0 || pr.y > logicalHeight || pr.x < roadL || pr.x > roadR) {
                    projectiles.splice(i, 1);
                    continue;
                }

                if (pr.isFire) {
                    players.forEach(p => {
                        if (p.hp > 0 && Math.hypot(p.x - pr.x, p.y - pr.y) < p.radius + pr.size) {
                            p.hp -= pr.damage;
                            playSound('hit');
                            createExplosion(p.x, p.y, '#ff8800', 0.8);
                            removed = true;
                            shakeTime = 5;
                        }
                    });
                } else {
                    // Check against dragons first
                    dragons.forEach(d => {
                        if (!removed && Math.hypot(d.x - pr.x, d.y - pr.y) < d.radius + pr.size) {
                            d.hp -= pr.damage;
                            playSound('hit');
                            createExplosion(pr.x, pr.y, '#ffcc00', 0.5);
                            removed = true;
                        }
                    });
                    
                    // If it bypassed dragons and hit the seal line
                    if (!removed && dragons.length > 0 && pr.y < currentSealBottom) {
                        createExplosion(pr.x, currentSealBottom, '#00ffff', 0.5);
                        removed = true;
                    } 
                    // If seal is down and it hit the door
                    else if (!removed && dragons.length === 0 && pr.x > door.x && pr.x < door.x + door.w && pr.y > door.y && pr.y < door.y + door.h) {
                        door.hp -= pr.damage;
                        playSound('hit');
                        createExplosion(pr.x, pr.y, '#aaaaaa', 0.5);
                        removed = true;
                    }
                }

                if (removed) projectiles.splice(i, 1);
            }

            // Melee Hitbox Logic
            for (let i = activeMeleeHitboxes.length - 1; i >= 0; i--) {
                let hb = activeMeleeHitboxes[i];
                hb.life--;
                
                if (hb.owner) {
                    if (hb.w > hb.h) { hb.x = hb.owner.x - 40; hb.y = hb.owner.y - 50; } 
                    else { hb.x = hb.owner.x - 10; hb.y = hb.owner.y - 100; }
                }

                let hitDragon = false;
                dragons.forEach(d => {
                    if (d.x + d.radius > hb.x && d.x - d.radius < hb.x + hb.w &&
                        d.y + d.radius > hb.y && d.y - d.radius < hb.y + hb.h) {
                        d.hp -= hb.damage / 5; 
                        createExplosion(d.x, d.y, d.color, 0.2);
                        hitDragon = true;
                    }
                });

                // Hit Seal
                if (!hitDragon && dragons.length > 0 && hb.y < currentSealBottom) {
                    createExplosion(hb.x + hb.w/2, currentSealBottom, '#00ffff', 0.2);
                    if (hb.owner) hb.owner.y += 3.5; // Melee Recoil
                } 
                // Hit Gate
                else if (dragons.length === 0 && hb.y < door.y + door.h && hb.x + hb.w > door.x && hb.x < door.x + door.w) {
                    door.hp -= hb.damage / 5; 
                    createExplosion(hb.x + hb.w/2, door.y + door.h, '#aaaaaa', 0.2);
                    if (hb.owner) hb.owner.y += 3.5; // Melee Recoil
                }

                if (hb.life <= 0) activeMeleeHitboxes.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            if (door.hp <= 0) {
                score += 5000 * level;
                gameState = 'LEVEL_CLEAR';
                continueLocked = true;
            }
        }

        // ============================================================
        // DRAWING
        // ============================================================
        function drawTextCentered(text, yOffset, size, color) {
            ctx.fillStyle = color; ctx.font = `bold ${size}px Georgia`;
            ctx.textAlign = 'center'; ctx.fillText(text, logicalWidth / 2, logicalHeight / 2 + yOffset);
            ctx.textAlign = 'left';
        }

        function drawGame() {
            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            // Draw Grass Sides
            ctx.fillStyle = '#1b3a1a';
            ctx.fillRect(0, 0, roadL, logicalHeight);
            ctx.fillRect(roadR, 0, logicalWidth - roadR, logicalHeight);

            // Draw Scenery Trees
            sceneryTrees.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI, true); ctx.fill();
            });

            // Draw Road
            ctx.fillStyle = '#2c2c30';
            ctx.fillRect(roadL, 0, roadW, logicalHeight);
            ctx.fillStyle = '#1e1e22';
            for (let i = roadL; i < roadR; i+=60) {
                ctx.fillRect(i, 0, 2, logicalHeight);
            }

            ctx.save();
            if (shakeTime > 0) {
                const shakeMag = 5 * (shakeTime / 10);
                ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);
                shakeTime--;
            }

            // Draw Dynamic Dragon Seal
            if (dragons.length > 0) {
                ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
                ctx.fillRect(door.x, door.y + door.h, door.w, currentSealBottom - (door.y + door.h));
                
                ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + Math.sin(Date.now()*0.005)*0.3})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(door.x, currentSealBottom);
                ctx.lineTo(door.x + door.w, currentSealBottom);
                ctx.stroke();
            }

            // Draw Door
            ctx.fillStyle = '#37474f';
            ctx.fillRect(door.x, door.y, door.w, door.h);
            ctx.fillStyle = '#111';
            for (let i = 0; i < door.w; i += 20) {
                ctx.fillRect(door.x + i, door.y, 4, door.h);
            }
            
            // Draw Door Warning
            if (door.attackTimer < 40) {
                ctx.fillStyle = `rgba(255, 100, 0, ${1 - (door.attackTimer/40)})`;
                ctx.fillRect(door.x + door.w/2 - 20, door.y + door.h - 10, 40, 10);
            }

            let doorHpPct = Math.max(0, door.hp / door.maxHp);
            ctx.fillStyle = 'red'; ctx.fillRect(door.x, door.y - 10, door.w, 6);
            ctx.fillStyle = dragons.length > 0 ? '#555555' : '#ffaa00'; 
            ctx.fillRect(door.x, door.y - 10, door.w * doorHpPct, 6);

            // Draw Dragons
            dragons.forEach(d => {
                ctx.fillStyle = d.color;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = d.secColor; 
                ctx.beginPath(); ctx.arc(d.x, d.y+(d.radius/2), d.radius/1.5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'yellow';
                let eyeOffset = d.radius / 3;
                ctx.beginPath(); ctx.arc(d.x - eyeOffset, d.y - 5, 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(d.x + eyeOffset, d.y - 5, 4, 0, Math.PI * 2); ctx.fill();

                let hpPct = Math.max(0, d.hp / d.maxHp);
                ctx.fillStyle = 'red'; ctx.fillRect(d.x - 20, d.y - d.radius - 10, 40, 4);
                ctx.fillStyle = '#00ff00'; ctx.fillRect(d.x - 20, d.y - d.radius - 10, 40 * hpPct, 4);
            });

            // Draw Players
            players.forEach(p => {
                if (p.hp <= 0) return;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath(); ctx.ellipse(p.x, p.y + p.radius, p.radius, p.radius/2, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#b0bec5'; 
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = p.color; ctx.fillRect(p.x - 8, p.y - 8, 16, 16);
                ctx.fillStyle = '#111'; ctx.fillRect(p.x - 10, p.y - 12, 20, 6);

                let hpPct = Math.max(0, p.hp / p.maxHp);
                ctx.fillStyle = 'red'; ctx.fillRect(p.x - 15, p.y + p.radius + 5, 30, 4);
                ctx.fillStyle = '#00ff88'; ctx.fillRect(p.x - 15, p.y + p.radius + 5, 30 * hpPct, 4);
            });

            // Draw Hitboxes
            activeMeleeHitboxes.forEach(hb => {
                ctx.fillStyle = hb.color; ctx.globalAlpha = hb.life / 10;
                if (hb.w > hb.h) {
                    ctx.beginPath(); ctx.ellipse(hb.x + hb.w/2, hb.y + hb.h/2, hb.w/2, hb.h/2, 0, Math.PI, 0); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.moveTo(hb.x + hb.w/2, hb.y); ctx.lineTo(hb.x + hb.w, hb.y + hb.h); ctx.lineTo(hb.x, hb.y + hb.h); ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            });

            // Draw Projectiles
            projectiles.forEach(pr => {
                ctx.fillStyle = pr.isFire ? '#ff6600' : '#eceff1';
                ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size, 0, Math.PI * 2); ctx.fill();
                if (pr.isFire) {
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size/2, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.strokeStyle = '#aaaaaa'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(pr.x, pr.y); ctx.lineTo(pr.x, pr.y + 15); ctx.stroke();
                }
            });

            // Draw Particles
            particles.forEach(pt => {
                ctx.fillStyle = pt.color; ctx.globalAlpha = pt.life / 15;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();

            // HUD
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, logicalWidth, 40);
            ctx.fillStyle = 'white'; ctx.font = 'bold 20px Georgia';
            ctx.fillText(`Level: ${level}   Score: ${score}`, 20, 26);
            
            if (dragons.length > 0) {
                ctx.fillStyle = '#00ffff';
                ctx.fillText(`SEAL ACTIVE - CLEAR THE DRAGONS`, logicalWidth/2 - 180, 26);
            } else {
                ctx.fillStyle = '#ff4444';
                ctx.fillText(`GATE EXPOSED! STRIKE NOW!`, logicalWidth/2 - 140, 26);
            }
            
            ctx.font = '14px Georgia'; ctx.fillStyle = '#aaaaaa';
            ctx.fillText(`P1: Move (WASD) | Sword (J) | Spear (K) | Crossbow (L)`, 20, logicalHeight - 20);
        }

        function drawMenu() {
            ctx.clearRect(0, 0, logicalWidth, logicalHeight);
            
            ctx.fillStyle = '#111'; ctx.fillRect(0,0,logicalWidth,logicalHeight);
            ctx.fillStyle = '#2c2c30'; ctx.fillRect(roadL, 0, roadW, logicalHeight);
            
            ctx.textAlign = 'center';
            ctx.fillStyle = 'white'; ctx.font = 'bold 54px Georgia';
            ctx.fillText('DRAGON GATE SIEGE', logicalWidth / 2, 140);

            MENU_OPTIONS.forEach((opt, i) => {
                let y = 300 + (i * 100);
                const selected = i === menuIndex;
                ctx.fillStyle = selected ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0,0,0,0.8)';
                ctx.fillRect(logicalWidth / 2 - 200, y - 40, 400, 80);
                ctx.strokeStyle = selected ? opt.color : '#333';
                ctx.lineWidth = 2; ctx.strokeRect(logicalWidth / 2 - 200, y - 40, 400, 80);

                ctx.fillStyle = opt.color; ctx.font = 'bold 28px Georgia';
                ctx.fillText(opt.title, logicalWidth / 2, y);
                ctx.fillStyle = '#aaaaaa'; ctx.font = '14px Georgia';
                ctx.fillText(opt.subtitle, logicalWidth / 2, y + 25);
            });

            ctx.fillStyle = '#888'; ctx.font = '16px Georgia';
            ctx.fillText('Move: Arrows/Gamepad  •  Select: Space/Enter/A', logicalWidth / 2, logicalHeight - 60);
            ctx.textAlign = 'left';
        }

        // ============================================================
        // MAIN LOOP
        // ============================================================
        function gameLoop() {
            if (gameState === 'MENU') {
                handleMenuInput();
                drawMenu();
            } else if (gameState === 'PLAYING') {
                updateLogic();
                drawGame();
            } else if (gameState === 'LEVEL_CLEAR') {
                drawGame();
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,logicalWidth,logicalHeight);
                drawTextCentered('GATE DESTROYED!', -20, 50, '#44ff44');
                drawTextCentered('Press Space/Enter/A for Next Level', 40, 20, 'white');
                
                let pads = getGamepads();
                let selectPressed = keys['Space'] || keys['Enter'] || (pads[0] && pads[0].buttons[0].pressed);
                if (continueLocked) {
                    if (!selectPressed) continueLocked = false;
                } else if (selectPressed) {
                    level++;
                    initMode(mode, true);
                }
            } else if (gameState === 'GAME_OVER') {
                drawGame();
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,logicalWidth,logicalHeight);
                drawTextCentered('THE KNIGHTS HAVE FALLEN', -20, 50, '#ff4444');
                drawTextCentered(`Final Score: ${score}`, 30, 24, 'white');
                drawTextCentered('Press Space/Enter/A for Main Menu', 80, 20, '#aaaaaa');

                let pads = getGamepads();
                let selectPressed = keys['Space'] || keys['Enter'] || (pads[0] && pads[0].buttons[0].pressed);
                if (continueLocked) {
                    if (!selectPressed) continueLocked = false;
                } else if (selectPressed) {
                    gameState = 'MENU';
                }
            }

            requestAnimationFrame(gameLoop);
        }

        applyCanvasSize();
        requestAnimationFrame(gameLoop);

        window.addEventListener('resize', applyCanvasSize);
    </script>
</body>
</html>
